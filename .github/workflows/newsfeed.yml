name: CTE newsfeed

on:
  schedule:
    # Safety-net only, not the primary clock. GitHub's own `schedule:` trigger is empirically
    # unreliable at high frequency on this repo — real gaps of 2-5h were observed against a
    # */30 setting (2026-09-11 investigation) — so the actual 15-20 min cadence is driven by an
    # external service calling the workflow_dispatch API below (see newsfeed/README.md for setup).
    # This schedule just fires occasionally in case that external trigger is ever down.
    - cron: '*/45 * * * *'
  workflow_dispatch:            # "Run workflow" button for manual runs, and the external trigger's target

concurrency:
  group: newsfeed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: newsfeed/requirements.txt

      - run: pip install -r newsfeed/requirements.txt

      # Seen-id cache: restores the newest snapshot (restore-keys prefix match), saves a fresh
      # one every run (unique key). Keeps Firestore reads near zero.
      - name: Restore seen-id cache
        uses: actions/cache/restore@v4
        with:
          path: newsfeed/.cache
          key: newsfeed-v3-${{ github.run_id }}
          restore-keys: |
            newsfeed-v3-

      - name: Collect, classify, write to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          NEWS_MAX_NEW: ${{ vars.NEWS_MAX_NEW || '80' }}
          NEWS_MIN_STORE: ${{ vars.NEWS_MIN_STORE || '30' }}
        run: python newsfeed/collector.py

      - name: Save seen-id cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: newsfeed/.cache
          key: newsfeed-v3-${{ github.run_id }}
