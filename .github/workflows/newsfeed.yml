name: CTE newsfeed

on:
  schedule:
    - cron: '*/30 * * * *'      # every 30 minutes (UTC). GitHub may delay a few minutes.
  workflow_dispatch:            # "Run workflow" button for manual runs

concurrency:
  group: newsfeed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: newsfeed/requirements.txt

      - run: pip install -r newsfeed/requirements.txt

      # Seen-id cache: restores the newest snapshot (restore-keys prefix match), saves a fresh
      # one every run (unique key). Keeps Firestore reads near zero.
      - name: Restore seen-id cache
        uses: actions/cache/restore@v4
        with:
          path: newsfeed/.cache
          key: newsfeed-seen-${{ github.run_id }}
          restore-keys: |
            newsfeed-seen-

      - name: Collect, classify, write to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          NEWS_MAX_NEW: ${{ vars.NEWS_MAX_NEW || '80' }}
        run: python newsfeed/collector.py

      - name: Save seen-id cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: newsfeed/.cache
          key: newsfeed-seen-${{ github.run_id }}
