function renderNewsChart(){
  const box = document.createElement('div');
  box.className = 'news-chart';
  // `now`/`count` stay the exact trailing-24h sum (tile/header number, fully traceable back to
  // specific headlines); the chart LINE itself uses newsSmoothSeries() below — see its comment.
  const { now, count } = newsSeries(newsUI.chartProduct);
  const rangeDef = NEWS_CHART_RANGES.find(r => r.key === newsUI.chartRange) || NEWS_CHART_RANGES[2];
  // The X-axis window is the range chip itself (now − N days → now), not derived from whatever
  // data happens to exist — so "5Y" always spans a real 5 years, even if net-impact events are
  // sparse in it, and always lines up with however much price history is available.
  const xMax = Date.now();
  const xMin = xMax - rangeDef.days * 24 * 3600 * 1000;
  const shownPts = newsSmoothSeries(newsUI.chartProduct, xMin, xMax);
  const rangeNote = '';
  // Real price history from Firestore prices/{product} (collector.py's sync_prices()). MACRO never
  // has one — it keeps its separate TradingView DXY/VIX widgets below, untouched. "Daily" uses the
  // live-ish intraday series (5-minute bars, refreshed every collector run) instead of the 5y daily
  // series — a single daily close can't show same-day movement, which is what Daily is for.
  const priceRec = newsPrices[newsUI.chartProduct];
  const useIntraday = rangeDef.key === '1D';
  const rawBars = priceRec && Array.isArray(useIntraday ? priceRec.intraday : priceRec.bars)
    ? (useIntraday ? cleanIntraday(priceRec.intraday) : priceRec.bars) : [];
  const priceBars = rawBars.filter(b => b.t >= xMin && b.t <= xMax).sort((a, b) => a.t - b.t);

  const hasPriceLine = priceBars.length >= 2;
  const head = document.createElement('div');
  head.className = 'news-chart-head';
  head.innerHTML = `<span class="news-chart-title">${newsUI.chartProduct} · net impact${hasPriceLine ? ' + price' : ''}</span>` +
    `<span class="news-chart-latest ${now.net > 0 ? 'pos' : now.net < 0 ? 'neg' : ''}">${now.n ? newsFmtSigned(now.net) : '—'}</span>` +
    `<span class="news-chart-sub">${now.bull} bullish / ${now.bear} bearish · ${now.n} events · ${count} in ${NEWS_HISTORY_DAYS}d${rangeNote}</span>` +
    // Color-coded legend (2026-09-14, Mete's request — the two lines weren't labeled anywhere) so
    // it's obvious which line is which without guessing from color alone: blue = net impact (same
    // stroke as .news-line), gold = futures price (same stroke as .news-price-line / var(--accent)).
    (hasPriceLine ? `<span class="news-legend">
        <span class="news-legend-item"><span class="news-legend-dot" style="background:#5eb3f6"></span>Net impact (smoothed)</span>
        <span class="news-legend-item"><span class="news-legend-dot" style="background:var(--accent)"></span>${PRICE_LABELS[newsUI.chartProduct] || 'Futures price'}</span>
      </span>` : '');
  box.appendChild(head);

  const svgWrap = document.createElement('div');
  svgWrap.className = 'news-svg-wrap';
  const width = Math.max(320, Math.min(900, (document.getElementById('newstab')?.clientWidth || 360) - 24));
  const height = 150;
  const { html, meta } = newsChartSvg(shownPts, priceBars, xMin, xMax, width, height);
  svgWrap.innerHTML = html;
  box.appendChild(svgWrap);

  // Mouse-hover tooltip (2026-09-14, Mete's request): a vertical guide line + a small tooltip
  // showing that date's net impact and price, built as plain absolutely-positioned HTML overlay
  // elements rather than SVG nodes — simpler to position and doesn't need re-parsing the SVG.
  if (meta){
    const guide = document.createElement('div');
    guide.className = 'news-hover-line';
    guide.hidden = true;
    const tip = document.createElement('div');
    tip.className = 'news-hover-tip';
    tip.hidden = true;
    svgWrap.appendChild(guide);
    svgWrap.appendChild(tip);
    const onMove = (clientX) => {
      const rect = svgWrap.getBoundingClientRect();
      if (!rect.width) return;
      const xPx = clientX - rect.left;
      const leftPct = (xPx / rect.width) * 100;
      // Convert the mouse position (rendered CSS px, scaled by the responsive SVG) back into
      // viewBox units, then into a timestamp, using the exact same padding the chart was drawn with.
      const xInner = (xPx / rect.width) * meta.width;
      if (xInner < meta.padL - 4 || xInner > meta.padL + meta.w + 4 || leftPct < 0 || leftPct > 100){
        guide.hidden = true; tip.hidden = true; return;
      }
      const clampedInner = Math.min(Math.max(xInner, meta.padL), meta.padL + meta.w);
      const ms = meta.xMin + (clampedInner - meta.padL) / meta.w * (meta.xMax - meta.xMin);
      let nearestNet = null, bestNetD = Infinity;
      for (const p of shownPts){ const d = Math.abs(p.ms - ms); if (d < bestNetD){ bestNetD = d; nearestNet = p; } }
      let nearestPrice = null, bestPriceD = Infinity;
      for (const b of priceBars){ const d = Math.abs(b.t - ms); if (d < bestPriceD){ bestPriceD = d; nearestPrice = b; } }
      guide.style.left = leftPct + '%';
      guide.hidden = false;
      const lines = [`<div class="news-hover-date">${newsFmtTime(ms)}</div>`];
      if (nearestNet) lines.push(`<div>net impact (smoothed): <b class="${nearestNet.net > 0 ? 'pos' : nearestNet.net < 0 ? 'neg' : ''}">${newsFmtSigned(nearestNet.net)}</b></div>`);
      if (nearestPrice) lines.push(`<div>price: <b>${newsFmtPrice(nearestPrice.c)}</b></div>`);
      tip.innerHTML = lines.join('');
      tip.style.left = Math.min(Math.max(leftPct, 10), 90) + '%';
      tip.hidden = false;
    };
    svgWrap.addEventListener('pointermove', (e) => onMove(e.clientX));
    svgWrap.addEventListener('pointerleave', () => { guide.hidden = true; tip.hidden = true; });
  }
  return box;
}

// Live market reference under the impact chart: TradingView's free public embed widgets (no
// scraping, no API key). Front-month/continuous only, not the individual forward contracts
// (WZ26, WH27, …) — those need a licensed data vendor, a separate decision (agreed 2026-09-11).
//
// IMPORTANT (found 2026-09-11, after WHEAT/CORN/SBM/DXY/VIX all showed "This symbol is only
// available on TradingView" in production): TradingView's free embed widgets do NOT carry
// official-exchange data (CBOT futures like CBOT:ZW1!/ZC1!/ZM1!, or TVC:DXY/TVC:VIX index data)
// for anonymous embedding on someone else's site — confirmed by testing the same symbols on
// TradingView's own "Advanced Real-Time Chart" widget, not just the small ones, so it's a data
// licensing restriction, not a bot-block and not something we can work around technically.
// Broker CFD symbols (FOREXCOM:*, CAPITALCOM:*, same family as TVC:UKOIL/Brent which already
// worked) ARE free to embed and track the underlying market closely, so we use those instead.
// 2026-09-14 update: WHEAT/CORN/SBM/FREIGHT no longer use these CFD-proxy TradingView embeds — a
// cross-origin iframe can't be read from or merged with our own SVG, so those four now get a real
// price line (Yahoo Finance ZW=F/ZC=F/ZM=F/BZ=F via collector.py) drawn straight into the net-impact
// chart itself (see newsChartSvg/renderNewsChart). MACRO is kept exactly as before — DXY/VIX have no
// futures price series of their own to merge in, so they stay as separate TradingView widgets.
const NEWS_PRICE_SYMBOLS = {
  MACRO: [{ symbol: 'CAPITALCOM:DXY', label: 'US Dollar Index (DXY)' }, { symbol: 'CAPITALCOM:VIX', label: 'VIX' }],
};

// No longer needed now that WHEAT/CORN/SBM/FREIGHT get real price data merged into their own
// chart directly (see NEWS_PRICE_SYMBOLS comment above) — SBM's chart now shows real ZM=F closes,
// not the old Soybean CFD proxy, so the "real data is elsewhere" click-through no longer applies.
const NEWS_PRICE_EXTRA_LINK = {};

// Cache built widget DOM nodes per product+range so switching back to an already-seen combination
// (or a Firestore-triggered re-render while staying on the same product/range) reuses the live
// iframe instead of tearing it down and reloading it — TradingView widgets are heavier than our own
// inline SVG. Keyed by range too (not just product) because the TradingView dateRange is baked into
// the widget's script config at creation time and can't be changed on an already-built widget.
const newsPriceWidgetCache = {};

function tvWidget(scriptFile, symbol, height, dateRange){
  const container = document.createElement('div');
  container.className = 'tradingview-widget-container';
  container.appendChild(document.createElement('div'));
  const script = document.createElement('script');
  script.src = `https://s3.tradingview.com/external-embedding/embed-widget-${scriptFile}.js`;
  script.async = true;
  script.text = JSON.stringify({
    symbol, width: '100%', height, locale: 'en', dateRange: dateRange || '1D',
    colorTheme: 'dark', isTransparent: true, autosize: false, chartOnly: false,
  });
  container.appendChild(script);
  return container;
}

function renderNewsPriceWidget(){
  const product = newsUI.chartProduct;
  const specs = NEWS_PRICE_SYMBOLS[product];
  if (!specs) return null;
  const rangeDef = NEWS_CHART_RANGES.find(r => r.key === newsUI.chartRange) || NEWS_CHART_RANGES[2];
  const cacheKey = product + '_' + rangeDef.key;
  const box = document.createElement('div');
  box.className = 'news-chart news-price-widget';
  const head = document.createElement('div');
  head.className = 'news-chart-head';
  head.innerHTML = `<span class="news-chart-title">${specs.map(s => s.label).join(' · ')}</span>` +
    `<span class="news-chart-sub">${rangeDef.label} · live · TradingView</span>`;
  box.appendChild(head);
  const extra = NEWS_PRICE_EXTRA_LINK[product];
  if (extra){
    const a = document.createElement('a');
    a.href = extra.href; a.target = '_blank'; a.rel = 'noopener';
    a.className = 'news-price-extra-link';
    a.textContent = extra.label;
    box.appendChild(a);
  }
  if (newsPriceWidgetCache[cacheKey]){
    box.appendChild(newsPriceWidgetCache[cacheKey]);
    return box;
  }
  const wrap = document.createElement('div');
  wrap.className = 'news-price-embed';
  for (const { symbol } of specs){
    const col = document.createElement('div');
    col.style.flex = specs.length > 1 ? '1 1 260px' : '1 1 100%';
    // Only the "mini-symbol-overview" widget: it already shows name/price/%chg plus the chart in
    // one piece. The "symbol-info" strip widget we used before is equity-only (EPS/market cap/P-E
    // fields) — it silently falls back to a demo AAPL quote for any non-stock symbol, which is
    // exactly the bug that made WHEAT/CORN/SBM look broken even for symbols that do carry data.
    col.appendChild(tvWidget('mini-symbol-overview', symbol, 160, rangeDef.tv));
    wrap.appendChild(col);
  }
  newsPriceWidgetCache[cacheKey] = wrap;
  box.appendChild(wrap);
  return box;
}

// Breaking ticker: the newest breaking events of the last 48h, scrolling like a news channel.
function renderNewsTicker(){
  const since = Date.now() - 48 * 3600 * 1000;
  const items = newsDocs.filter(s => s.breaking === true && s.ms >= since && newsVisible(s)).sort((a, b) => b.ms - a.ms).slice(0, 12);
  if (!items.length) return null;
  const bar = document.createElement('div');
  bar.className = 'news-ticker';
  const label = document.createElement('span');
  label.className = 'news-ticker-label';
  label.textContent = 'BREAKING';
  const track = document.createElement('div');
  track.className = 'news-ticker-track';
  const inner = document.createElement('div');
  inner.className = 'news-ticker-inner';
  const mk = () => items.map(s => {
    const a = document.createElement('a');
    a.className = 'news-ticker-item ' + (s.direction === 'BULLISH' ? 'bull' : s.direction === 'BEARISH' ? 'bear' : 'neu');
    a.href = s.url || '#'; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = `${newsFmtTime(s.ms)} · ${s.product} ${s.direction === 'BULLISH' ? '▲' : s.direction === 'BEARISH' ? '▼' : '•'} ${s.impact} · ${s.headline}`;
    return a;
  });
  mk().forEach(a => inner.appendChild(a));
  mk().forEach(a => inner.appendChild(a));      // duplicated so the loop is seamless
  const tickerDurationSec = Math.max(20, items.length * 9);   // kept in JS, not re-read from
                                                                // inline style — see resume() below
  inner.style.animationDuration = tickerDurationSec + 's';
  track.appendChild(inner);
  bar.appendChild(label); bar.appendChild(track);

  // Hovering (desktop) or pressing-and-holding (touch) pauses the strip; press-and-drag lets you
  // scrub it left/right by hand instead of waiting for the loop to come back around. Releasing
  // always resumes the auto-scroll from wherever you left it, never snapping back to the start.
  // Handled entirely here in JS so hover, touch-hold and drag-release all share one mechanism —
  // a CSS-only `:hover{ animation-play-state:paused }` can't also support manual scrubbing,
  // because a still-running (even paused) CSS animation keeps owning `transform` and ignores
  // any inline transform we'd try to drive by hand.
  let dragging = false, dragMoved = false, dragStartX = 0, dragBaseTx = 0, singleWidth = 0;
  const txNow = () => {
    const m = getComputedStyle(inner).transform;
    const mm = m && m.match(/matrix\(([^)]+)\)/);
    return mm ? (parseFloat(mm[1].split(',')[4]) || 0) : 0;
  };
  const detach = () => {                        // freeze the animation, hand transform control to us
    const tx = txNow();
    inner.style.animation = 'none';
    inner.style.transform = `translateX(${tx}px)`;
    return tx;
  };
  const resume = () => {                         // restart the auto-scroll from the current spot
    const tx = txNow();
    singleWidth = singleWidth || inner.scrollWidth / 2;   // content is duplicated once, for the loop
    // NOTE: always use the captured tickerDurationSec, never re-read inner.style.animationDuration
    // here — detach() sets inner.style.animation = 'none', and assigning the `animation` SHORTHAND
    // resets all of its longhand sub-properties (including animation-duration) back to 0s. Reading
    // animationDuration after that always returned "0s", so `parseFloat(...) || 20` silently fell
    // back to a fixed 20s on every single resume — far faster than the intended (up to 108s)
    // content-scaled speed. That was the "ticker suddenly flies by" bug.
    const durationSec = tickerDurationSec;
    const fraction = singleWidth > 0 ? Math.min(1, Math.max(0, -tx / singleWidth)) : 0;
    inner.style.transform = '';
    inner.style.animation = 'none';
    void inner.offsetWidth;                      // force reflow so the delay below actually takes
    inner.style.animation = `news-scroll ${durationSec}s linear infinite`;
    inner.style.animationDelay = `-${fraction * durationSec}s`;
  };
  track.addEventListener('mouseenter', () => { if (!dragging) detach(); });
  track.addEventListener('mouseleave', () => { if (!dragging) resume(); });
  track.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragging = true; dragMoved = false;
    dragStartX = e.clientX;
    singleWidth = inner.scrollWidth / 2;
    dragBaseTx = detach();
    track.classList.add('dragging');
    try{ track.setPointerCapture(e.pointerId); }catch(_){}
  });
  track.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const delta = e.clientX - dragStartX;
    if (Math.abs(delta) > 4) dragMoved = true;
    let tx = dragBaseTx + delta;
    if (singleWidth > 0){
      tx = tx % singleWidth;
      if (tx > 0) tx -= singleWidth;              // wrap so scrubbing feels endless both directions
    }
    inner.style.transform = `translateX(${tx}px)`;
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    track.classList.remove('dragging');
    resume();
    if (dragMoved){                                // a drag shouldn't also open the link you let go on
      track.addEventListener('click', (ev) => { ev.preventDefault(); ev.stopPropagation(); }, { capture: true, once: true });
    }
  };
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  return bar;
}

function renderNewsControls(){
  const bar = document.createElement('div');
  bar.className = 'news-bar';
  for (const p of NEWS_PRODUCTS){
    const chip = document.createElement('span');
    chip.className = 'month-chip' + (newsUI.product === p ? ' on' : '');
    chip.textContent = p;
    chip.addEventListener('click', () => { newsUI.product = p; renderNewsBody(); });
    bar.appendChild(chip);
  }
  const min = document.createElement('span');
  min.className = 'month-chip' + (newsUI.minImpactOn ? ' on' : '');
  min.textContent = `${NEWS_MIN_IMPACT}+`;
  min.title = `Only events with impact ≥ ${NEWS_MIN_IMPACT}`;
  min.addEventListener('click', () => { newsUI.minImpactOn = !newsUI.minImpactOn; renderNewsBody(); });
  bar.appendChild(min);
  const search = document.createElement('input');
  search.type = 'search';
  search.placeholder = 'filter headlines…';
  search.className = 'news-search';
  search.value = newsUI.search;
  search.addEventListener('input', () => { newsUI.search = search.value; applyNewsFilter(); });
  bar.appendChild(search);
  return bar;
}

function renderNewsLane(lane){
  const box = document.createElement('div');
  box.className = 'news-lane-box';
  let rows = newsForProduct(newsUI.product).filter(s => lane.cats.includes(s.category) && newsVisible(s));
  if (newsUI.minImpactOn) rows = rows.filter(s => s.impact >= NEWS_MIN_IMPACT);
  rows = rows.slice().sort((a, b) => b.ms - a.ms);
  const head = document.createElement('div');
  head.className = 'news-box-head';
  head.innerHTML = `<span class="news-box-title">${lane.title}</span><span class="news-box-sub">${lane.sub}</span><span class="news-box-count" data-lane-count="${lane.key}">${rows.length}</span>`;
  box.appendChild(head);
  const list = document.createElement('div');
  list.className = 'news-lane-list';
  list.dataset.lane = lane.key;
  if (!rows.length){
    list.innerHTML = '<div class="note">Nothing in this lane for the current filter.</div>';
  }
  for (const s of rows) list.appendChild(renderNewsRow(s));
  box.appendChild(list);
  return box;
}

function renderNewsRow(s){
  const row = document.createElement('div');
  row.className = 'news-row' + (newsVotes[s.id] === 'like' ? ' liked' : '');
  row.dataset.text = `${s.headline} ${s.summary || ''} ${s.source || ''} ${s.country || ''} ${s.eventType || ''} ${s.category || ''} ${(s.sources || []).join(' ')}`.toLowerCase();
  const dirClass = s.direction === 'BULLISH' ? 'bull' : s.direction === 'BEARISH' ? 'bear' : 'neu';
  const time = document.createElement('div');
  time.className = 'news-time';
  time.textContent = newsFmtTime(s.ms).replace(' ', '\n');
  const imp = document.createElement('div');
  imp.className = 'news-imp ' + dirClass;
  imp.textContent = s.impact;
  imp.title = `impact ${s.impact} · confidence ${s.confidence}`;
  const trend = Math.max(1, Number(s.trend || s.sourceCount || 1));
  if (trend > 1){
    const tr = document.createElement('div');
    tr.className = 'news-trend' + (trend >= 10 ? ' hot' : trend >= 5 ? ' warm' : '');
    tr.textContent = '×' + trend;
    tr.title = `trend ${trend}: carried by ${trend} publishers` + (Array.isArray(s.sources) && s.sources.length ? ' — ' + s.sources.slice(0, 12).join(', ') : '');
    imp.appendChild(tr);
  }
  const main = document.createElement('div');
  main.className = 'news-main';
  const a = document.createElement('a');
  a.className = 'news-headline';
  a.href = s.url || '#'; a.target = '_blank'; a.rel = 'noopener';
  a.textContent = s.headline;
  main.appendChild(a);
  if (s.summary){
    const sum = document.createElement('div');
    sum.className = 'news-summary';
    sum.textContent = s.summary;
    main.appendChild(sum);
  }
  const tags = document.createElement('div');
  tags.className = 'news-tags';
  const tag = (txt, cls) => { const t = document.createElement('span'); t.className = 'news-tag ' + (cls || ''); t.textContent = txt; tags.appendChild(t); };
  if (s.breaking === true) tag('BREAKING', 'breaking');
  tag(s.direction, dirClass);
  tag(`conf ${s.confidence}`, 'dim');
  tag(s.source + (trend > 1 ? ` +${trend - 1}` : ''), 'src');
  tag(s.product, 'prod');
  if (s.category) tag(s.category, 'lane');
  if (s.country) tag(s.country, 'dim');
  if (s.eventType) tag(s.eventType, 'dim');
  main.appendChild(tags);
  const votes = document.createElement('div');
  votes.className = 'news-votes';
  const mkVote = (kind, glyph, title) => {
    const b = document.createElement('button');
    b.className = 'news-vote' + (newsVotes[s.id] === kind ? ' on' : '');
    b.textContent = glyph; b.title = title;
    b.addEventListener('click', (e) => { e.preventDefault(); voteNews(s, kind); });
    return b;
  };
  votes.appendChild(mkVote('like', '👍', 'Good call — more like this'));
  votes.appendChild(mkVote('dislike', '👎', 'Not wanted — hide and teach the classifier'));
  row.appendChild(time); row.appendChild(imp); row.appendChild(main); row.appendChild(votes);
  return row;
}

async function voteNews(s, kind){
  const same = newsVotes[s.id] === kind;
  try{
    if (same){
      await deleteDoc(doc(NEWS_FEEDBACK, s.id));
    } else {
      await setDoc(doc(NEWS_FEEDBACK, s.id), {
        vote: kind, ms: Date.now(), headline: s.headline, source: s.source || '', product: s.product || '',
        category: s.category || '', direction: s.direction || '', impact: s.impact || 0, url: s.url || ''
      });
    }
  }catch(e){
    console.error('vote failed', e);
    alert('Could not save your vote — check the Firestore rules for news_feedback.');
  }
}

function applyNewsFilter(){
  const q = newsUI.search.trim().toLowerCase();
  document.querySelectorAll('.news-lane-list').forEach(list => {
    let shown = 0;
    list.querySelectorAll('.news-row').forEach(row => {
      const hit = !q || row.dataset.text.includes(q);
      row.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });
    const c = document.querySelector(`[data-lane-count="${list.dataset.lane}"]`);
    if (c) c.textContent = shown;
  });
}

// ── Desktop ding (2026-09-14, Mete's request) ───────────────────────────────
// FCM push (below) already reaches phones reliably. On a desktop tab that's just sitting open on
// a second monitor, waiting on a round trip through Firebase Cloud Messaging is slower and less
// reliable than just reacting the instant the SAME live Firestore listener the page already has
// open (subscribeNews's onSnapshot) sees a new qualifying doc — so we do both: FCM for
// closed-tab/phone delivery, this for "I'm already looking at the screen" immediacy. Reuses the
// same 🔔 Alerts on/off state as the push flow (Notification.permission + the same localStorage
// flag) rather than adding a second toggle — one button, two delivery paths.
let newsAudioCtx = null;
function newsUnlockAudio(){
  // Browsers block audio from starting without a user gesture; call this from inside the actual
  // click handler that enables alerts so the context is "unlocked" and ready for later automated
  // dings (the click itself doesn't need to make a sound, it just needs to exist).
  try{
    newsAudioCtx = newsAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (newsAudioCtx.state === 'suspended') newsAudioCtx.resume();
  }catch(e){ /* Web Audio unavailable — dings will just silently no-op */ }
}
function newsPlayDing(){
  try{
    if (!newsAudioCtx) return;
    const ctx = newsAudioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    const tone = (freq, start, dur) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + start);
      gain.gain.linearRampToValueAtTime(0.18, now + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + start + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + start); osc.stop(now + start + dur + 0.03);
    };
    tone(880, 0, 0.16);       // two-tone "ding" — no external audio file needed
    tone(1320, 0.12, 0.22);
  }catch(e){ /* ignore — a missed ding should never break the page */ }
}
function newsMaybeAlert(s){
  let on = false;
  try{ on = localStorage.getItem('cte_news_alerts') === '1' && Notification.permission === 'granted'; }catch(e){}
  if (!on) return;
  if (!(s.breaking === true || (typeof s.impact === 'number' && s.impact >= NEWS_ALERT_IMPACT_JS))) return;
  newsPlayDing();
  try{
    const arrow = s.direction === 'BULLISH' ? '▲' : s.direction === 'BEARISH' ? '▼' : '•';
    const n = new Notification(`${s.breaking ? '🔴 BREAKING · ' : ''}${s.product} ${arrow} ${s.impact}`, {
      body: s.headline, tag: s.id || (s.product + '_' + s.ms),
    });
    n.onclick = () => { window.focus(); if (s.url) window.open(s.url, '_blank'); };
  }catch(e){ /* new Notification() can throw in some contexts; the ding above already played */ }
}

// ── Push alerts (Firebase Cloud Messaging) ──────────────────────────────────
// Registers this browser/phone in news_devices/{token}. The collector pushes to every
// registered device when an event is BREAKING or impact ≥ 75. Uses its own service
// worker at scope /fcm/ so the app's existing sw.js is untouched.
function updateAlertsButton(){
  const b = document.getElementById('newsAlertsBtn');
  if (!b) return;
  if (!('Notification' in window)){ b.textContent = '🔔 n/a'; b.disabled = true; b.title = 'This browser cannot show notifications'; return; }
  if (!NEWS_VAPID_KEY){ b.textContent = '🔔 Alerts (setup)'; b.title = 'Paste the Web Push key into NEWS_VAPID_KEY first'; return; }
  let on = false;
  try{ on = localStorage.getItem('cte_news_alerts') === '1' && Notification.permission === 'granted'; }catch(e){}
  b.textContent = on ? '🔔 Alerts on' : '🔔 Alerts';
  b.classList.toggle('flash', on);
}
async function enableNewsAlerts(){
  const b = document.getElementById('newsAlertsBtn');
  if (!('Notification' in window) || !('serviceWorker' in navigator)){ alert('This browser cannot receive push notifications.'); return; }
  if (!NEWS_VAPID_KEY){ alert('Web Push key not configured yet (NEWS_VAPID_KEY).'); return; }
  try{
    b.textContent = '🔔 …';
    newsUnlockAudio();     // must happen inside this click handler, or the browser blocks audio later
    const perm = await Notification.requestPermission();
    if (perm !== 'granted'){ b.textContent = '🔔 Alerts'; alert('Notifications were not allowed.'); return; }
    const { getMessaging, getToken, onMessage } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging.js');
    const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: '/fcm/' });
    await navigator.serviceWorker.ready;
    const messaging = getMessaging(fbApp);
    const token = await getToken(messaging, { vapidKey: NEWS_VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) throw new Error('no token');
    await setDoc(doc(NEWS_DEVICES, token), { ms: Date.now(), ua: navigator.userAgent.slice(0, 120) });
    try{ localStorage.setItem('cte_news_alerts', '1'); }catch(e){}
    onMessage(messaging, (payload) => {
      const n = payload.notification || {};
      const pill = document.getElementById('savePill');
      if (pill){ pill.textContent = `${n.title || 'Alert'} — ${(n.body || '').slice(0, 80)}`; pill.classList.add('show'); setTimeout(() => { pill.classList.remove('show'); pill.textContent = 'Saved'; }, 6000); }
    });
    updateAlertsButton();
  }catch(e){
    console.error('alerts setup failed', e);
    b.textContent = '🔔 Alerts';
    alert('Could not enable alerts: ' + (e && e.message ? e.message : e));
  }
}

function renderArchiveNews(container, news){
  if (!news || !news.products) return;
  container.appendChild(sectionTitle('Market news that day'));
  const wrap = document.createElement('div');
  wrap.className = 'news-tiles';
  for (const [p, v] of Object.entries(news.products)){
    const tone = !v.n ? 'flat' : v.net > 0 ? 'pos' : v.net < 0 ? 'neg' : 'flat';
    const tile = document.createElement('div');
    tile.className = 'news-tile ' + tone;
    tile.style.cursor = 'default';
    tile.innerHTML = `<div class="news-tile-name">${p}</div><div class="news-tile-val">${v.n ? newsFmtSigned(v.net) : '—'}</div>` +
      `<div class="news-tile-sub">${v.n ? `${v.bull}▲ ${v.bear}▼ · ${v.n} in 24h · bal ${v.balance > 0 ? '+' : ''}${v.balance}%` : 'no qualifying event'}</div>`;
    wrap.appendChild(tile);
  }
  container.appendChild(wrap);
  if (Array.isArray(news.top) && news.top.length){
    const list = document.createElement('div');
    list.className = 'news-archive-top';
    for (const t of news.top){
      const row = document.createElement('div');
      row.className = 'news-archive-row';
      const dir = t.direction === 'BULLISH' ? 'bull' : t.direction === 'BEARISH' ? 'bear' : 'neu';
      row.innerHTML = `<span class="news-imp ${dir}">${t.impact}</span><span class="news-archive-head">${escapeHtml(t.headline)}</span>` +
        `<span class="news-tag prod">${t.product}</span>${t.breaking ? '<span class="news-tag breaking">BREAKING</span>' : ''}${t.trend > 1 ? `<span class="news-tag dim">×${t.trend}</span>` : ''}`;
      list.appendChild(row);
    }
    container.appendChild(list);
  }
  const note = document.createElement('div');
  note.className = 'news-count';
  note.textContent = `reading taken ${newsFmtTime(news.asOf)} Vietnam time · trailing 24h at that moment`;
  container.appendChild(note);
}
