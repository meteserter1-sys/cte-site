function renderNewsLane(lane){
  const box = document.createElement('div');
  box.className = 'glass news-lane-box';
  let rows = newsForProduct(newsUI.product).filter(s => lane.match(s) && newsVisible(s));
  if (newsUI.minImpactOn) rows = rows.filter(s => s.impact >= NEWS_MIN_IMPACT);
  rows = rows.slice().sort((a, b) => b.ms - a.ms);
  const head = document.createElement('div');
  head.className = 'news-box-head';
  const addBtnHtml = lane.key === 'trader' ? `<button type="button" class="news-lane-add-btn" id="traderNewsAddBtn" title="Add news">+</button>` : '';
  head.innerHTML = `<span class="news-box-title">${lane.title}</span><span class="news-box-sub">${lane.sub}</span>${addBtnHtml}<span class="news-box-count" data-lane-count="${lane.key}">${rows.length}</span>`;
  box.appendChild(head);
  if (lane.key === 'trader'){
    head.querySelector('#traderNewsAddBtn').addEventListener('click', openTraderNewsModal);
  }
  const list = document.createElement('div');
  list.className = 'news-lane-list';
  list.dataset.lane = lane.key;
  if (!rows.length){
    list.innerHTML = '<div class="note">Nothing in this lane for the current filter.</div>';
  }
  for (const s of rows) list.appendChild(renderNewsRow(s));
  box.appendChild(list);
  return box;
}

// ── Trader News: manual paste/screenshot/PDF → Claude classify → editable preview → add ────────
// 2026-09-18, Mete's request. Two-step flow, nothing hits the live board until he explicitly
// confirms:
//   1. "Classify" calls the classifyTraderNews Cloud Function (functions/index.js), which holds
//      the Anthropic key server-side and returns a classification — it does NOT touch Firestore.
//   2. The result renders as an editable draft right here in the modal. Only clicking "Add" writes
//      it to the `news` collection (client-side, since he's already signed in) — that's the one
//      moment it starts counting toward tiles/chart/lanes. Closing/cancelling before that leaves no
//      trace anywhere.
// firestore.rules has a matching narrow rule: authed users may CREATE a `news` doc only when
// `manual === true`, and can't update/delete any doc (collector-written or their own) — see rules.
// 2026-09-22, Mete: FREIGHT dropped — manual Trader News entries can no longer be tagged FREIGHT
// either, so a freight item can't sneak back into the impact tiles/lanes through this side door.
// Kept in sync by hand with collector.py's PRODUCTS and functions/index.js's own PRODUCTS constant
// (see that file's note) — if one changes, change all three.
const TRADER_PRODUCTS = ['WHEAT', 'CORN', 'SBM', 'SKIP'];
const TRADER_CATEGORIES = ['POLITICS', 'AGRI', 'REPORTS'];
const TRADER_MAX_FILE_BYTES = 5 * 1024 * 1024; // 5MB — keeps the callable payload and Claude cost bounded

function closeTraderNewsModal(){
  const el = document.getElementById('traderNewsModal');
  if (el) el.remove();
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function openTraderNewsModal(){
  closeTraderNewsModal();
  let attachment = null; // { base64, mediaType, kind: 'image'|'pdf', name }

  const overlay = document.createElement('div');
  overlay.id = 'traderNewsModal';
  overlay.className = 'trader-modal-overlay';
  overlay.innerHTML = `
    <div class="trader-modal">
      <h3>Add Trader News</h3>
      <div class="trader-modal-sub">Paste the text, or attach a screenshot/PDF. AI classifies it first — nothing hits the page until you click "Add".</div>
      <textarea id="traderNewsText" placeholder="Paste the text here…"></textarea>
      <label>Add Screenshot or PDF File (optional)</label>
      <input type="file" id="traderNewsFile" accept="image/*,.pdf">
      <div class="trader-modal-file-info" id="traderNewsFileInfo"></div>
      <label>Source (optional)</label>
      <textarea id="traderNewsSource"></textarea>
      <label>Notes (optional)</label>
      <textarea id="traderNewsNote"></textarea>
      <div class="trader-modal-error" id="traderNewsError" style="display:none;"></div>
      <div id="traderNewsPreviewHost"></div>
      <div class="trader-modal-actions" id="traderNewsActions">
        <button type="button" id="traderNewsCancel">Cancel</button>
        <button type="button" class="primary" id="traderNewsClassifyBtn">Classify</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeTraderNewsModal(); });
  document.getElementById('traderNewsCancel').addEventListener('click', closeTraderNewsModal);

  const fileInput = document.getElementById('traderNewsFile');
  const fileInfo = document.getElementById('traderNewsFileInfo');
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    attachment = null;
    fileInfo.textContent = '';
    if (!file) return;
    if (file.size > TRADER_MAX_FILE_BYTES){
      fileInfo.textContent = `File too large (${(file.size / 1024 / 1024).toFixed(1)}MB) — exceeds the 5MB limit.`;
      fileInput.value = '';
      return;
    }
    const isPdf = file.type === 'application/pdf';
    const base64 = await fileToBase64(file);
    attachment = { base64, mediaType: file.type || (isPdf ? 'application/pdf' : 'image/png'), kind: isPdf ? 'pdf' : 'image', name: file.name };
    fileInfo.textContent = `Attached: ${file.name} (${(file.size / 1024).toFixed(0)}KB)`;
  });

  document.getElementById('traderNewsClassifyBtn').addEventListener('click', async () => {
    const errEl = document.getElementById('traderNewsError');
    errEl.style.display = 'none';
    const text = document.getElementById('traderNewsText').value.trim();
    const source = document.getElementById('traderNewsSource').value.trim();
    const note = document.getElementById('traderNewsNote').value.trim();
    if (!text && !attachment){
      errEl.textContent = 'Paste text or attach an image/PDF.';
      errEl.style.display = 'block';
      return;
    }
    const btn = document.getElementById('traderNewsClassifyBtn');
    btn.disabled = true; btn.textContent = 'Classifying…';
    document.getElementById('traderNewsCancel').disabled = true;
    try{
      const classifyTraderNewsFn = httpsCallable(fbFunctions, 'classifyTraderNews');
      const payload = { text: text || undefined, source: source || undefined, note: note || undefined };
      if (attachment && attachment.kind === 'image'){ payload.imageBase64 = attachment.base64; payload.imageMediaType = attachment.mediaType; }
      if (attachment && attachment.kind === 'pdf'){ payload.pdfBase64 = attachment.base64; }
      const result = await classifyTraderNewsFn(payload);
      // `source` is Mete's own input, not something the classifier returns — carried through on
      // the draft object so commitTraderNews can use it as the row's displayed source later.
      renderTraderNewsPreview({ ...result.data, source });
    }catch(e){
      console.error('traderNewsClassify failed', e);
      errEl.textContent = 'Classification failed: ' + (e && e.message ? e.message : e);
      errEl.style.display = 'block';
    }finally{
      btn.disabled = false; btn.textContent = 'Classify';
      const cancelBtn = document.getElementById('traderNewsCancel');
      if (cancelBtn) cancelBtn.disabled = false;
    }
  });
}

function renderTraderNewsPreview(draft){
  // Replace the "Classify" action row with an editable preview + Add/Cancel, per Mete's flow:
  // AI evaluates first, shows a draft, he can edit, THEN "Add" commits it — never the other way
  // around.
  const host = document.getElementById('traderNewsPreviewHost');
  const actions = document.getElementById('traderNewsActions');
  const productOptions = TRADER_PRODUCTS.map(p => `<option value="${p}"${p === draft.product ? ' selected' : ''}>${p}</option>`).join('');
  const directionOptions = ['BULLISH', 'BEARISH', 'NEUTRAL'].map(d => `<option value="${d}"${d === draft.direction ? ' selected' : ''}>${d}</option>`).join('');
  const categoryOptions = TRADER_CATEGORIES.map(c => `<option value="${c}"${c === draft.category ? ' selected' : ''}>${c}</option>`).join('');
  host.innerHTML = `
    <div class="trader-preview">
      <div class="trader-preview-row"><label>Headline</label><input type="text" id="tpHeadline" value="${escapeHtml(draft.headline || '')}"></div>
      <div class="trader-preview-row"><label>Product</label><select id="tpProduct">${productOptions}</select></div>
      <div class="trader-preview-row" id="tpSkipNote" style="display:${draft.product === 'SKIP' ? 'block' : 'none'};"><span></span><span class="trader-preview-skip">Looks irrelevant — "Add" is disabled. Pick a product by hand if you want to add it anyway.</span></div>
      <div class="trader-preview-row"><label>Direction</label><select id="tpDirection">${directionOptions}</select></div>
      <div class="trader-preview-row"><label>Impact</label><input type="number" id="tpImpact" min="0" max="10" step="0.5" value="${(Number(draft.impact) || 0) / 10}"></div>
      <div class="trader-preview-row"><label>Category</label><select id="tpCategory">${categoryOptions}</select></div>
      <div class="trader-preview-row"><label>Breaking</label><input type="checkbox" id="tpBreaking" style="width:auto;justify-self:start;" ${draft.breaking ? 'checked' : ''}></div>
      <div class="trader-preview-row"><label>Summary</label><textarea id="tpSummary">${escapeHtml(draft.summary || '')}</textarea></div>
    </div>`;
  actions.innerHTML = `
    <button type="button" id="traderNewsCancel2">Cancel</button>
    <button type="button" class="primary" id="traderNewsAddConfirm">Add</button>`;
  document.getElementById('traderNewsCancel2').addEventListener('click', closeTraderNewsModal);

  const productSel = document.getElementById('tpProduct');
  const addBtn = document.getElementById('traderNewsAddConfirm');
  const skipNote = document.getElementById('tpSkipNote');
  const syncSkipState = () => {
    const isSkip = productSel.value === 'SKIP';
    skipNote.style.display = isSkip ? 'block' : 'none';
    addBtn.disabled = isSkip;
  };
  productSel.addEventListener('change', syncSkipState);
  syncSkipState();

  addBtn.addEventListener('click', async () => {
    addBtn.disabled = true; addBtn.textContent = 'Adding…';
    try{
      const edited = {
        ...draft,
        headline: document.getElementById('tpHeadline').value.trim() || draft.headline,
        product: productSel.value,
        direction: document.getElementById('tpDirection').value,
        // entered on the 0-10 display scale, stored 0-100 like every collector-written doc
        impact: Math.max(0, Math.min(100, Math.round((Number(document.getElementById('tpImpact').value) || 0) * 10))),
        category: document.getElementById('tpCategory').value,
        breaking: document.getElementById('tpBreaking').checked,
        summary: document.getElementById('tpSummary').value.trim(),
      };
      await commitTraderNews(edited);
      closeTraderNewsModal();
    }catch(e){
      console.error('traderNews commit failed', e);
      const errEl = document.getElementById('traderNewsError');
      errEl.textContent = 'Could not add: ' + (e && e.message ? e.message : e);
      errEl.style.display = 'block';
      addBtn.disabled = false; addBtn.textContent = 'Add';
    }
  });
}

async function commitTraderNews(d){
  const ref = doc(NEWS_COLLECTION);
  const now = Date.now();
  // Mete's own "Source (optional)" input (who sent it) becomes the row's displayed source
  // as-is, e.g. "Hedgepoint" — no "Manual" prefix. Falls back to just "Trader" when left blank.
  const sourceLabel = d.source || 'Trader';
  await setDoc(ref, {
    id: ref.id,
    feed: 'manual',
    headline: d.headline,
    url: '',
    source: sourceLabel,
    sourceCount: 1,
    ms: now,
    product: d.product,
    direction: d.direction,
    impact: d.impact,
    confidence: d.confidence,
    country: d.country || '',
    category: d.category,
    breaking: !!d.breaking,
    eventType: d.eventType || 'OTHER',
    summary: d.summary,
    duplicate: false,
    trend: 1,
    sources: [sourceLabel],
    classifiedAt: now,
    manual: true,
  });
}

function renderNewsRow(s){
  // 2026-10-02 (liquid-glass theme): a card, not a table row — thumbnail left, bold headline,
  // short summary; under them one horizontal run of badges in Mete's order:
  //   [BREAKING] · bull/bear (or neutral) orb · impact orb (0-10, green/red/grey) · product ·
  //   category · country · publisher · flame with the number of publishers that carried it
  // and a footer with the time (same format as before) on the left, like / dislike / edit on the
  // right. Confidence and eventType are no longer shown. Class "news-row" is kept: applyNewsFilter()
  // and the vote styling still key off it.
  const row = document.createElement('article');
  row.className = 'news-row' + (newsVotes[s.id] === 'like' ? ' liked' : '');
  row.dataset.id = s.id || '';
  row.dataset.text = `${s.headline} ${s.summary || ''} ${s.source || ''} ${s.country || ''} ${s.category || ''} ${(s.sources || []).join(' ')}`.toLowerCase();
  const dirClass = s.direction === 'BULLISH' ? 'bull' : s.direction === 'BEARISH' ? 'bear' : 'neu';
  const trend = Math.max(1, Number(s.trend || s.sourceCount || 1));

  const top = document.createElement('div');
  top.className = 'news-card-top';
  const img = document.createElement('img');
  img.className = 'news-thumb';
  img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
  const fallback = newsThumbFallback(s);
  img.addEventListener('error', () => { if (!img.dataset.fb){ img.dataset.fb = '1'; img.src = fallback; } });
  img.src = s.imageUrl || fallback;
  top.appendChild(img);
  const main = document.createElement('div');
  main.className = 'news-main';
  const a = document.createElement('a');
  a.className = 'news-headline';
  a.href = s.url || '#'; a.target = '_blank'; a.rel = 'noopener';
  if (!s.url) a.addEventListener('click', (e) => e.preventDefault());
  a.textContent = s.headline;
  main.appendChild(a);
  if (s.summary){
    const sum = document.createElement('p');
    sum.className = 'news-summary';
    sum.textContent = s.summary;
    main.appendChild(sum);
  }
  top.appendChild(main);
  row.appendChild(top);

  const badges = document.createElement('div');
  badges.className = 'news-badges';
  const add = (cls, html, title) => { const el = document.createElement('span'); el.className = cls; el.innerHTML = html; if (title) el.title = title; badges.appendChild(el); return el; };
  if (s.breaking === true) add('tag-breaking', 'BREAKING');
  add('orb ' + dirClass, NEWS_ICON[dirClass], s.direction || 'NEUTRAL');
  add('orb score ' + dirClass, newsFmtImpact(s.impact), `impact ${newsFmtImpact(s.impact)} of 10`);
  if (s.product) add('tagp prod', escapeHtml(s.product));
  if (s.category) add('tagp', escapeHtml(s.category));
  if (s.country) add('tagp', escapeHtml(s.country), 'Country');
  if (s.source) add('tagp src', escapeHtml(s.source), s.source);
  if (trend > 1){
    add('flame', NEWS_ICON.flame + `<b>${trend > 99 ? '99' : trend}</b>`,
      `carried by ${trend} publishers` + (Array.isArray(s.sources) && s.sources.length ? ' — ' + s.sources.slice(0, 12).join(', ') : ''));
  }
  row.appendChild(badges);

  const foot = document.createElement('div');
  foot.className = 'news-card-foot';
  const time = document.createElement('span');
  time.className = 'news-time';
  time.textContent = newsFmtTime(s.ms);
  foot.appendChild(time);
  if (s.edited){
    const ed = document.createElement('span');
    ed.className = 'news-edited'; ed.textContent = 'edited'; ed.title = 'Classification corrected by hand';
    foot.appendChild(ed);
  }
  const votes = document.createElement('div');
  votes.className = 'news-votes';
  const mkBtn = (cls, icon, title, onClick) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'news-vote' + cls; b.innerHTML = icon; b.title = title;
    b.addEventListener('click', (e) => { e.preventDefault(); onClick(); });
    return b;
  };
  votes.appendChild(mkBtn(newsVotes[s.id] === 'like' ? ' on' : '', NEWS_ICON.like, 'Good call — more like this', () => voteNews(s, 'like')));
  votes.appendChild(mkBtn(newsVotes[s.id] === 'dislike' ? ' on' : '', NEWS_ICON.dislike, 'Not wanted — hide and teach the classifier', () => voteNews(s, 'dislike')));
  votes.appendChild(mkBtn('', NEWS_ICON.edit, 'Edit classification', () => openNewsEdit(s)));
  foot.appendChild(votes);
  row.appendChild(foot);
  return row;
}

// ── Edit classification (2026-10-02, Mete) ──────────────────────────────────────────────────────
// Available on every card in all three lanes (World / Commodity / Trader News): lets the desk
// correct what the classifier decided — direction, impact, category, country code, publisher.
// Writes only those fields (plus edited/editedMs) onto the story's own `news` doc with merge:true;
// the tiles, chart and lanes all read the doc, so they follow by themselves on the next snapshot.
// Impact is entered on the 0-10 display scale and stored 0-100 like every other doc.
// Needs the narrow `update` rule in firestore.rules (see that file) — and collector.py must leave
// these fields alone on docs flagged edited:true when it merges a new publisher into a story.
function openNewsEdit(s){
  const old = document.getElementById('newsEditModal'); if (old) old.remove();
  let dir = s.direction || 'NEUTRAL', imp = Math.max(0, Math.min(100, Math.round(Number(s.impact) || 0)));
  const overlay = document.createElement('div');
  overlay.id = 'newsEditModal';
  overlay.className = 'trader-modal-overlay';
  const cats = TRADER_CATEGORIES.includes(s.category) || !s.category ? TRADER_CATEGORIES : [s.category, ...TRADER_CATEGORIES];
  overlay.innerHTML = `
    <div class="trader-modal narrow">
      <h3>Edit classification</h3>
      <div class="trader-modal-sub">${escapeHtml(s.headline || '')}</div>
      <label>Direction</label>
      <div class="seg" data-liq="edit-direction">${[['BULLISH', 'Bullish'], ['NEUTRAL', 'Neutral'], ['BEARISH', 'Bearish']].map(([k, t]) => `<span class="opt${dir === k ? ' on' : ''}" data-d="${k}">${t}</span>`).join('')}</div>
      <label>Impact (0–10)</label>
      <div class="edit-stepper"><button type="button" id="neMinus">−</button><output id="neImp">${newsFmtImpact(imp)}</output><button type="button" id="nePlus">+</button></div>
      <div class="edit-two">
        <div><label>Category</label><select id="neCat">${cats.map(c => `<option value="${escapeAttr(c)}"${c === s.category ? ' selected' : ''}>${escapeHtml(c)}</option>`).join('')}</select></div>
        <div><label>Country code</label><input type="text" id="neCountry" maxlength="3" value="${escapeAttr(s.country || '')}"></div>
      </div>
      <label>Publisher</label>
      <input type="text" id="neSource" value="${escapeAttr(s.source || '')}">
      <div class="trader-modal-error" id="neError" style="display:none;"></div>
      <div class="trader-modal-actions"><button type="button" id="neCancel">Cancel</button><button type="button" class="primary" id="neSave">Save</button></div>
    </div>`;
  document.body.appendChild(overlay);
  delete LIQ_POS['edit-direction'];
  const seg = overlay.querySelector('.seg');
  liquidAll(seg);
  seg.querySelectorAll('.opt').forEach(o => o.addEventListener('click', () => {
    dir = o.dataset.d;
    seg.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === o));
    liquidAll(seg);
  }));
  const step = (d) => { imp = Math.max(0, Math.min(100, imp + d)); overlay.querySelector('#neImp').textContent = newsFmtImpact(imp); };
  overlay.querySelector('#neMinus').addEventListener('click', () => step(-5));
  overlay.querySelector('#nePlus').addEventListener('click', () => step(5));
  const close = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  overlay.querySelector('#neCancel').addEventListener('click', close);
  overlay.querySelector('#neSave').addEventListener('click', async () => {
    const btn = overlay.querySelector('#neSave'), errEl = overlay.querySelector('#neError');
    btn.disabled = true; btn.textContent = 'Saving…'; errEl.style.display = 'none';
    try{
      await setDoc(doc(NEWS_COLLECTION, s.id), {
        direction: dir, impact: imp,
        category: overlay.querySelector('#neCat').value,
        country: overlay.querySelector('#neCountry').value.trim().toUpperCase(),
        source: overlay.querySelector('#neSource').value.trim() || s.source || '',
        edited: true, editedMs: Date.now(),
      }, { merge: true });
      close();
    }catch(e){
      console.error('news edit failed', e);
      errEl.textContent = 'Could not save: ' + (e && e.message ? e.message : e) + ' — check the Firestore rule for editing news.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Save';
    }
  });
}

async function voteNews(s, kind){
  const same = newsVotes[s.id] === kind;
  try{
    if (same){
      await deleteDoc(doc(NEWS_FEEDBACK, s.id));
    } else {
      await setDoc(doc(NEWS_FEEDBACK, s.id), {
        vote: kind, ms: Date.now(), headline: s.headline, source: s.source || '', product: s.product || '',
        category: s.category || '', direction: s.direction || '', impact: s.impact || 0, url: s.url || ''
      });
    }
  }catch(e){
    console.error('vote failed', e);
    alert('Could not save your vote — check the Firestore rules for news_feedback.');
  }
}

function applyNewsFilter(){
  const q = newsUI.search.trim().toLowerCase();
  document.querySelectorAll('.news-lane-list').forEach(list => {
    let shown = 0;
    list.querySelectorAll('.news-row').forEach(row => {
      const hit = !q || row.dataset.text.includes(q);
      row.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });
    const c = document.querySelector(`[data-lane-count="${list.dataset.lane}"]`);
    if (c) c.textContent = shown;
  });
}

// ── Desktop ding (2026-09-14, Mete's request) ───────────────────────────────
// FCM push (below) already reaches phones reliably. On a desktop tab that's just sitting open on
// a second monitor, waiting on a round trip through Firebase Cloud Messaging is slower and less
// reliable than just reacting the instant the SAME live Firestore listener the page already has
// open (subscribeNews's onSnapshot) sees a new qualifying doc — so we do both: FCM for
// closed-tab/phone delivery, this for "I'm already looking at the screen" immediacy. Reuses the
// same 🔔 Alerts on/off state as the push flow (Notification.permission + the same localStorage
// flag) rather than adding a second toggle — one button, two delivery paths.
let newsAudioCtx = null;
function newsUnlockAudio(){
  // Browsers block audio from starting without a user gesture; call this from inside the actual
  // click handler that enables alerts so the context is "unlocked" and ready for later automated
  // dings (the click itself doesn't need to make a sound, it just needs to exist).
  try{
    newsAudioCtx = newsAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (newsAudioCtx.state === 'suspended') newsAudioCtx.resume();
  }catch(e){ /* Web Audio unavailable — dings will just silently no-op */ }
}
function newsPlayDing(){
  try{
    if (!newsAudioCtx) return;
    const ctx = newsAudioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    const tone = (freq, start, dur) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + start);
      gain.gain.linearRampToValueAtTime(0.18, now + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + start + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + start); osc.stop(now + start + dur + 0.03);
    };
    tone(880, 0, 0.16);       // two-tone "ding" — no external audio file needed
    tone(1320, 0.12, 0.22);
  }catch(e){ /* ignore — a missed ding should never break the page */ }
}
function newsMaybeAlert(s){
  let on = false;
  try{ on = localStorage.getItem('cte_news_alerts') === '1' && Notification.permission === 'granted'; }catch(e){}
  if (!on) return;
  if (!(s.breaking === true || (typeof s.impact === 'number' && s.impact >= NEWS_ALERT_IMPACT_JS))) return;
  newsPlayDing();
  try{
    const arrow = s.direction === 'BULLISH' ? '▲' : s.direction === 'BEARISH' ? '▼' : '•';
    const n = new Notification(`${s.breaking ? '🔴 BREAKING · ' : ''}${s.product} ${arrow} ${newsFmtImpact(s.impact)}`, {
      body: s.headline, tag: s.id || (s.product + '_' + s.ms),
    });
    n.onclick = () => { window.focus(); if (s.url) window.open(s.url, '_blank'); };
  }catch(e){ /* new Notification() can throw in some contexts; the ding above already played */ }
}

// ── Push alerts (Firebase Cloud Messaging) ──────────────────────────────────
// Registers this browser/phone in news_devices/{token}. The collector pushes to every
// registered device when an event is BREAKING or impact ≥ 75. Uses its own service
// worker at scope /fcm/ so the app's existing sw.js is untouched.
function updateAlertsButton(){
  const b = document.getElementById('newsAlertsBtn');
  if (!b) return;
  if (!('Notification' in window)){ b.textContent = '🔔 n/a'; b.disabled = true; b.title = 'This browser cannot show notifications'; return; }
  if (!NEWS_VAPID_KEY){ b.textContent = '🔔 Alerts (setup)'; b.title = 'Paste the Web Push key into NEWS_VAPID_KEY first'; return; }
  let on = false;
  try{ on = localStorage.getItem('cte_news_alerts') === '1' && Notification.permission === 'granted'; }catch(e){}
  b.textContent = on ? '🔔 Alerts on' : '🔔 Alerts';
  b.classList.toggle('flash', on);
}
async function enableNewsAlerts(){
  const b = document.getElementById('newsAlertsBtn');
  if (!('Notification' in window) || !('serviceWorker' in navigator)){ alert('This browser cannot receive push notifications.'); return; }
  if (!NEWS_VAPID_KEY){ alert('Web Push key not configured yet (NEWS_VAPID_KEY).'); return; }
  try{
    b.textContent = '🔔 …';
    newsUnlockAudio();     // must happen inside this click handler, or the browser blocks audio later
    const perm = await Notification.requestPermission();
    if (perm !== 'granted'){ b.textContent = '🔔 Alerts'; alert('Notifications were not allowed.'); return; }
    const { getMessaging, getToken, onMessage } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging.js');
    const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: '/fcm/' });
    await navigator.serviceWorker.ready;
    const messaging = getMessaging(fbApp);
    const token = await getToken(messaging, { vapidKey: NEWS_VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) throw new Error('no token');
    await setDoc(doc(NEWS_DEVICES, token), { ms: Date.now(), ua: navigator.userAgent.slice(0, 120) });
    try{ localStorage.setItem('cte_news_alerts', '1'); }catch(e){}
    onMessage(messaging, (payload) => {
      const n = payload.notification || {};
      const pill = document.getElementById('savePill');
      if (pill){ pill.textContent = `${n.title || 'Alert'} — ${(n.body || '').slice(0, 80)}`; pill.classList.add('show'); setTimeout(() => { pill.classList.remove('show'); pill.textContent = 'Saved'; }, 6000); }
    });
    updateAlertsButton();
  }catch(e){
    console.error('alerts setup failed', e);
    b.textContent = '🔔 Alerts';
    alert('Could not enable alerts: ' + (e && e.message ? e.message : e));
  }
}

// ── History integration ─────────────────────────────────────────────────────
function renderArchiveNews(container, news){
  if (!news || !news.products) return;
  container.appendChild(sectionTitle('Market news that day'));
  const wrap = document.createElement('div');
  wrap.className = 'news-tiles';
  for (const [p, v] of Object.entries(news.products)){
    if (p === 'FREIGHT' && !v.n) continue;   // freight news retired 2026-09-22 — no empty tile for it
    const tone = !v.n ? 'flat' : v.net > 0 ? 'pos' : v.net < 0 ? 'neg' : 'flat';
    const tile = document.createElement('div');
    tile.className = 'news-tile ' + tone;
    tile.style.cursor = 'default';
    tile.innerHTML = `<div class="news-tile-name">${p}</div><div class="news-tile-val">${v.n ? newsFmtSigned(v.net) : '—'}</div>` +
      `<div class="news-tile-sub">${v.n ? `${v.bull}▲ ${v.bear}▼ · ${v.n} events` : 'no qualifying event'}</div>`;
    wrap.appendChild(tile);
  }
  container.appendChild(wrap);
  if (Array.isArray(news.top) && news.top.length){
    const list = document.createElement('div');
    list.className = 'news-archive-top';
    for (const t of news.top){
      const row = document.createElement('div');
      row.className = 'news-archive-row';
      const dir = t.direction === 'BULLISH' ? 'bull' : t.direction === 'BEARISH' ? 'bear' : 'neu';
      row.innerHTML = `<span class="news-imp ${dir}">${newsFmtImpact(t.impact)}</span><span class="news-archive-head">${escapeHtml(t.headline)}</span>` +
        `<span class="news-tag prod">${t.product}</span>${t.breaking ? '<span class="news-tag breaking">BREAKING</span>' : ''}${t.trend > 1 ? `<span class="news-tag dim">×${t.trend}</span>` : ''}`;
      list.appendChild(row);
    }
    container.appendChild(list);
  }
  const note = document.createElement('div');
  note.className = 'news-count';
  note.textContent = `reading taken ${newsFmtTime(news.asOf)} Vietnam time`;
  container.appendChild(note);
}

// News is the default landing tab — render it once on load without waiting for a click.
// (Placed here, after every `let`/`const` in this module has been declared, so it doesn't
// touch news state during the temporal dead zone the way an early call would.)
{
  const startTab = document.querySelector('.tab.active');
  if (startTab && startTab.dataset.tab === 'newstab') renderNewsTab();
  liquidAll(document.querySelector('.tabs'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { Object.keys(LIQ_POS).forEach(k => delete LIQ_POS[k]); liquidAll(document.body); });
}

// 2026-09-17: gate the whole app behind a real sign-in. loadState() (and everything it wires up)
// only runs once onAuthStateChanged reports a genuine, non-anonymous user — see waitForAuth()
// above and firestore.rules, which both key off the same "not anonymous" identity.
let appBooted = false;
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  const errEl = document.getElementById('loginError');
  if (errEl) errEl.textContent = '';
  if (!appBooted){
    appBooted = true;
    loadState();
  }
}
function showLogin(errMsg){
  appBooted = false;
  document.getElementById('loginScreen').style.display = 'flex';
  const errEl = document.getElementById('loginError');
  if (errEl){ errEl.classList.remove('login-ok'); errEl.textContent = errMsg || ''; }
}
// 2026-09-17, Mete: a browser that had visited before this login gate existed can still be
// holding an old ANONYMOUS session (Firebase Auth persists sign-ins across reloads by default,
// and this app used to call signInAnonymously() on every load — see waitForAuth()'s comment
// above). Left unhandled, onAuthStateChanged fires with that stale anonymous user, `if (user)`
// is true, showApp() runs and skips the login screen entirely — but firestore.rules' isAuthed()
// correctly rejects that same anonymous identity, so every read then fails with "Missing or
// insufficient permissions" (the "Could not connect" banner). Signing out an anonymous session
// here is a one-time, automatic cleanup: the next onAuthStateChanged call fires with user=null
// and the real login screen shows, same as for a browser that was never signed in at all.
onAuthStateChanged(auth, (user) => {
  if (user && user.isAnonymous){ signOut(auth); return; }
  if (user) showApp(); else showLogin();
});
document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginSubmit');
  btn.disabled = true; btn.textContent = 'Signing in…';
  signInWithEmailAndPassword(auth, email, password)
    .catch(err => {
      const code = err && err.code;
      const msg = (code === 'auth/invalid-credential' || code === 'auth/wrong-password' ||
                   code === 'auth/user-not-found' || code === 'auth/invalid-email')
        ? 'Wrong email or password.'
        : (code === 'auth/too-many-requests' ? 'Too many attempts — wait a bit and try again.' : 'Sign-in failed. Try again.');
      showLogin(msg);
    })
    .finally(() => { btn.disabled = false; btn.textContent = 'Sign in'; });
});
document.getElementById('logoutBtn').addEventListener('click', () => {
  signOut(auth);
});
document.getElementById('forgotBtn').addEventListener('click', () => {
  const email = document.getElementById('loginEmail').value.trim();
  const errEl = document.getElementById('loginError');
  if (!email){
    errEl.classList.remove('login-ok');
    errEl.textContent = 'Type your email above first, then tap "Forgot password?" again.';
    return;
  }
  sendPasswordResetEmail(auth, email)
    .then(() => {
      errEl.classList.add('login-ok');
      errEl.textContent = 'If that email has an account, a reset link was sent.';
    })
    .catch(() => {
      // Same message on failure as on success — do not reveal whether an email is registered.
      errEl.classList.add('login-ok');
      errEl.textContent = 'If that email has an account, a reset link was sent.';
    });
});
</script>

if ('serviceWorker' in navigator) {

    navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed', err));
  });
}
