<style>
  :root{
    --bg:#0b1622;
    --panel:#132030;
    --panel-2:#182838;
    --border:#2c3f52;
    --text:#f2f5f8;
    --text-dim:#93a3b5;
    --accent:#e0a83a;
    --accent-soft:#402f14;
    --good:#2f9e6f;
    --good-bg:#1c8c58;
    --bad:#c1554a;
    --input-bg:#0d1319;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  header{
    padding:18px 16px 14px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--bg); z-index:10;
  }
  header .eyebrow{
    color:var(--accent); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    font-weight:600; margin-bottom:4px;
  }
  header h1{
    margin:0; font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    font-family:var(--sans); color:var(--text-dim);
  }
  header h1 .cte-tag{ color:var(--accent); font-weight:700; }
  .header-brand{ display:flex; align-items:center; gap:14px; }
  .header-brand img{ width:72px; height:72px; flex-shrink:0; }
  header .sub{ color:var(--text-dim); font-size:12.5px; margin-top:4px; }
  .header-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .header-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .live-indicator{ display:flex; align-items:center; gap:5px; padding:0 6px; }
  .live-dot{
    width:8px; height:8px; border-radius:50%; background:#6b7c8d;
    transition:background-color .3s ease, box-shadow .3s ease; flex-shrink:0;
  }
  .live-dot.online{ background:#2f9e6f; box-shadow:0 0 5px rgba(47,158,111,.7); }
  .live-dot.offline{ background:#6b7c8d; }
  .live-dot.error{ background:#c1554a; box-shadow:0 0 5px rgba(193,85,74,.7); }
  .hbtn{
    background:var(--panel); border:1px solid var(--border); color:var(--text-dim);
    font-size:11.5px; font-weight:600; padding:7px 9px; border-radius:7px; cursor:pointer;
    font-family:var(--sans); display:flex; align-items:center; justify-content:center;
  }
  .hbtn:hover{ color:var(--accent); border-color:var(--accent); }
  .hbtn.flash{ color:var(--good); border-color:var(--good); }

  .tabs{ display:flex; gap:6px; padding:10px 16px 0; }
  .tab{
    flex:1; text-align:center; padding:9px 8px; border-radius:8px 8px 0 0;
    background:var(--panel); color:var(--text); font-size:13px; font-weight:600;
    border:1px solid var(--border); border-bottom:none; cursor:pointer;
  }
  .tab.active{ background:var(--panel-2); color:var(--text); }

  main{ padding:0 16px 16px; }
  section{ display:none; background:var(--panel-2); border:1px solid var(--border); border-radius:0 8px 8px 8px; padding:14px 12px; }
  section.active{ display:block; }

  .subtabs{ display:flex; gap:8px; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:10px; }
  .subtab{
    padding:6px 12px; border-radius:6px; background:var(--panel); color:var(--text-dim);
    font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid transparent;
  }
  .subtab.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  .subsection{ display:none; }
  .subsection.active{ display:block; }

function defaultVisibleMonths(){
  const cur = new Date().getMonth(); // 0-11
  const arr = [];
  for (let k = 0; k < 5; k++) arr.push((cur + k) % 12);
  return arr;
}

function visibleMonthIndices(){
  const set = new Set(state.visibleMonths || defaultVisibleMonths());
  return Array.from(set).sort((a, b) => a - b); // natural Jan→Dec order
}

function spreadSBM(i){
  const prev = (i - 1 + 12) % 12;
  return state.futuresSBM[prev] - state.futuresSBM[i];
}
function spreadCorn(i){
  const prev = (i - 1 + 12) % 12;
  return state.futuresCorn[prev] - state.futuresCorn[i];
}

function mround(v, m){ return Math.round(v/m)*m; }
function mround10(v){ return Math.round(v * 10) / 10; }

// Formats a raw local-price number: round to the nearest 10, then group
// thousands with a period and append "d" — e.g. 11546 -> "11.550d".
function formatLocalPrice(raw){
  if (raw === null || raw === undefined || Number.isNaN(raw)) return null;
  const rounded = Math.round(raw / 10) * 10;
  return rounded.toLocaleString('de-DE') + 'd';
}

function vnSbmLocalPrice(i){
  const ind = state.indication[i];
  const fut = state.futuresSBM[i];
  const fx = state.fx && state.fx.vietnam ? state.fx.vietnam[i] : null;
  if (ind === null || ind === undefined || fut === null || fut === undefined || fx === null || fx === undefined) return null;
  const raw = (((ind + fut) * 1.1023) + 7) * fx;
  return formatLocalPrice(raw);
}

function vnCornLocalPrice(i){
  const ind = state.cornIndication[i];
  const fut = state.futuresCorn[i];
  const fx = state.fx && state.fx.vietnam ? state.fx.vietnam[i] : null;
  if (ind === null || ind === undefined || fut === null || fut === undefined || fx === null || fx === undefined) return null;
  const raw = (((ind + fut) * 0.39368) + 5.5) * fx;
  return formatLocalPrice(raw);
}

// Vietnam freight: 5M2C, 7C/5C ARG/BRA are manual. Everything else is derived,
// matching the exact formulas in the source file's freight table.
function getVNFreight(key, i){
  const base5M2C = state.freight['5M2C'][i];
  const base5CARG = state.freight['5CARG'][i];
  switch(key){
    case '5M2W': return mround10(base5M2C * 66000 / 68000);
    case '4M1C': return mround10(base5CARG * 59500 / 53000);
    case '3M2C': return mround10(base5CARG * 59500 / 55500);
    case '2M3C': return mround10(base5CARG * 59500 / 55500);
    case '4M3C': return base5M2C * 66000 / 67500;
    case '3M4C': return getVNFreight('4M3C', i) * 67500 / 69000;
    default: return state.freight[key][i];
  }
}

// Malaysia freight: 5M2C, 4M3C, 7C/5C ARG/BRA are manual. 4M1C/3M2C/2M3C derived from 5C ARG.
function getMYFreight(key, i){
  const base5CARG = state.malaysia.freight['5CARG'][i];
  switch(key){
    case '4M1C': return mround10(base5CARG * 59500 / 53000);
    case '3M2C': return mround10(base5CARG * 59500 / 55500);
    case '2M3C': return mround10(base5CARG * 59500 / 55500);
    case '3M4C': return state.malaysia.freight['4M3C'][i] * 67500 / 69000;
    default: return state.malaysia.freight[key][i];
  }
}

// Indonesia freight: 5M2C, 5C ARG, 7M, 5M are manual. 5M2W from 5M2C; 4M1W/4M1C/3M2C/2M3C from 5C ARG.

// --- Corn (independent pure-corn combos) ---
function computeCornCombos(fobIdx, freightGetter, spreadVal){
  const ARG = state.fob.ARGCORN[fobIdx], BRA = state.fob.BRACORN[fobIdx];
  const sp = spreadVal || 0;
  const cfr = (fr, fob) => fr/0.39368 + fob + sp;
  const vals = {
    '7C ARG': mround(cfr(freightGetter('7CARG'), ARG), 0.5),
    '5C ARG': mround(cfr(freightGetter('5CARG'), ARG), 0.5),
    '7C BRA': mround(cfr(freightGetter('7CBRA'), BRA), 0.5),
    '5C BRA': mround(cfr(freightGetter('5CBRA'), BRA), 0.5)
  };
  const replacement = mround(Math.min(...Object.values(vals)), 0.5);
  return { vals, replacement };
}
function computeCorn(i){
  return computeCornCombos(i, key => state.freight[key][i], 0);
}
function computeCornCarry(i){
  const prev = (i - 1 + 12) % 12;
  const spread = spreadCorn(i);
  return computeCornCombos(prev, key => (state.freight[key][i] + state.freight[key][prev]) / 2, spread);
}

// --- SBM combinations ---
function computeCombos(indexedFobIdx, topoffFobIdx, saleIdx, freightGetter, spreadVal, cornSpreadVal){
  const ASBM = state.fob.ASBM[indexedFobIdx];
  const UPR = state.fob.UPRCORN[indexedFobIdx];
  const BBNC = state.fob.BBNCCORN[topoffFobIdx];
  const WHEAT = state.fob.WHEAT[topoffFobIdx];
  const cSaleRaw = state.cornIndication[saleIdx];
  const cSale = (cSaleRaw !== null && cSaleRaw !== undefined) ? cSaleRaw : 224;
  const wSale = state.wheatSale[saleIdx];
  const sp = spreadVal || 0;
  const cSp = cornSpreadVal || 0;

  const cfrSBM = fr => fr/1.1023 + ASBM + sp;      // Spread applies only to the indexed SBM leg
  const cfrCornBBNC = fr => fr/0.39368 + BBNC;     // top-off leg, always current-month FOB, no spread
  const cfrCornUPR = fr => fr/0.39368 + UPR + cSp; // indexed leg — gets corn's own futures spread in carry
  const cfrWheat = fr => fr + WHEAT;               // top-off leg, always current-month FOB, no spread
  const pnlCorn = (sale, cfr, qty) => (sale - cfr) * qty * 0.3937;
  const pnlWheat = (sale, cfr, qty) => (sale - cfr) * qty;

  const F = {
    '5M2C': freightGetter('5M2C'),
    '5M2W': freightGetter('5M2W'),
    '4M1C': freightGetter('4M1C'),
    '3M2C': freightGetter('3M2C'),
    '2M3C': freightGetter('2M3C')
  };

  // 5M2C — SBM 45,000 + BB/NC Corn 21,000
  const cfrSBM_5M2C = cfrSBM(F['5M2C']);
  const pnl_5M2C = pnlCorn(cSale, cfrCornBBNC(F['5M2C']), 21000);
  const final5M2C = cfrSBM_5M2C - pnl_5M2C/1.1023/45000;

  // 5M2W — SBM 45,000 + Wheat top-off 23,000
  const cfrSBM_5M2W = cfrSBM(F['5M2W']);
  const pnl_5M2W = pnlWheat(wSale, cfrWheat(F['5M2W']), 23000);
  const final5M2W = cfrSBM_5M2W - pnl_5M2W/1.1023/45000;

  // 4M3C — freight scaled from 5M2C by tonnage ratio
  const q4M3C = { sbm:36000, upr:9000, bbnc:22500 };
  const tot4M3C = q4M3C.sbm + q4M3C.upr + q4M3C.bbnc; // 67,500
  const F4M3C = F['5M2C'] * (66000 / tot4M3C);
  const cfrSBM_4M3C = cfrSBM(F4M3C);
  const pnlUPR_4M3C = pnlCorn(cSale, cfrCornUPR(F4M3C), q4M3C.upr);
  const pnlBBNC_4M3C = pnlCorn(cSale, cfrCornBBNC(F4M3C), q4M3C.bbnc);
  const final4M3C = cfrSBM_4M3C - (pnlUPR_4M3C + pnlBBNC_4M3C)/1.1023/q4M3C.sbm;

  // 3M4C — freight scaled from 4M3C
  const q3M4C = { sbm:27000, upr:18000, bbnc:24000 };
  const tot3M4C = q3M4C.sbm + q3M4C.upr + q3M4C.bbnc; // 69,000
  const F3M4C = F4M3C * (tot4M3C / tot3M4C);
  const cfrSBM_3M4C = cfrSBM(F3M4C);
  const pnlUPR_3M4C = pnlCorn(cSale, cfrCornUPR(F3M4C), q3M4C.upr);
  const pnlBBNC_3M4C = pnlCorn(cSale, cfrCornBBNC(F3M4C), q3M4C.bbnc);
  const final3M4C = cfrSBM_3M4C - (pnlUPR_3M4C + pnlBBNC_3M4C)/1.1023/q3M4C.sbm;

  // 4M1C — SBM 41,000 + BB/NC Corn top-off 12,000
  const cfrSBM_4M1C = cfrSBM(F['4M1C']);
  const pnl_4M1C = pnlCorn(cSale, cfrCornBBNC(F['4M1C']), 12000);
  const final4M1C = cfrSBM_4M1C - pnl_4M1C/1.1023/41000;

  // 3M2C — SBM 31,500 + UPR Corn 12,000 + BBNC top-off 12,000
  const cfrSBM_3M2C = cfrSBM(F['3M2C']);
  const pnlUPR_3M2C = pnlCorn(cSale, cfrCornUPR(F['3M2C']), 12000);
  const pnlBBNC_3M2C = pnlCorn(cSale, cfrCornBBNC(F['3M2C']), 12000);
  const final3M2C = cfrSBM_3M2C - (pnlUPR_3M2C + pnlBBNC_3M2C)/1.1023/31500;

  // 2M3C — SBM 21,000 + UPR Corn 22,500 + BBNC top-off 12,000
  const cfrSBM_2M3C = cfrSBM(F['2M3C']);
  const pnlUPR_2M3C = pnlCorn(cSale, cfrCornUPR(F['2M3C']), 22500);
  const pnlBBNC_2M3C = pnlCorn(cSale, cfrCornBBNC(F['2M3C']), 12000);
  const final2M3C = cfrSBM_2M3C - (pnlUPR_2M3C + pnlBBNC_2M3C)/1.1023/21000;

  const vals = {
    '5M2C': mround(final5M2C, 0.5),
    '5M2W': mround(final5M2W, 0.5),
    '4M3C': mround(final4M3C, 0.5),
    '3M4C': mround(final3M4C, 0.5),
    '4M1C': mround(final4M1C, 0.5),
    '3M2C': mround(final3M2C, 0.5),
    '2M3C': mround(final2M3C, 0.5)
  };
  const mainFour = ['5M2C','5M2W','4M3C','3M4C'];
  const replacement = mround(Math.min(...mainFour.map(k => vals[k])), 0.5);
  return { vals, replacement };
}

function computeMonth(i){
  return computeCombos(i, i, i, key => getVNFreight(key, i), 0, 0);
}
function computeMonthCarry(i){
  const prev = (i - 1 + 12) % 12;
  const spread = spreadSBM(i);
  const cornSpread = spreadCorn(i);
  return computeCombos(prev, i, i, key => (getVNFreight(key, i) + getVNFreight(key, prev)) / 2, spread, cornSpread);
}

// --- Malaysia: same FOB/Futures as Vietnam, own freight table, no wheat combo ---
function computeMYCombos(indexedFobIdx, topoffFobIdx, saleIdx, freightGetter, spreadVal, cornSpreadVal){
  const ASBM = state.fob.ASBM[indexedFobIdx];
  const UPR = state.fob.UPRCORN[indexedFobIdx];
  const BBNC = state.fob.BBNCCORN[topoffFobIdx];
  const cSaleRaw = state.malaysia.cornIndication[saleIdx];
  const cSale = (cSaleRaw !== null && cSaleRaw !== undefined) ? cSaleRaw : 225;
  const sp = spreadVal || 0;
  const cSp = cornSpreadVal || 0;

  const cfrSBM = fr => fr/1.1023 + ASBM + sp;
  const cfrCornBBNC = fr => fr/0.39368 + BBNC;
  const cfrCornUPR = fr => fr/0.39368 + UPR + cSp;
  const pnlCorn = (sale, cfr, qty) => (sale - cfr) * qty * 0.3937;

  const F5M2C = freightGetter('5M2C');
  const F4M3C = freightGetter('4M3C'); // direct table entry for Malaysia (unlike Vietnam)
  const F4M1C = freightGetter('4M1C');
  const F3M2C = freightGetter('3M2C');
  const F2M3C = freightGetter('2M3C');

  // 5M2C — SBM 45,000 + BB/NC Corn 21,000
  const cfrSBM_5M2C = cfrSBM(F5M2C);
  const pnl_5M2C = pnlCorn(cSale, cfrCornBBNC(F5M2C), 21000);
  const final5M2C = cfrSBM_5M2C - pnl_5M2C/1.1023/45000;

  // 4M3C — direct freight entry
  const q4M3C = { sbm:36000, upr:9000, bbnc:22500 };
  const tot4M3C = q4M3C.sbm + q4M3C.upr + q4M3C.bbnc; // 67,500
  const cfrSBM_4M3C = cfrSBM(F4M3C);
  const pnlUPR_4M3C = pnlCorn(cSale, cfrCornUPR(F4M3C), q4M3C.upr);
  const pnlBBNC_4M3C = pnlCorn(cSale, cfrCornBBNC(F4M3C), q4M3C.bbnc);
  const final4M3C = cfrSBM_4M3C - (pnlUPR_4M3C + pnlBBNC_4M3C)/1.1023/q4M3C.sbm;

  // 3M4C — freight scaled from 4M3C (Malaysia has no direct 3M4C freight entry)
  const q3M4C = { sbm:27000, upr:18000, bbnc:24000 };
  const tot3M4C = q3M4C.sbm + q3M4C.upr + q3M4C.bbnc; // 69,000
  const F3M4C = F4M3C * (tot4M3C / tot3M4C);
  const cfrSBM_3M4C = cfrSBM(F3M4C);
  const pnlUPR_3M4C = pnlCorn(cSale, cfrCornUPR(F3M4C), q3M4C.upr);
  const pnlBBNC_3M4C = pnlCorn(cSale, cfrCornBBNC(F3M4C), q3M4C.bbnc);
  const final3M4C = cfrSBM_3M4C - (pnlUPR_3M4C + pnlBBNC_3M4C)/1.1023/q3M4C.sbm;

  // 4M1C — SBM 41,000 + BB/NC Corn top-off 12,000
  const cfrSBM_4M1C = cfrSBM(F4M1C);
  const pnl_4M1C = pnlCorn(cSale, cfrCornBBNC(F4M1C), 12000);
  const final4M1C = cfrSBM_4M1C - pnl_4M1C/1.1023/41000;

  // 3M2C — SBM 31,500 + UPR Corn 12,000 + BBNC top-off 12,000
  const cfrSBM_3M2C = cfrSBM(F3M2C);
  const pnlUPR_3M2C = pnlCorn(cSale, cfrCornUPR(F3M2C), 12000);
  const pnlBBNC_3M2C = pnlCorn(cSale, cfrCornBBNC(F3M2C), 12000);
  const final3M2C = cfrSBM_3M2C - (pnlUPR_3M2C + pnlBBNC_3M2C)/1.1023/31500;

  // 2M3C — SBM 21,000 + UPR Corn 22,500 + BBNC top-off 12,000
  const cfrSBM_2M3C = cfrSBM(F2M3C);
  const pnlUPR_2M3C = pnlCorn(cSale, cfrCornUPR(F2M3C), 22500);
  const pnlBBNC_2M3C = pnlCorn(cSale, cfrCornBBNC(F2M3C), 12000);
  const final2M3C = cfrSBM_2M3C - (pnlUPR_2M3C + pnlBBNC_2M3C)/1.1023/21000;

  const vals = {
    '5M2C': mround(final5M2C, 0.5),
    '4M3C': mround(final4M3C, 0.5),
    '3M4C': mround(final3M4C, 0.5),
    '4M1C': mround(final4M1C, 0.5),
    '3M2C': mround(final3M2C, 0.5),
    '2M3C': mround(final2M3C, 0.5)
  };
  // Malaysia's Replacement only counts 4M3C / 3M4C (matches the source Dashboard logic)
  const mainTwo = ['4M3C','3M4C'];
  const replacement = mround(Math.min(...mainTwo.map(k => vals[k])), 0.5);
  return { vals, replacement };
}

function computeMY(i){
  return computeMYCombos(i, i, i, key => getMYFreight(key, i), 0, 0);
}
function computeMYCarry(i){
  const prev = (i - 1 + 12) % 12;
  const spread = spreadSBM(i);
  const cornSpread = spreadCorn(i);
  return computeMYCombos(prev, i, i, key => (getMYFreight(key, i) + getMYFreight(key, prev)) / 2, spread, cornSpread);
}

function computeMYCorn(i){
  return computeCornCombos(i, key => state.malaysia.freight[key][i], 0);
}
function computeMYCornCarry(i){
  const prev = (i - 1 + 12) % 12;
  const spread = spreadCorn(i);
  return computeCornCombos(prev, key => (state.malaysia.freight[key][i] + state.malaysia.freight[key][prev]) / 2, spread);
}

// --- Indonesia: shares FOB/Futures with Vietnam, own freight table.
// Corn sale = Vietnam's Corn Sale Price + $3 (source-file link). Wheat sale = Vietnam's directly.
// Indonesia's Corn Sale Price defaults to Vietnam's corn indication + 3 for any
// month left blank in the Input tab; a manually typed value overrides it.
function indonesiaCornSaleDefault(i){
  const v = state.cornIndication[i];
  return (v === null || v === undefined) ? null : v + 3;
}
function effectiveIndonesiaCornSale(i){
  const manual = state.indonesia.cornSale[i];
  return (manual !== null && manual !== undefined) ? manual : indonesiaCornSaleDefault(i);
}

function computeIDCombos(indexedFobIdx, topoffFobIdx, saleIdx, freightGetter, spreadVal, cornSpreadVal){
  const ASBM = state.fob.ASBM[indexedFobIdx];
  const BRZSBMP = state.fob.BRZSBMP[indexedFobIdx];
  const UPR = state.fob.UPRCORN[indexedFobIdx];
  const BBNC = state.fob.BBNCCORN[topoffFobIdx];
  const WHEAT = state.fob.WHEAT[topoffFobIdx];
  const cSale = effectiveIndonesiaCornSale(saleIdx);
  const wSale = state.indonesia.wheatSale[saleIdx];
  const sp = spreadVal || 0;
  const cSp = cornSpreadVal || 0;

  const cfrSBM = fr => fr/1.1023 + ASBM + sp;
  const cfrCornBBNC = fr => fr/0.39368 + BBNC;
  const cfrCornUPR = fr => fr/0.39368 + UPR + cSp;
  const cfrWheat = fr => fr + WHEAT;
  const pnlCorn = (sale, cfr, qty) => (sale - cfr) * qty * 0.3937;
  const pnlWheat = (sale, cfr, qty) => (sale - cfr) * qty;

  const F5M2C = freightGetter('5M2C');
  const F5M2W = freightGetter('5M2W');
  const F4M1W = freightGetter('4M1W');
  const F4M1C = freightGetter('4M1C');
  const F3M2C = freightGetter('3M2C');
  const F2M3C = freightGetter('2M3C');
  const F7M = freightGetter('7M');
  const F5M = freightGetter('5M');

  // 5M2C — SBM 45,000 + BB/NC Corn 21,000
  const cfrSBM_5M2C = cfrSBM(F5M2C);
  const pnl_5M2C = pnlCorn(cSale, cfrCornBBNC(F5M2C), 21000);
  const final5M2C = cfrSBM_5M2C - pnl_5M2C/1.1023/45000;

  // 5M2W — SBM 45,000 + Wheat top-off 23,000
  const cfrSBM_5M2W = cfrSBM(F5M2W);
  const pnl_5M2W = pnlWheat(wSale, cfrWheat(F5M2W), 23000);
  const final5M2W = cfrSBM_5M2W - pnl_5M2W/1.1023/45000;

  // 4M1W — SBM 41,000 + Wheat top-off 12,000
  const cfrSBM_4M1W = cfrSBM(F4M1W);
  const pnl_4M1W = pnlWheat(wSale, cfrWheat(F4M1W), 12000);
  const final4M1W = cfrSBM_4M1W - pnl_4M1W/1.1023/41000;

  // 4M1C — SBM 41,000 + BB/NC Corn top-off 12,000
  const cfrSBM_4M1C = cfrSBM(F4M1C);
  const pnl_4M1C = pnlCorn(cSale, cfrCornBBNC(F4M1C), 12000);
  const final4M1C = cfrSBM_4M1C - pnl_4M1C/1.1023/41000;

  // 3M2C — SBM 31,500 + UPR Corn 12,000 + BBNC top-off 12,000
  const cfrSBM_3M2C = cfrSBM(F3M2C);
  const pnlUPR_3M2C = pnlCorn(cSale, cfrCornUPR(F3M2C), 12000);
  const pnlBBNC_3M2C = pnlCorn(cSale, cfrCornBBNC(F3M2C), 12000);
  const final3M2C = cfrSBM_3M2C - (pnlUPR_3M2C + pnlBBNC_3M2C)/1.1023/31500;

  // 2M3C — SBM 21,000 + UPR Corn 22,500 + BBNC top-off 12,000
  const cfrSBM_2M3C = cfrSBM(F2M3C);
  const pnlUPR_2M3C = pnlCorn(cSale, cfrCornUPR(F2M3C), 22500);
  const pnlBBNC_2M3C = pnlCorn(cSale, cfrCornBBNC(F2M3C), 12000);
  const final2M3C = cfrSBM_2M3C - (pnlUPR_2M3C + pnlBBNC_2M3C)/1.1023/21000;

  // 7M — full cargo, BRA SBM only, 63,000t. FOB = BRZ SBMP + 25 - 13 (fixed route adjustment)
  const final7M = F7M/1.1023 + (BRZSBMP + 25 - 13) + sp;

  // 5M — full cargo, ARG SBM only, 47,000t. FOB = ASBM directly
  const final5M = F5M/1.1023 + ASBM + sp;

  const vals = {
    '5M2C': mround(final5M2C, 0.5),
    '5M2W': mround(final5M2W, 0.5),
    '4M1W': mround(final4M1W, 0.5),
    '4M1C': mround(final4M1C, 0.5),
    '3M2C': mround(final3M2C, 0.5),
    '2M3C': mround(final2M3C, 0.5),
    '7M': mround(final7M, 0.5),
    '5M': mround(final5M, 0.5)
  };
  // Indonesia's Replacement excludes 2M3C (matches the source Dashboard logic)
  const mainSeven = ['5M2C','5M2W','4M1W','4M1C','3M2C','7M','5M'];
  const replacement = mround(Math.min(...mainSeven.map(k => vals[k])), 0.5);
  return { vals, replacement };
}

function computeID(i){
  return computeIDCombos(i, i, i, key => getIDFreight(key, i), 0, 0);
}
function computeIDCarry(i){
  const prev = (i - 1 + 12) % 12;
  const spread = spreadSBM(i);
  const cornSpread = spreadCorn(i);
  return computeIDCombos(prev, i, i, key => (getIDFreight(key, i) + getIDFreight(key, prev)) / 2, spread, cornSpread);
}

function deepMergeDefaults(target, defaults){
  if (typeof defaults !== 'object' || defaults === null || Array.isArray(defaults)) return;
  for (const key in defaults){
    if (!(key in target) || target[key] === null || target[key] === undefined){
      target[key] = JSON.parse(JSON.stringify(defaults[key]));
    } else if (
      typeof defaults[key] === 'object' && defaults[key] !== null && !Array.isArray(defaults[key]) &&
      typeof target[key] === 'object' && target[key] !== null && !Array.isArray(target[key])
    ){
      deepMergeDefaults(target[key], defaults[key]);
    }
  }
}

function migrateLegacyBalToSell(){
  // Earlier versions had one shared "balToSell" array per destination used by
  // both SBM and Corn tables. Move that data into balToSellSBM so it isn't lost,
  // then drop the old key — SBM and Corn now track independent balances.
  if (state.balToSell){
    if (!state.balToSellSBM) state.balToSellSBM = state.balToSell;
    delete state.balToSell;
  }
  if (state.malaysia && state.malaysia.balToSell){
    if (!state.malaysia.balToSellSBM) state.malaysia.balToSellSBM = state.malaysia.balToSell;
    delete state.malaysia.balToSell;
  }
  if (state.indonesia && state.indonesia.balToSell){
    if (!state.indonesia.balToSellSBM) state.indonesia.balToSellSBM = state.indonesia.balToSell;
    delete state.indonesia.balToSell;
  }
}

function ensureDestinations(){
  migrateLegacyBalToSell();
  deepMergeDefaults(state, defaultState);
}

function setLiveStatus(status){
  // status: 'online' | 'offline' | 'error'
  const dot = document.getElementById('liveDot');
  const wrap = document.getElementById('liveIndicator');
  if (!dot || !wrap) return;
  dot.classList.remove('online', 'offline', 'error');
  dot.classList.add(status);
  const labels = { online: 'Online — synced', offline: 'Offline — no network', error: 'No connection — check network' };
  wrap.title = labels[status] || '';
}

window.addEventListener('offline', () => setLiveStatus('offline'));
window.addEventListener('online', () => setLiveStatus('online'));

function showOfflineBanner(){
  if (document.getElementById('offlineBanner')) return;
  const banner = document.createElement('div');
  banner.id = 'offlineBanner';
  banner.style.cssText = 'background:#3a2020; color:#e8a0a0; font-size:12px; padding:8px 16px; text-align:center; border-bottom:1px solid #5a2c2c;';
  banner.textContent = 'Could not connect — showing local data only. Changes may not save until you reconnect.';
  document.body.insertBefore(banner, document.body.firstChild);
}

function hideOfflineBanner(){
  const el = document.getElementById('offlineBanner');
  if (el) el.remove();
}

// True while the user is actively typing in a field, so a live update from
// another device doesn't yank the table out from under their cursor.
function isEditingNow(){
  const el = document.activeElement;
  const mainEl = document.querySelector('main');
  return !!(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') && mainEl && mainEl.contains(el));
}

let pendingRemoteData = undefined; // holds a snapshot's data while the user is mid-edit

function applyRemoteState(data){
  if (data && data.json){
    try{ state = JSON.parse(data.json); }catch(e){ console.error('parse failed', e); return; }
  }
  if (!state.visibleMonths || !state.visibleMonths.length) state.visibleMonths = defaultVisibleMonths();
  ensureDestinations();
  renderAll();
}

// Once the user finishes editing (blurs the field), apply any live update
// that arrived while they were typing.
document.addEventListener('focusout', () => {
  setTimeout(() => {
    if (pendingRemoteData !== undefined && !isEditingNow()){
      const data = pendingRemoteData;
      pendingRemoteData = undefined;
      applyRemoteState(data);
    }
  }, 60);
});

let unsubscribeMainDoc = null;

function loadState(){
  return waitForAuth().then(authResult => {
    const connected = authResult && authResult !== 'timeout';
    if (!connected){
      if (!state.visibleMonths || !state.visibleMonths.length) state.visibleMonths = defaultVisibleMonths();
      ensureDestinations();
      renderAll();
      showOfflineBanner();
      setLiveStatus(navigator.onLine ? 'error' : 'offline');
      return;
    }

    let gotFirstSnapshot = false;
    const initialTimeout = setTimeout(() => {
      if (!gotFirstSnapshot){
        if (!state.visibleMonths || !state.visibleMonths.length) state.visibleMonths = defaultVisibleMonths();
        ensureDestinations();
        renderAll();
        showOfflineBanner();
        setLiveStatus(navigator.onLine ? 'error' : 'offline');
      }
    }, 6000);

    unsubscribeMainDoc = onSnapshot(
      DOC_REF,
      { includeMetadataChanges: true },
      (snap) => {
        // Our own optimistic write echoing back before server confirms — state
        // already reflects it locally, nothing new to apply.
        if (snap.metadata.hasPendingWrites){
          setLiveStatus('online');
          return;
        }
        clearTimeout(initialTimeout);
        hideOfflineBanner();
        const data = snap.exists() ? snap.data() : null;
        if (!gotFirstSnapshot){
          gotFirstSnapshot = true;
          applyRemoteState(data);
        } else if (isEditingNow()){
          pendingRemoteData = data; // apply once the user blurs the field
        } else {
          applyRemoteState(data);
        }
        setLiveStatus('online');
      },
      (err) => {
        console.error('snapshot error', err);
        clearTimeout(initialTimeout);
        setLiveStatus(navigator.onLine ? 'error' : 'offline');
        if (!gotFirstSnapshot){
          gotFirstSnapshot = true;
          if (!state.visibleMonths || !state.visibleMonths.length) state.visibleMonths = defaultVisibleMonths();
          ensureDestinations();
          renderAll();
          showOfflineBanner();
        }
      }
    );
  });
}

let saveTimeout;
function scheduleSave(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try{
      await setDoc(DOC_REF, { json: JSON.stringify(state), updatedAt: new Date().toISOString() });
      setLiveStatus('online');
      hideOfflineBanner();
      const pill = document.getElementById('savePill');
      pill.classList.add('show');
      setTimeout(()=>pill.classList.remove('show'), 1200);
    }catch(e){
      console.error('save failed', e);
      setLiveStatus(navigator.onLine ? 'error' : 'offline');
      const pill = document.getElementById('savePill');
      pill.textContent = 'Save failed — check connection';
      pill.style.color = 'var(--bad)';
      pill.classList.add('show');
      setTimeout(()=>{ pill.classList.remove('show'); pill.textContent='Saved'; pill.style.color=''; }, 2500);
    }
  }, 400);
}

function numInput(value, onChange, extraClass){
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.inputMode = 'decimal';
  inp.autocomplete = 'off';
  inp.autocapitalize = 'off';
  inp.spellcheck = false;
  inp.className = 'cell' + (extraClass ? ' ' + extraClass : '');
  inp.value = (value === null || value === undefined) ? '' : value;
  inp.addEventListener('change', e => {
    const raw = e.target.value.replace(',', '.').trim();
    let v = null;
    if (raw !== '' && raw !== '-'){
      const parsed = parseFloat(raw);
      v = Number.isNaN(parsed) ? null : parsed;
    }
    onChange(v);
    scheduleSave();
    renderAll();
  });
  return inp;
}

function balColor(v){
  if (v === null || v === undefined || v === '') return '';
  if (v < 0) return 'var(--bad)';
  if (v > 0) return 'var(--good)';
  return '';
}

function buildFFATable(){
  const cols = state.ffa.labels;
  const wrap = document.createElement('div');
  wrap.className = 'scrollx';
  const table = document.createElement('table');
  table.className = 'grid-table';

  const thead = document.createElement('tr');
  thead.innerHTML = '<th class="rowlabel"></th>' + cols.map(c => `<th>${c}</th>`).join('');
  table.appendChild(thead);

  function editRow(label, arr){
    const tr = document.createElement('tr');
    const tdLabel = document.createElement('td');
    tdLabel.className = 'rowlabel';
    tdLabel.textContent = label;
    tr.appendChild(tdLabel);
    cols.forEach((c, idx) => {
      const td = document.createElement('td');
      td.appendChild(numInput(arr[idx], v => { arr[idx] = (v === null ? 0 : v); }));
      tr.appendChild(td);
    });
    table.appendChild(tr);
  }

  function readonlyRow(label, getVal){
    const tr = document.createElement('tr');
    let html = `<td class="rowlabel" style="color:var(--text-dim); font-size:11.5px;">${label}</td>`;
    cols.forEach((c, idx) => {
      const v = getVal(idx);
      html += `<td style="font-family:var(--mono); color:var(--text-dim);">${v === null ? '—' : v.toFixed(2)}</td>`;
    });
    tr.innerHTML = html;
    table.appendChild(tr);
  }

  editRow('FFA T-1', state.ffa.t1);
  editRow('FFA Today', state.ffa.today);
  readonlyRow('Change', idx => state.ffa.today[idx] - state.ffa.t1[idx]);
  readonlyRow('FRT / mt', idx => idx === 4 ? null : ((state.ffa.today[idx] - state.ffa.t1[idx]) * state.ffa.voyDays / state.ffa.tonnage));

  wrap.appendChild(table);
  return wrap;
}

function singleValueRow(label, getVal, setVal){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; align-items:center; gap:10px; margin:8px 0 4px;';
  const lbl = document.createElement('span');
  lbl.textContent = label;
  lbl.style.cssText = 'color:var(--text-dim); font-size:12.5px;';
  wrap.appendChild(lbl);
  wrap.appendChild(numInput(getVal(), v => setVal(v === null ? 0 : v)));
  return wrap;
}

function renderComboTable(el, opts){
  const { title, combos, labels, mainFour, computeFn, cfrArr, indArr, balArr, avgArr, localPriceFn, noteHtml } = opts;
  const visible = visibleMonthIndices();

  el.appendChild(sectionTitle(title));
  const wrap = document.createElement('div');
  wrap.className = 'scrollx';
  const table = document.createElement('table');
  table.className = 'grid-table results-table';

  const thead = document.createElement('tr');
  thead.innerHTML = '<th class="rowlabel">Month</th>' +
    combos.map(c => `<th>${labels ? labels[c] : c}</th>`).join('') +
    '<th>Replcmt.</th><th>CFR Mkt.</th><th>Indic.</th><th>vs Replcmt.</th>' +
    (localPriceFn ? '<th>Local Price</th>' : '') +
    (balArr ? '<th>Bal. to Sell</th>' : '') +
    (avgArr ? '<th>Ave. Sold Price</th>' : '');
  table.appendChild(thead);

  visible.forEach(i => {
    const tr = document.createElement('tr');
    const { vals, replacement } = computeFn(i);
    const bestVal = Math.min(...mainFour.map(k => vals[k]));

    let html = `<td class="rowlabel">${MONTHS_FULL[i]}</td>`;
    combos.forEach(c => {
      const isBest = mainFour.includes(c) && vals[c] === bestVal;
      html += `<td class="combo${isBest ? ' best' : ''}">${vals[c].toFixed(1)}</td>`;
    });
    html += `<td class="repl">${replacement.toFixed(1)}</td>`;
    tr.innerHTML = html;

    const tdCfr = document.createElement('td');
    tdCfr.appendChild(numInput(cfrArr[i], v => { cfrArr[i] = v; }));
    tr.appendChild(tdCfr);

    const tdIndic = document.createElement('td');
    tdIndic.appendChild(numInput(indArr[i], v => { indArr[i] = v; }, 'cell-indic'));
    tr.appendChild(tdIndic);

    const indic = indArr[i];
    const tdDelta = document.createElement('td');
    if (indic !== null && indic !== undefined){
      const delta = indic - replacement;
      tdDelta.className = delta >= 0 ? 'delta-pos' : 'delta-neg';
      tdDelta.textContent = (delta > 0 ? '+' : '') + delta.toFixed(1);
    } else {
      tdDelta.textContent = '—';
    }
    tr.appendChild(tdDelta);

    if (localPriceFn){
      const tdLocal = document.createElement('td');
      tdLocal.className = 'combo';
      const formatted = localPriceFn(i);
      tdLocal.textContent = formatted !== null ? formatted : '—';
      tr.appendChild(tdLocal);
    }

    if (balArr){
      const tdBal = document.createElement('td');
      const balInp = numInput(balArr[i], v => { balArr[i] = v; });
      balInp.style.color = balColor(balArr[i]);
      tdBal.appendChild(balInp);
      tr.appendChild(tdBal);
    }

    if (avgArr){
      const tdAvg = document.createElement('td');
      tdAvg.appendChild(numInput(avgArr[i], v => { avgArr[i] = v; }));
      tr.appendChild(tdAvg);
    }

    table.appendChild(tr);
  });

  wrap.appendChild(table);
  el.appendChild(wrap);

  if (noteHtml){
    const note = document.createElement('div');
    note.className = 'note';
    note.innerHTML = noteHtml;
    el.appendChild(note);
  }
}

}

// ---------- History / Daily Log Archive ----------

function todayDateKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatDateKeyLong(dateKey){
  const [y, m, d] = dateKey.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

async function logTodaySnapshot(){
  const noteInput = document.getElementById('historyNoteInput');
  const note = noteInput ? noteInput.value.trim() : '';
  const key = todayDateKey();
  const btn = document.getElementById('logTodayBtn');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try{
    // The day's market-news reading travels with the snapshot (news docs themselves are pruned after 10 days).
    let newsBlock = null;
    try{ await subscribeNews(); newsBlock = newsDocs.length ? buildNewsSnapshot() : null; }catch(e){ console.error('news snapshot skipped', e); }
    await setDoc(doc(LOGS_COLLECTION, key), {
      json: JSON.stringify(state),
      loggedAt: new Date().toISOString(),
      note: note || '',
      news: newsBlock
    });
    btn.textContent = 'Saved ✓';
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
    loadHistoryList();
  }catch(e){
    console.error('log save failed', e);
    btn.textContent = 'Failed — retry';
    btn.disabled = false;
    setTimeout(() => { btn.textContent = original; }, 2500);
  }
}

let historyDatesCache = [];

async function loadHistoryList(){
  const listEl = document.getElementById('historyList');
  if (!listEl) return;
  listEl.innerHTML = '<div class="note">Loading…</div>';
  try{
    const q = query(LOGS_COLLECTION, orderBy('loggedAt', 'desc'));
    const snap = await getDocs(q);
    historyDatesCache = [];
    snap.forEach(d => {
      const data = d.data();
      historyDatesCache.push({ key: d.id, note: data.note || '', loggedAt: data.loggedAt });
    });
    renderHistoryList();
  }catch(e){
    console.error('history list load failed', e);
    listEl.innerHTML = '<div class="note">Could not load history. Check your connection.</div>';
  }
}

function renderHistoryList(){
  const listEl = document.getElementById('historyList');
  if (!listEl) return;
  if (!historyDatesCache.length){
    listEl.innerHTML = '<div class="note">No snapshots logged yet. Use "Log Today\'s Snapshot" above to start building your archive.</div>';
    return;
  }
  listEl.innerHTML = '';
  let lastMonth = null;
  historyDatesCache.forEach(entry => {
    const [y, m] = entry.key.split('-');
    const monthLabel = `${MONTHS_FULL[parseInt(m, 10) - 1]} ${y}`;
    if (monthLabel !== lastMonth){
      lastMonth = monthLabel;
      const h = document.createElement('div');
      h.className = 'history-month-heading';
      h.textContent = monthLabel;
      listEl.appendChild(h);
    }
    const row = document.createElement('div');
    row.className = 'history-row';
    row.innerHTML = `<span class="history-date">${formatDateKeyLong(entry.key)}</span>` +
      (entry.note ? `<span class="history-note">${escapeHtml(entry.note)}</span>` : '');
    row.addEventListener('click', () => openHistoryDate(entry.key));
    listEl.appendChild(row);
  });
}

function jumpToNearestDate(pickedDateStr){
  if (!historyDatesCache.length){
    alert('No snapshots logged yet.');
    return;
  }
  const pickedTime = new Date(pickedDateStr).getTime();
  let best = historyDatesCache[0].key;
  let bestDiff = Infinity;
  historyDatesCache.forEach(e => {
    const diff = Math.abs(new Date(e.key).getTime() - pickedTime);
    if (diff < bestDiff){ bestDiff = diff; best = e.key; }
  });
  openHistoryDate(best);
}

let currentArchiveState = null;
let currentArchiveDateKey = null;
let currentArchiveNote = '';
let currentArchiveNews = null;
let historyVisibleMonths = [];
let previousArchiveState = null;
let previousArchiveDateKey = null;

function findPreviousLoggedDateKey(dateKey){
  // historyDatesCache entries are date-key strings like "2026-07-20", sortable as text.
  const older = historyDatesCache
    .map(e => e.key)
    .filter(k => k < dateKey)
    .sort()
    .reverse();
  return older.length ? older[0] : null;
}

async function openHistoryDate(dateKey){
  const detail = document.getElementById('historyDetail');
  const listWrap = document.getElementById('historyListWrap');
  detail.innerHTML = '<div class="note">Loading archived snapshot…</div>';
  detail.style.display = 'block';
  listWrap.style.display = 'none';
  try{
    const snap = await getDoc(doc(LOGS_COLLECTION, dateKey));
    if (!snap.exists()){
      detail.innerHTML = '<div class="note">This snapshot could not be found.</div>';
      return;
    }
    const data = snap.data();
    const archivedState = JSON.parse(data.json);
    currentArchiveState = archivedState;
    currentArchiveDateKey = dateKey;
    currentArchiveNote = data.note || '';
    currentArchiveNews = data.news || null;
    historyVisibleMonths = (archivedState.visibleMonths && archivedState.visibleMonths.length)
      ? [...archivedState.visibleMonths]
      : defaultVisibleMonths();

    // Fetch the previous logged snapshot (whatever the last log before this one
    // was — not necessarily literally the calendar day before) for the (+/-) deltas.
    previousArchiveState = null;
    previousArchiveDateKey = findPreviousLoggedDateKey(dateKey);
    if (previousArchiveDateKey){
      try{
        const prevSnap = await getDoc(doc(LOGS_COLLECTION, previousArchiveDateKey));
        if (prevSnap.exists()){
          previousArchiveState = JSON.parse(prevSnap.data().json);
        }
      }catch(e){
        console.error('previous snapshot load failed', e);
      }
    }

    renderArchiveDetail(detail);
  }catch(e){
    console.error('open history date failed', e);
    detail.innerHTML = '<div class="note">Could not load this snapshot. Check your connection.</div>';
  }
}

function closeHistoryDetail(){
  document.getElementById('historyDetail').style.display = 'none';
  document.getElementById('historyListWrap').style.display = 'block';
  currentArchiveState = null;
  currentArchiveDateKey = null;
  previousArchiveState = null;
  previousArchiveDateKey = null;
}

  const visible = new Set(historyVisibleMonths);

  MONTHS_FULL.forEach((m, i) => {
    const chip = document.createElement('div');
    chip.className = 'month-chip' + (visible.has(i) ? ' on' : '');
    chip.textContent = m;
    chip.addEventListener('click', () => {

      if (set.has(i)){
        if (set.size > 1) set.delete(i);
      } else {
        set.add(i);
      }
      historyVisibleMonths = Array.from(set);
      renderArchiveDetail(document.getElementById('historyDetail'));
    });
    wrap.appendChild(chip);
  });

  container.appendChild(wrap);
}

function buildReadOnlyTable(rows, getVal, monthsList, getPrevVal){
  const months = (monthsList || historyVisibleMonths || Array.from({ length: 12 }, (_, i) => i))
    .slice().sort((a, b) => a - b);
  const wrap = document.createElement('div');
  wrap.className = 'scrollx';
  const table = document.createElement('table');
  table.className = 'grid-table wide';

  const thead = document.createElement('tr');
  thead.innerHTML = '<th class="rowlabel"></th>' + months.map(i => `<th>${MONTHS_FULL[i]}</th>`).join('');
  table.appendChild(thead);

  rows.forEach(([label, key]) => {
    const tr = document.createElement('tr');
    let html = `<td class="rowlabel">${label}</td>`;
    months.forEach(i => {
      const v = getVal(key, i);
      const vText = (v === null || v === undefined || v === '') ? '—' : v;
      let deltaHtml = '';
      if (getPrevVal){
        const prev = getPrevVal(key, i);
        if (typeof v === 'number' && typeof prev === 'number'){
          const delta = v - prev;
          if (Math.abs(delta) >= 0.05){
            const cls = delta > 0 ? 'pos' : 'neg';
            const sign = delta > 0 ? '+' : '';
            deltaHtml = ` <span class="delta-inline ${cls}">(${sign}${delta.toFixed(1)})</span>`;
          }
        }
      }
      html += `<td style="font-family:var(--mono); color:var(--text-dim);">${vText}${deltaHtml}</td>`;
    });
    tr.innerHTML = html;
    table.appendChild(tr);
  });

  wrap.appendChild(table);
  return wrap;
}

// --- Excel (.xlsx) export / import ---
// Generic: walks the whole state tree, one row per leaf field, path like "fob.WHEAT" or "malaysia.freight.5M2C".
function flattenStateForExcel(obj, prefix, rows){
  Object.keys(obj).forEach(key => {
    const val = obj[key];
    const path = prefix ? prefix + '.' + key : key;
    if (val === null || val === undefined) return;
    if (Array.isArray(val)){
      rows.push([path, ...val.map(v => (v === null || v === undefined) ? '' : v)]);
    } else if (typeof val === 'object'){
      flattenStateForExcel(val, path, rows);
    } else {
      rows.push([path, val]);
    }
  });
}

// Writes a flattened "a.b.c" path + values back into a nested object, creating
// intermediate objects as needed. A single value writes a scalar; multiple
// values write a numeric array (blank cells become null).
function setStatePath(obj, path, values){
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++){
    const p = parts[i];
    if (typeof cur[p] !== 'object' || cur[p] === null) cur[p] = {};
    cur = cur[p];
  }
  const last = parts[parts.length - 1];
  const toNum = v => {
    if (v === '' || v === undefined || v === null) return null;
    const n = parseFloat(v);
    return isNaN(n) ? v : n;
  };
  if (values.length <= 1){
    cur[last] = toNum(values[0]);
  } else {
    cur[last] = values.map(toNum);
  }
}

function handleExcelImport(e){
  const file = e.target.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined'){
    alert('Excel library did not load. Check your internet connection and try again.');
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      if (!rows || rows.length < 2){
        alert('This Excel file does not look like a valid CTE data export.');
        return;
      }
      if (!confirm('This will overwrite matching fields in the current data with values from this Excel file. Continue?')) return;
      for (let i = 1; i < rows.length; i++){
        const row = rows[i];
        if (!row || !row[0]) continue;
        const path = String(row[0]).trim();
        const values = row.slice(1);
        setStatePath(state, path, values);
      }
      if (!state.visibleMonths || !state.visibleMonths.length) state.visibleMonths = defaultVisibleMonths();
      ensureDestinations();
      scheduleSave();
      renderAll();
      const btn = document.getElementById('excelImportBtn');
      const original = btn.innerHTML;
      btn.textContent = 'Imported ✓';
      btn.classList.add('flash');
      setTimeout(() => { btn.innerHTML = original; btn.classList.remove('flash'); }, 1500);
    }catch(err){
      console.error(err);
      alert('Could not read this Excel file. Make sure it is an .xlsx export from this app.');
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

// ---------------------------------------------------------------------------
// Data arrives pre-classified from the collector (newsfeed/collector.py) in the
// Firestore `news` collection: one document per EVENT carrying product /
// direction / impact / confidence / category / breaking / trend / summary.
// This page never scores anything — it listens, filters, and does the arithmetic:
//
//   qualifying event  = impact >= NEWS_MIN_IMPACT && confidence >= NEWS_MIN_CONF
//   signed impact     = +impact (BULLISH) | -impact (BEARISH) | 0 (NEUTRAL)
//   net impact (t)    = sum of signed impact over the trailing 24h ending at t
//   balance %         = net impact / sum of |impact| in the same window
//
// Direction is a PRICE argument, not sentiment: BULLISH = argues the CFR cost UP.
//
// Layout (agreed with the desk): clocks + CBOT LIVE → tiles + chart → breaking
// ticker → upcoming releases → three fixed boxes (World / Crop / Macro) with their
// own scroll → 👍 👎 on every row. Times are shown in Vietnam time.

function subscribeNews(){
  if (newsUnsub) return newsLoaded;
  let resolveLoaded;
  newsLoaded = new Promise(r => { resolveLoaded = r; });
  const since = Date.now() - NEWS_HISTORY_DAYS * 24 * 3600 * 1000;
  const q = query(NEWS_COLLECTION, orderBy('ms', 'desc'), limit(NEWS_QUERY_LIMIT));
  let newsFirstSnapshot = true;     // don't ding/notify for the entire history on first load
  newsUnsub = onSnapshot(q, (snap) => {
    newsDocs = [];
    snap.forEach(d => {
      const x = d.data();
      if (x && typeof x.ms === 'number' && x.ms >= since) newsDocs.push(x);
    });
    if (!newsFirstSnapshot){
      for (const change of snap.docChanges()){
        if (change.type !== 'added') continue;
        const x = change.doc.data();
        if (x && typeof x.ms === 'number' && x.ms >= since) newsMaybeAlert(x);
      }
    }
    newsFirstSnapshot = false;
    resolveLoaded();
    renderNewsBody();
  }, (err) => {
    console.error('news subscription failed', err);
    resolveLoaded();
    const body = document.getElementById('newsBody');
    if (body) body.innerHTML = '<div class="note">Could not load the news feed. If this is the first deployment, make sure the Firestore rules allow reading the <b>news</b> collection (see newsfeed/firestore.rules).</div>';
  });
  for (const product of PRICE_PRODUCTS){
    onSnapshot(doc(db, 'prices', product), (snap) => {
      newsPrices[product] = snap.exists() ? snap.data() : undefined;
      if (newsUI.chartProduct === product) renderNewsBody();
    }, () => { /* missing prices/{product} doc or unreadable rules — chart just falls back to no price line */ });
  }
  onSnapshot(NEWS_META_REF, (snap) => {
    newsMeta = snap.exists() ? snap.data() : null;
    const el = document.getElementById('newsLastRun');
    if (el) el.textContent = newsLastRunLabel();
  }, () => {});
  onSnapshot(NEWS_MUTED_REF, (snap) => {
    newsMuted = snap.exists() ? (snap.data().sources || []) : [];
    const el = document.getElementById('newsMuted');
    if (el) el.textContent = newsMuted.length ? `muted sources: ${newsMuted.join(', ')}` : '';
  }, () => {});
  onSnapshot(NEWS_FEEDBACK, (snap) => {
    newsVotes = {};
    snap.forEach(d => { const v = d.data(); if (v && v.vote) newsVotes[d.id] = v.vote; });
    renderNewsBody();
  }, () => {});
  subscribeMorningReport();
  return newsLoaded;
}

function newsLastRunLabel(){
  if (!newsMeta || !newsMeta.lastRunMs) return 'collector: no run recorded yet';
  const mins = Math.round((Date.now() - newsMeta.lastRunMs) / 60000);
  const when = mins < 1 ? 'just now' : mins < 60 ? `${mins} min ago` : mins < 2880 ? `${Math.round(mins / 60)} h ago` : `${Math.round(mins / 1440)} d ago`;
  return `updated ${when} · ${newsMeta.written || 0} new`;
}

function newsSigned(s){ return s.direction === 'BULLISH' ? s.impact : s.direction === 'BEARISH' ? -s.impact : 0; }
function newsQualifies(s){ return s.impact >= NEWS_MIN_IMPACT && s.confidence >= NEWS_MIN_CONF; }
function newsForProduct(product){ return product === 'ALL' ? newsDocs : newsDocs.filter(s => s.product === product); }
function newsVisible(s){ return newsVotes[s.id] !== 'dislike'; }     // a 👎 hides the row

// Trailing-24h reading ending at `endMs` over an ascending-sorted array of qualifying stories.
function newsWindowStats(asc, endMs){
  const startMs = endMs - NEWS_WINDOW_MS;
  let net = 0, abs = 0, n = 0, bull = 0, bear = 0, neu = 0;
  for (const s of asc){
    if (s.ms > endMs) break;
    if (s.ms <= startMs) continue;
    n++; net += newsSigned(s); abs += s.impact;
    if (s.direction === 'BULLISH') bull++; else if (s.direction === 'BEARISH') bear++; else neu++;
  }
  return { ms: endMs, net, n, bull, bear, neu, balance: abs ? Math.round(1000 * net / abs) / 10 : 0 };
}

// One point per qualifying story (evaluated at its own timestamp), plus a "now" point. When two
// consecutive stories are further apart than the window, the trailing sum genuinely empties out in
// between (the earlier story ages out of the 24h window before the next one arrives) — so we add
// one extra, honestly-computed point at exactly that moment (previous story's ms + 24h) instead of
// either leaving a break in the line or drawing a straight segment across the gap that would hide
// the real dip. The line is always a single continuous path; it just visits the true value at the
// point the window empties, rather than only at story timestamps.
function newsSeries(product){
  const asc = newsForProduct(product).filter(newsQualifies).slice().sort((a, b) => a.ms - b.ms);
  const pts = [];
  let prev = null;
  for (const s of asc){
    if (prev !== null && s.ms - prev > NEWS_WINDOW_MS) pts.push(newsWindowStats(asc, prev + NEWS_WINDOW_MS));
    pts.push(newsWindowStats(asc, s.ms));
    prev = s.ms;
  }
  const now = newsWindowStats(asc, Date.now());
  if (prev !== null && Date.now() - prev > NEWS_WINDOW_MS) pts.push(newsWindowStats(asc, prev + NEWS_WINDOW_MS));
  pts.push({ ...now, isNow: true });
  return { pts, now, count: asc.length };
}

// ── Smoothed net-impact series, for the CHART LINE only ──────────────────────
// newsSeries() above is the exact trailing-24h sum, sampled only at the moments it truly changes
// (a headline arrives, or one ages out of the window 24h later) — correct and fully traceable, so
// it stays exactly as-is for the tile numbers and the chart's own header figure. But on a quiet
// news day it sits dead flat for hours then jumps, which looks disconnected from a continuously
// moving futures price line (raised 2026-09-14 — compared against a competitor's equivalent chart:
// same trailing-24h-ish idea, but a much smoother line because they simply see far more qualifying
// headlines per day for the same product). Rather than chase headline volume, give the LINE a
// proper time-decay instead of a hard window: each qualifying story's signed impact decays
// exponentially with a 12h half-life (≈50% weight at 12h, ≈25% at 24h, ≈6% at 48h — "roughly a day
// matters most", like the hard window, but tapering smoothly instead of snapping to zero at an
// exact cutoff), resampled on a regular time grid across the whole visible range so the line keeps
// moving between headlines instead of sitting flat. This intentionally will NOT match the exact
// hard-window number shown in the tile/header — that number stays the traceable one; this is purely
// a smoother, continuously-comparable view for eyeballing against the price line.
const NEWS_DECAY_HALFLIFE_MS = 12 * 3600 * 1000;
const NEWS_DECAY_TAU = NEWS_DECAY_HALFLIFE_MS / Math.LN2;
const NEWS_DECAY_LOOKBACK_MS = 4 * NEWS_DECAY_HALFLIFE_MS; // ~48h; a story's weight is ~6% by then

function newsSmoothStep(spanMs){
  // Grid resolution scales with the visible span: fine enough to look continuous on a Daily chart,
  // coarse enough that a 5Y chart isn't computing millions of points.
  if (spanMs <= 2 * 24 * 3600 * 1000) return 15 * 60 * 1000;      // ≤2d   → 15 min
  if (spanMs <= 10 * 24 * 3600 * 1000) return 60 * 60 * 1000;     // ≤10d  → 1 hour
  if (spanMs <= 60 * 24 * 3600 * 1000) return 4 * 3600 * 1000;    // ≤60d  → 4 hours
  if (spanMs <= 400 * 24 * 3600 * 1000) return 24 * 3600 * 1000;  // ≤400d → 1 day
  return 3 * 24 * 3600 * 1000;                                    // longer → 3 days
}

function newsSmoothSeries(product, xMin, xMax){
  const asc = newsForProduct(product).filter(newsQualifies).slice().sort((a, b) => a.ms - b.ms);
  if (!asc.length) return [];
  const step = newsSmoothStep(xMax - xMin);
  const pts = [];
  let lo = 0; // stories before `lo` are more than the lookback behind every future grid point too
  let t = xMin;
  for (; t <= xMax; t += step){
    while (lo < asc.length && t - asc[lo].ms > NEWS_DECAY_LOOKBACK_MS) lo++;
    let net = 0;
    for (let i = lo; i < asc.length && asc[i].ms <= t; i++) net += newsSigned(asc[i]) * Math.exp(-(t - asc[i].ms) / NEWS_DECAY_TAU);
    pts.push({ ms: t, net });
  }
  // Always end exactly at xMax (usually "now") so the line's right edge lines up with the price
  // line's latest bar instead of stopping mid-step.
  if (!pts.length || pts[pts.length - 1].ms < xMax){
    while (lo < asc.length && xMax - asc[lo].ms > NEWS_DECAY_LOOKBACK_MS) lo++;
    let net = 0;
    for (let i = lo; i < asc.length && asc[i].ms <= xMax; i++) net += newsSigned(asc[i]) * Math.exp(-(xMax - asc[i].ms) / NEWS_DECAY_TAU);
    pts.push({ ms: xMax, net });
  }
  return pts;
}

// ── Price-anomaly alert ("flash haber" safety net, README item 14B) ─────────────────────────────
// 2026-09-15, Mete: "%1 artar veya azalırsa sistem alarm versin." No matter how far the collector's
// source list grows (items 12/13/14A), some flash headline will always slip through uncollected —
// this is the reactive half: the PAGE itself notices "price moved but no qualifying news explains
// it" and says so, instead of Mete having to spot the chart wiggle and go hunting on his phone (what
// actually happened on 14 Eylül). Computed entirely from data already in memory (intraday price bars
// + newsDocs) — no backend change, no extra network call.
const NEWS_ANOMALY_PCT = 1.0;                        // ± percent move that counts as "notable"
const NEWS_ANOMALY_WINDOW_MS = 15 * 60 * 1000;       // look back this far for the price move itself
const NEWS_ANOMALY_NEWS_WINDOW_MS = 60 * 60 * 1000;  // wider window checked for a qualifying explanation
const NEWS_ANOMALY_EXPLAIN_NET = 20;                 // minimum same-direction net impact that "explains" it
const NEWS_ANOMALY_STALE_MS = 30 * 60 * 1000;        // don't alarm on a price feed that stopped updating

function medianClose(bars){
  const closes = bars.map(b => b.c).filter(c => typeof c === 'number' && isFinite(c)).sort((a, b) => a - b);
  const n = closes.length;
  if (!n) return null;
  return n % 2 ? closes[(n - 1) / 2] : (closes[n / 2 - 1] + closes[n / 2]) / 2;
}

// ── Intraday despike filter ──────────────────────────────────────────────────────────────────────
// 2026-09-15: Yahoo Finance's intraday feed printed a bogus tick on FREIGHT/BZ=F — real price was a
// steady ~107.4-107.8, but two of the last three 5-min bars read ~102.5 (107.44, 107.46, 102.46,
// 107.57, 102.49), which showed up EVERYWHERE that reads `intraday` raw: the anomaly alert (fixed
// first), but also the WHEAT/CORN/SBM/FREIGHT tile price and the Daily chart's price line — Mete
// caught this because the tile kept showing 102.49 as "the price" when the real market was ~107.8.
// Fixing this once, here, instead of in each of the three call sites: a centered 5-bar median for
// every interior bar (a real move is confirmed by neighbors on both sides; a lone bad tick isn't),
// and a trailing 5-bar median for the newest bar (it has no future neighbor yet to confirm it, so
// lean on the last few bars rather than trust one fresh tick outright — verified against the exact
// data above: 3 real vs. 2 glitched bars still resolves to ~107.44). `cleanIntraday()` is the single
// place every consumer should read the intraday series through from now on.
const INTRADAY_DESPIKE_N = 5;
function cleanIntraday(bars){
  if (!Array.isArray(bars) || bars.length < 3) return Array.isArray(bars) ? bars : [];
  const half = Math.floor(INTRADAY_DESPIKE_N / 2);
  return bars.map((b, i) => {
    if (i === bars.length - 1){
      const win = bars.slice(Math.max(0, i - INTRADAY_DESPIKE_N + 1), i + 1);
      const m = medianClose(win);
      return m == null ? b : { ...b, c: m };
    }
    const lo = Math.max(0, i - half), hi = Math.min(bars.length - 1, i + half);
    const m = medianClose(bars.slice(lo, hi + 1));
    return m == null ? b : { ...b, c: m };
  });
}

function computePriceAnomalies(){
  const out = [];
  const now = Date.now();
  for (const product of PRICE_PRODUCTS){
    const rec = newsPrices[product];
    const intraday = rec && Array.isArray(rec.intraday) ? cleanIntraday(rec.intraday) : [];
    if (intraday.length < 2) continue;
    const last = intraday[intraday.length - 1];
    if (now - last.t > NEWS_ANOMALY_STALE_MS) continue;
    let base = null;
    for (let i = intraday.length - 1; i >= 0; i--){
      if (intraday[i].t <= last.t - NEWS_ANOMALY_WINDOW_MS){ base = intraday[i]; break; }
    }
    if (!base || !base.c) continue;
    const pct = (last.c - base.c) / base.c * 100;
    if (Math.abs(pct) < NEWS_ANOMALY_PCT) continue;
    const since = last.t - NEWS_ANOMALY_NEWS_WINDOW_MS;
    const relevant = newsForProduct(product).filter(s => newsQualifies(s) && s.ms >= since && s.ms <= last.t);
    const net = relevant.reduce((a, s) => a + newsSigned(s), 0);
    const explained = pct > 0 ? net >= NEWS_ANOMALY_EXPLAIN_NET : net <= -NEWS_ANOMALY_EXPLAIN_NET;
    if (explained) continue;
    out.push({ product, pct, windowMin: Math.round(NEWS_ANOMALY_WINDOW_MS / 60000), net, ms: last.t });
  }
  return out;
}

function renderNewsAnomalyBanner(){
  const anomalies = computePriceAnomalies();
  newsMaybeAlertAnomalies(anomalies);
  if (!anomalies.length) return null;
  const bar = document.createElement('div');
  bar.className = 'news-anomaly-bar';
  bar.innerHTML = anomalies.map(a => {
    const dirTxt = a.pct > 0 ? `+${a.pct.toFixed(1)}%` : `${a.pct.toFixed(1)}%`;
    const netTxt = a.net > 0 ? `+${a.net}` : `${a.net}`;
    return `<div class="news-anomaly-row">⚠️ <b>${a.product}</b> moved ${dirTxt} in ${a.windowMin} min with no ` +
           `qualifying news explaining it (net ${netTxt}) — check an outside source.</div>`;
  }).join('');
  return bar;
}

// Ding/notify once per newly-detected anomaly, reusing the same 🔔 Alerts on/off state as
// breaking-news alerts (Mete's own design: one delivery path, not a second toggle).
let newsAnomalyAlerted = new Set();
function newsMaybeAlertAnomalies(anomalies){
  let on = false;
  try{ on = localStorage.getItem('cte_news_alerts') === '1' && Notification.permission === 'granted'; }catch(e){}
  for (const a of anomalies){
    const key = `${a.product}_${Math.floor(a.ms / NEWS_ANOMALY_WINDOW_MS)}`;
    if (newsAnomalyAlerted.has(key)) continue;
    newsAnomalyAlerted.add(key);
    if (!on) continue;
    newsPlayDing();
    try{
      const n = new Notification(`⚠️ ${a.product} ${a.pct > 0 ? '▲' : '▼'} ${Math.abs(a.pct).toFixed(1)}% — no explaining news`, {
        body: `Price moved in the last ${a.windowMin} min but no qualifying news explains it.`,
        tag: `anomaly_${a.product}`,
      });
      n.onclick = () => { window.focus(); };
    }catch(e){ /* the ding above already played */ }
  }
  if (newsAnomalyAlerted.size > 200) newsAnomalyAlerted = new Set(Array.from(newsAnomalyAlerted).slice(-100));
}

// ── Morning report card (VN 07:00 daily summary, README item 15) ────────────────────────────────
// collector.py's maybe_send_morning_report() writes news_meta/morning_report once a day around VN
// 07:00: overnight qualifying-news net impact + futures % change per product, plus the top overnight
// headlines. Shown as a dismissible card (per-date dismiss, so it comes back tomorrow) at the top of
// the News tab while it's still today's report.
let newsMorningReport = null;
function subscribeMorningReport(){
  onSnapshot(doc(db, 'news_meta', 'morning_report'), (snap) => {
    newsMorningReport = snap.exists() ? snap.data() : null;
    renderNewsBody();
  }, () => {});
}
function morningReportDismissed(dateVN){
  try{ return localStorage.getItem('cte_morning_dismissed') === dateVN; }catch(e){ return false; }
}
function renderMorningReportCard(){
  const r = newsMorningReport;
  if (!r || !r.dateVN || morningReportDismissed(r.dateVN)) return null;
  if (Date.now() - (r.generatedMs || 0) > 20 * 3600 * 1000) return null;   // yesterday's — let it go
  const card = document.createElement('div');
  card.className = 'news-morning-card';
  const rows = PRODUCTS_MORNING.map(p => {
    const pr = (r.products || {})[p] || {};
    const net = pr.n ? newsFmtSigned(pr.net) : '—';
    const netCls = pr.n ? (pr.net > 0 ? 'pos' : pr.net < 0 ? 'neg' : '') : '';
    const pct = pr.pricePct;
    const pctTxt = pct == null ? '' : ` · ${pct > 0 ? '+' : ''}${pct.toFixed(1)}% price`;
    return `<div class="news-morning-row"><span class="news-morning-prod">${p}</span>` +
           `<span class="news-morning-net ${netCls}">${net}</span>` +
           `<span class="news-morning-sub">${pr.n ? `${pr.bull}▲ ${pr.bear}▼ · ${pr.n} ev` : 'no qualifying event'}${pctTxt}</span></div>`;
  }).join('');
  const top = (r.top || []).slice(0, 4).map(t =>
    `<a class="news-morning-top-item" href="${t.url || '#'}" target="_blank" rel="noopener">` +
    `${t.breaking ? '🔴 ' : ''}${t.product} ${t.direction === 'BULLISH' ? '▲' : t.direction === 'BEARISH' ? '▼' : '•'} ${t.impact} · ${t.headline}</a>`
  ).join('');
  card.innerHTML = `<div class="news-morning-head"><span>☀️ Morning Report · ${r.dateVN} (VN)</span>` +
    `<button class="hbtn news-morning-close" title="Dismiss until tomorrow">✕</button></div>` +
    `<div class="news-morning-grid">${rows}</div>` +
    (top ? `<div class="news-morning-top">${top}</div>` : '');
  card.querySelector('.news-morning-close').addEventListener('click', () => {
    try{ localStorage.setItem('cte_morning_dismissed', r.dateVN); }catch(e){}
    renderNewsBody();
  });
  return card;
}
const PRODUCTS_MORNING = ['WHEAT', 'CORN', 'SBM', 'FREIGHT', 'MACRO'];

// Compact reading for the History snapshot: one number per product + the day's top events.
function buildNewsSnapshot(){
  const out = { asOf: Date.now(), tz: NEWS_TZ, products: {}, top: [] };
  for (const p of NEWS_PRODUCTS.filter(p => p !== 'ALL')){
    const { now } = newsSeries(p);
    out.products[p] = { net: now.net, bull: now.bull, bear: now.bear, n: now.n, balance: now.balance };
  }
  const dayAgo = Date.now() - NEWS_WINDOW_MS;
  out.top = newsDocs.filter(s => s.ms >= dayAgo).sort((a, b) => b.impact - a.impact).slice(0, 5)
    .map(s => ({ headline: s.headline, direction: s.direction, impact: s.impact, product: s.product, trend: s.trend || 1, breaking: !!s.breaking }));
  return out;
}

function newsFmt(ms, opts){
  return new Intl.DateTimeFormat('en-GB', { timeZone: NEWS_TZ, ...opts }).format(new Date(ms));
}
function newsFmtTime(ms){
  return newsFmt(ms, { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).replace(',', '');
}
function newsFmtSigned(v){ const r = Math.round(v); return (r > 0 ? '+' : '') + r.toLocaleString('en-US'); }
// Futures/CFD-style price formatting for the merged chart's right-hand axis and hover tooltip
// (2026-09-14) — 2 decimals regardless of magnitude keeps WHEAT (~600) and SBM (~350) readable
// without a per-product format table.
function newsFmtPrice(v){

}

  '2026-07-03', '2026-09-07', '2026-11-26', '2026-12-25', '2027-01-01', '2027-01-18', '2027-02-15', '2027-03-26',

// Grains: Sun–Thu 19:00 → 07:45 CT (overnight), Mon–Fri 08:30 → 13:20 CT (day); 07:45–08:30 is the pause.
function cbotState(now = new Date()){
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(now);
  const get = t => parts.find(p => p.type === t)?.value;
  const wd = get('weekday'); const hh = parseInt(get('hour'), 10) % 24; const mm = parseInt(get('minute'), 10);
  const ymd = `${get('year')}-${get('month')}-${get('day')}`;
  const t = hh * 60 + mm;
  if (CBOT_HOLIDAYS.includes(ymd)) return { state: 'closed', label: 'CLOSED · holiday' };
  if (wd === 'Sat') return { state: 'closed', label: 'CLOSED · weekend' };
  if (wd === 'Sun') return t >= 19 * 60 ? { state: 'open', label: 'LIVE · overnight' } : { state: 'closed', label: 'CLOSED · opens 19:00 CT' };
  if (t < 7 * 60 + 45) return { state: 'open', label: 'LIVE · overnight' };
  if (t < 8 * 60 + 30) return { state: 'pause', label: 'PAUSE · reopens 08:30 CT' };
  if (t < 13 * 60 + 20) return { state: 'open', label: 'LIVE · day session' };
  if (wd === 'Fri') return { state: 'closed', label: 'CLOSED · weekend' };
  if (t < 19 * 60) return { state: 'closed', label: 'CLOSED · opens 19:00 CT' };
  return { state: 'open', label: 'LIVE · overnight' };
}

function etToUtcMs(dateStr, timeET){
  // New York offset: EDT (−4) second Sunday of March → first Sunday of November, else EST (−5).
  const [y, m, d] = dateStr.split('-').map(Number);
  const [hh, mi] = timeET.split(':').map(Number);
  const nthSunday = (year, month, n) => { const first = new Date(Date.UTC(year, month - 1, 1)); const off = (7 - first.getUTCDay()) % 7; return 1 + off + 7 * (n - 1); };
  const dstStart = Date.UTC(y, 2, nthSunday(y, 3, 2), 7);       // 02:00 EST = 07:00 UTC
  const dstEnd = Date.UTC(y, 10, nthSunday(y, 11, 1), 6);       // 02:00 EDT = 06:00 UTC
  const local = Date.UTC(y, m - 1, d, hh, mi);
  const isDst = local + 5 * 3600000 >= dstStart && local + 4 * 3600000 < dstEnd;
  return local + (isDst ? 4 : 5) * 3600000;
}
function upcomingEvents(n = 6){
  const now = Date.now();
  const out = [];
  for (const e of NEWS_FIXED_EVENTS){
    const ms = etToUtcMs(e.date, e.timeET);
    if (ms >= now - 3600000) out.push({ ...e, ms });
  }
  // next 21 days of weekly events
  const day0 = new Date(now); day0.setUTCHours(0, 0, 0, 0);
  for (let k = 0; k < 21; k++){
    const dt = new Date(day0.getTime() + k * 86400000);
    const dateStr = dt.toISOString().slice(0, 10);
    for (const w of NEWS_WEEKLY_EVENTS){
      if (dt.getUTCDay() !== w.weekday) continue;
      if (w.months && !w.months.includes(dt.getUTCMonth() + 1)) continue;
      const ms = etToUtcMs(dateStr, w.timeET);
      if (ms >= now - 3600000) out.push({ ...w, ms });
    }
  }
  // monthly approximations
  const monthly = [{ day: 10, timeET: '09:00', name: 'CONAB grain survey (~)', lane: 'REPORTS' }, { day: 22, timeET: '10:00', name: 'IGC Grain Market Report (~)', lane: 'REPORTS' }];
  for (let k = 0; k < 2; k++){
    const dt = new Date(Date.UTC(day0.getUTCFullYear(), day0.getUTCMonth() + k, 1));
    for (const m of monthly){
      const dateStr = `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, '0')}-${String(m.day).padStart(2, '0')}`;
      const ms = etToUtcMs(dateStr, m.timeET);
      if (ms >= now - 3600000) out.push({ ...m, ms });
    }
  }
  return out.sort((a, b) => a.ms - b.ms).slice(0, n);
}
function renderNewsEvents(){
  const box = document.createElement('div');
  box.className = 'news-events';
  const head = document.createElement('div');
  head.className = 'news-box-head';
  head.innerHTML = '<span class="news-box-title">Upcoming releases</span><span class="news-box-sub">Vietnam time · (~) approximate</span>';
  box.appendChild(head);
  const list = document.createElement('div');
  list.className = 'news-events-list';
  for (const e of upcomingEvents(6)){
    const hrs = (e.ms - Date.now()) / 3600000;
    const rel = hrs < 1 ? 'now' : hrs < 24 ? `in ${Math.round(hrs)} h` : `in ${Math.round(hrs / 24)} d`;
    const row = document.createElement('div');
    row.className = 'news-event' + (hrs < 24 ? ' soon' : '');
    row.innerHTML = `<span class="news-event-when">${newsFmt(e.ms, { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).replace(',', '')}</span>` +
      `<span class="news-event-name">${e.name}</span><span class="news-event-rel">${rel}</span>`;
    list.appendChild(row);

}

// ── SVG line chart (no library: keeps the app a single file) ────────────────
// Merged net-impact + price chart (2026-09-14, Mete's request): draws the trailing-24h net-impact
// line (left axis) and the real daily-close price line (right axis, when price data exists for
// this product) on ONE chart instead of two separate boxes. `xMin`/`xMax` are the selected range
// window's boundaries in ms — driven by the range chip, not by however much data happens to exist —
// so "5Y" always spans 5 real years on screen even if net-impact events are sparse in it. Returns
// `{ html, meta }`: meta carries just enough of the pixel<->time mapping for the caller to build a
// mouse-hover tooltip without re-deriving it (see renderNewsChart) — no closures survive an
// innerHTML string, so the scale has to be handed back explicitly instead.
function newsChartSvg(pts, priceBars, xMin, xMax, width, height){
  const hasPrice = Array.isArray(priceBars) && priceBars.length >= 2;
  const padL = 44, padR = hasPrice ? 50 : 12, padT = 10, padB = 24;
  const w = width - padL - padR, h = height - padT - padB;
  if (pts.length < 2 && !hasPrice){
    return { html: `<div class="note">Not enough qualifying events yet to draw the net-impact line (needs impact ≥ ${NEWS_MIN_IMPACT} and confidence ≥ ${NEWS_MIN_CONF}).</div>`, meta: null };
  }
  let yMin = Math.min(0, ...pts.map(p => p.net)), yMax = Math.max(0, ...pts.map(p => p.net));
  if (!pts.length){ yMin = -50; yMax = 50; }
  if (yMax === yMin){ yMax += 50; yMin -= 50; }
  const span = yMax - yMin; yMax += span * 0.1; yMin -= span * 0.1;
  const X = ms => padL + (xMax === xMin ? w / 2 : (ms - xMin) / (xMax - xMin) * w);
  const Y = v => padT + (yMax - v) / (yMax - yMin) * h;

  // Right-hand price axis: the actual min/max close in the shown window, explicitly labeled (not
  // evenly-spaced step ticks like the left axis) — e.g. picking WHEAT + 5Y should show the true
  // lowest and highest prices over that window, per Mete's ask.
  let priceMin = null, priceMax = null, pPadTop = null, pPadBot = null, Yp = null;
  if (hasPrice){
    const closes = priceBars.map(b => b.c);
    priceMin = Math.min(...closes); priceMax = Math.max(...closes);
    if (priceMax === priceMin){ priceMax += 1; priceMin -= 1; }
    const pspan = priceMax - priceMin;
    pPadTop = priceMax + pspan * 0.08; pPadBot = priceMin - pspan * 0.08;
    Yp = v => padT + (pPadTop - v) / (pPadTop - pPadBot) * h;
  }

  const ticks = [];
  if (pts.length){
    const step = niceStep((yMax - yMin) / 4);
    for (let v = Math.ceil(yMin / step) * step; v <= yMax; v += step){
      ticks.push(`<text x="${padL - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end" class="news-axis">${newsFmtSigned(v)}</text>` +
                 `<line x1="${padL}" x2="${padL + w}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="news-grid"/>`);
    }
  }
  const xt = [];
  const nX = Math.max(2, Math.min(5, Math.floor(w / 110)));
  for (let i = 0; i < nX; i++){
    const ms = xMin + (xMax - xMin) * i / (nX - 1);
    const anchor = i === 0 ? 'start' : i === nX - 1 ? 'end' : 'middle';
    xt.push(`<text x="${X(ms).toFixed(1)}" y="${height - 6}" text-anchor="${anchor}" class="news-axis">${newsFmtTime(ms)}</text>`);
  }

  let netLine = '', netDot = '';
  if (pts.length >= 2){
    // Always one continuous path — newsSeries() supplies a real point at every moment the trailing
    // window's value actually changes, so there is never a gap to skip.
    const d = pts.map((p, i) => (i ? ' L' : 'M') + X(p.ms).toFixed(1) + ' ' + Y(p.net).toFixed(1)).join('');
    const last = pts[pts.length - 1];
    const lastColor = last.net > 0 ? 'var(--good)' : last.net < 0 ? 'var(--bad)' : 'var(--text-dim)';
    netLine = `<line x1="${padL}" x2="${padL + w}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" class="news-zero"/>` +
              `<path d="${d.trim()}" class="news-line"/>`;
    netDot = `<circle cx="${X(last.ms).toFixed(1)}" cy="${Y(last.net).toFixed(1)}" r="3.5" fill="${lastColor}"/>`;
  }

  let priceLine = '', priceDot = '', priceAxis = '';
  if (hasPrice){
    const dp = priceBars.map((b, i) => (i ? ' L' : 'M') + X(b.t).toFixed(1) + ' ' + Yp(b.c).toFixed(1)).join('');
    const lastP = priceBars[priceBars.length - 1];
    priceLine = `<path d="${dp.trim()}" class="news-price-line"/>`;
    priceDot = `<circle cx="${X(lastP.t).toFixed(1)}" cy="${Yp(lastP.c).toFixed(1)}" r="3.5" fill="var(--accent)"/>`;
    priceAxis = `<text x="${padL + w + 6}" y="${(Yp(priceMax) + 3.5).toFixed(1)}" class="news-axis news-price-axis">${newsFmtPrice(priceMax)}</text>` +
                `<text x="${padL + w + 6}" y="${(Yp(priceMin) + 3.5).toFixed(1)}" class="news-axis news-price-axis">${newsFmtPrice(priceMin)}</text>`;
  }

  const html = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none" class="news-svg" role="img" aria-label="Smoothed net impact${hasPrice ? ' and price' : ''}">
    ${ticks.join('')}
    ${netLine}
    ${priceLine}
    ${netDot}
    ${priceDot}
    ${priceAxis}
    ${xt.join('')}
  </svg>`;
  return { html, meta: { padL, w, padT, h, xMin, xMax, width, height, hasPrice } };
}
function niceStep(raw){
  if (raw <= 0) return 50;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
}

// Latest price + day-change% for a product's tile header (2026-09-14, Mete's request — "TradingView
// widget'taki gibi" a live price right in the small box). Computed entirely from the same
// Firestore prices/{product} data the merged chart already holds in `newsPrices` — no extra network
// call. Prefers the intraday series (freshest, refreshed every collector run) and falls back to the
// daily series if intraday hasn't synced yet; returns null (tile just omits the price) if neither has.
function newsLatestPrice(product){
  const rec = newsPrices[product];
  if (!rec) return null;
  const intraday = Array.isArray(rec.intraday) ? cleanIntraday(rec.intraday) : [];
  const daily = Array.isArray(rec.bars) ? rec.bars : [];
  const live = intraday.length ? intraday[intraday.length - 1] : (daily.length ? daily[daily.length - 1] : null);
  if (!live) return null;
  // Day-over-day % vs the most recent daily close from BEFORE the live bar's own calendar day
  // (UTC date compare — precise enough for a ticker-style % figure, no exchange-session math needed).
  const liveDay = new Date(live.t).toISOString().slice(0, 10);
  let prevClose = null;
  for (let i = daily.length - 1; i >= 0; i--){
    if (new Date(daily[i].t).toISOString().slice(0, 10) < liveDay){ prevClose = daily[i].c; break; }
  }
  const pct = prevClose ? (live.c - prevClose) / prevClose * 100 : null;
  return { price: live.c, pct };
}

      : '';
    tile.innerHTML = `<div class="news-tile-head"><span class="news-tile-name">${p}</span>${priceHtml}</div>` +

    tile.title = `${count} qualifying ${p} events in the last ${NEWS_HISTORY_DAYS} days — click to chart`;

// Range chips shared by the net-impact chart and the TradingView price widget below it, so both
// can be visually correlated over the same window instead of the price widget being stuck on "today".
function renderNewsRangeBar(){
  const bar = document.createElement('div');
  bar.className = 'news-bar news-range-bar';
  for (const r of NEWS_CHART_RANGES){
    const chip = document.createElement('span');
    chip.className = 'month-chip' + (newsUI.chartRange === r.key ? ' on' : '');
    chip.textContent = r.label;
