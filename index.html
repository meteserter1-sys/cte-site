function excelSerialToISODate(v){
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  if (typeof v === 'number'){
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return d.toISOString().slice(0, 10);
  }
  const m = String(v).match(/(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : null;
}

function vnSupplyFindHeaderRow(rows, requiredSubstrings, maxScan){
  maxScan = maxScan || rows.length;
  for (let i = 0; i < Math.min(rows.length, maxScan); i++){
    const row = (rows[i] || []).map(v => String(v || '').trim().toLowerCase());
    if (requiredSubstrings.every(h => row.some(cell => cell.includes(h)))) return i;
  }
  return -1;
}

// Reads the raw Dashboard / Arr Data / Lineup SUM sheets (NOT the Excel "Overview" sheet, which is
// just a single interactive snapshot) and re-aggregates everything client-side, mirroring the
// Overview sheet's own formulas exactly: Arrived = NOR date <= "as of"; the cutoff month's average
// baseline gets Lineup SUM + Arr Data's own not-yet-arrived rows layered on top; origin/buyer are
// broken out per cargo and split North/South so the Region toggle works everywhere.
function parseVnSupplyWorkbook(wb){
  const wsDash = wb.Sheets['Dashboard'];
  if (!wsDash) throw new Error('This file has no "Dashboard" sheet.');
  const dashRows = XLSX.utils.sheet_to_json(wsDash, { header: 1, raw: true, defval: '' });
  let asOf = null;
  outer:
  for (let r = 0; r < Math.min(dashRows.length, 10); r++){
    const row = dashRows[r] || [];
    for (let c = 0; c < row.length; c++){
      if (/arrival reports as of/i.test(String(row[c] || ''))){ asOf = excelSerialToISODate(row[c + 1]); break outer; }
    }
  }
  if (!asOf) throw new Error('Could not find "Arrival reports as of" on the Dashboard sheet.');
  const cutoffMonth = asOf.slice(0, 7);
  const reportYear = parseInt(asOf.slice(0, 4), 10);
  const months = Array.from({ length: 12 }, (_, i) => `${reportYear}-${String(i + 1).padStart(2, '0')}`);

  const wsAD = wb.Sheets['Arr Data'];
  if (!wsAD) throw new Error('This file has no "Arr Data" sheet.');
  const adRows = XLSX.utils.sheet_to_json(wsAD, { header: 1, raw: true, defval: '' });
  const adHeader = (adRows[0] || []).map(v => String(v || ''));
  const exact = (name) => adHeader.findIndex(v => v.trim().toLowerCase() === name);
  const col = {
    region: exact('region'), month: exact('month'), date: exact('date'),
    cargo: exact('cargo'), origin: exact('origin'), buyer: exact('buyer'),
    volume: adHeader.findIndex(v => /volume/i.test(v)),
    syes: adHeader.findIndex(v => /scheduled/i.test(v) && /on the way/i.test(v)),
    tbal: adHeader.findIndex(v => /on-the-way balance/i.test(v)),
  };
  const need = ['region', 'month', 'date', 'cargo', 'origin', 'buyer', 'volume', 'syes', 'tbal'];
  const missing = need.filter(k => col[k] < 0);
  if (missing.length) throw new Error(`Could not find these Arr Data columns: ${missing.join(', ')}.`);

  const cargoMatrix = {}, originMap = {}, buyerMap = {}, sepBoost = {};
  // 2026-10-02: on-the-way per month for ALL months (not just the cutoff month) — see vnSupplyOnTheWaySeries().
  const otwArr = {};   // cargo -> { north:[12], south:[12] }  (Arr Data rows dated after "as of")
  const otwLineup = {}; // cargo -> [12]                        (Lineup SUM, no Region)
  const cargoNamesSeen = new Set();

  for (let r = 1; r < adRows.length; r++){
    const row = adRows[r]; if (!row || !row.length) continue;
    const dateIso = excelSerialToISODate(row[col.date]);
    if (!dateIso) continue;
    const region = String(row[col.region] || '').trim();
    const monthTxt = String(row[col.month] || '').trim();
    const cargo = String(row[col.cargo] || '').trim();
    const origin = String(row[col.origin] || '').trim();
    const buyer = String(row[col.buyer] || '').trim();
    const vol = Number(row[col.volume]) || 0;
    if (!cargo) continue;
    cargoNamesSeen.add(cargo);
    const rk = region === 'North' ? 'north' : 'south';

    if (dateIso <= asOf){
      const mi = months.indexOf(monthTxt);
      if (mi < 0) continue;
      if (!cargoMatrix[cargo]) cargoMatrix[cargo] = { north: Array(12).fill(0), south: Array(12).fill(0) };
      cargoMatrix[cargo][rk][mi] += vol;
      if (origin){
        const ok = cargo + '|' + origin;
        if (!originMap[ok]) originMap[ok] = { cargo, origin, north: Array(12).fill(0), south: Array(12).fill(0) };
        originMap[ok][rk][mi] += vol;
      }
      if (buyer){
        const bk = cargo + '|' + buyer;
        if (!buyerMap[bk]) buyerMap[bk] = { cargo, buyer, north: Array(12).fill(0), south: Array(12).fill(0) };
        buyerMap[bk][rk][mi] += vol;
      }
    } else {
      const isYes = String(row[col.syes] || '').trim().toLowerCase() === 'yes';
      const tbalVal = Number(row[col.tbal]) || 0;
      const mi = months.indexOf(monthTxt);
      if (mi >= 0){
        if (!otwArr[cargo]) otwArr[cargo] = { north: Array(12).fill(0), south: Array(12).fill(0) };
        otwArr[cargo][rk][mi] += (isYes ? vol : 0) + tbalVal;
      }
      if (monthTxt === cutoffMonth){
        if (!sepBoost[cargo]) sepBoost[cargo] = { syesNorth: 0, syesSouth: 0, tbalNorth: 0, tbalSouth: 0 };
        if (isYes) sepBoost[cargo][rk === 'north' ? 'syesNorth' : 'syesSouth'] += vol;
        sepBoost[cargo][rk === 'north' ? 'tbalNorth' : 'tbalSouth'] += tbalVal;
      }
    }
  }

  const sepLineup = {};
  const wsLS = wb.Sheets['Lineup SUM'];
  if (wsLS){
    const lsRows = XLSX.utils.sheet_to_json(wsLS, { header: 1, raw: true, defval: '' });
    const hdrIdx = vnSupplyFindHeaderRow(lsRows, ['cargo', 'tons', 'on-the-way period']);
    if (hdrIdx >= 0){
      const hdr = lsRows[hdrIdx].map(v => String(v || ''));
      const lc = {
        cargo: hdr.findIndex(v => v.trim().toLowerCase() === 'cargo'),
        tons: hdr.findIndex(v => v.trim().toLowerCase() === 'tons'),
        period: hdr.findIndex(v => v.trim().toLowerCase().includes('on-the-way period')),
      };
      if (lc.cargo >= 0 && lc.tons >= 0 && lc.period >= 0){
        for (let r = hdrIdx + 1; r < lsRows.length; r++){
          const row = lsRows[r]; if (!row || !row.length) continue;
          const cargo = String(row[lc.cargo] || '').trim();
          if (!cargo) continue;
          const periodIso = excelSerialToISODate(row[lc.period]);
          if (!periodIso) continue;
          const tons = Number(row[lc.tons]) || 0;
          if (periodIso.slice(0, 7) === cutoffMonth) sepLineup[cargo] = (sepLineup[cargo] || 0) + tons;
          const pmi = months.indexOf(periodIso.slice(0, 7));
          if (pmi >= 0){
            if (!otwLineup[cargo]) otwLineup[cargo] = Array(12).fill(0);
            otwLineup[cargo][pmi] += tons;
            cargoNamesSeen.add(cargo);
          }
        }
      }
    }
  }

  const preferredOrder = ['Corn', 'Wheat', 'SBM', 'Soybean', 'Canola Meal', 'PKE', 'Barley', 'DDGS', 'Sunflower Meal'];
  const allCargoNames = Array.from(cargoNamesSeen);
  const orderedNames = preferredOrder.filter(n => allCargoNames.includes(n))
    .concat(allCargoNames.filter(n => !preferredOrder.includes(n)).sort());

  const round1 = n => Math.round((n || 0) * 10) / 10;
  const cargoes = orderedNames.map(name => {
    const m = cargoMatrix[name] || { north: Array(12).fill(0), south: Array(12).fill(0) };
    const b = sepBoost[name] || { syesNorth: 0, syesSouth: 0, tbalNorth: 0, tbalSouth: 0 };
    return {
      name,
      arrivedNorth: m.north.map(round1), arrivedSouth: m.south.map(round1),
      sepLineup: round1(sepLineup[name] || 0),
      sepSyesNorth: round1(b.syesNorth), sepSyesSouth: round1(b.syesSouth),
      sepTbalNorth: round1(b.tbalNorth), sepTbalSouth: round1(b.tbalSouth),
      otwLineup: (otwLineup[name] || Array(12).fill(0)).map(round1),
      otwNorth: (otwArr[name] ? otwArr[name].north : Array(12).fill(0)).map(round1),
      otwSouth: (otwArr[name] ? otwArr[name].south : Array(12).fill(0)).map(round1),
    };
  });
  if (!cargoes.length) throw new Error('No cargo rows found in Arr Data.');

  const origins = Object.values(originMap).filter(o => o.north.some(v => v > 0) || o.south.some(v => v > 0))
    .map(o => ({ cargo: o.cargo, origin: o.origin, north: o.north.map(round1), south: o.south.map(round1) }));
  const buyers = Object.values(buyerMap).filter(b => b.north.some(v => v > 0) || b.south.some(v => v > 0))
    .map(b => ({ cargo: b.cargo, buyer: b.buyer, north: b.north.map(round1), south: b.south.map(round1) }));

  return { asOf, months, cargoes, origins, buyers };
}

function handleVnSupplyImport(e, statusEl){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const parsed = parseVnSupplyWorkbook(wb);
      const cargoNames = parsed.cargoes.map(c => c.name).join(', ');
      if (!confirm(`Import ${parsed.cargoes.length} cargo rows (${cargoNames}) as of ${parsed.asOf}? This replaces the current VN Supply numbers.`)) return;
      state.vnSupply = parsed;
      vnSupplyUI.month = null;
      scheduleSave();
      renderVnSupplyTab();
      if (statusEl){ statusEl.textContent = `Imported — as of ${parsed.asOf}`; statusEl.style.color = 'var(--good)'; }
    }catch(err){
      console.error('VN Supply import failed', err);
      alert('Could not read this file: ' + err.message);
      if (statusEl){ statusEl.textContent = 'Import failed'; statusEl.style.color = 'var(--bad)'; }
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

      ensureDestinations();

      btn.classList.add('flash');

});

// --- Excel (.xlsx) export / import ---
// Generic: walks the whole state tree, one row per leaf field, path like "fob.WHEAT" or "malaysia.freight.5M2C".
function flattenStateForExcel(obj, prefix, rows){
  Object.keys(obj).forEach(key => {
    const val = obj[key];
    const path = prefix ? prefix + '.' + key : key;
    if (val === null || val === undefined) return;
    if (Array.isArray(val)){
      rows.push([path, ...val.map(v => (v === null || v === undefined) ? '' : v)]);
    } else if (typeof val === 'object'){
      flattenStateForExcel(val, path, rows);
    } else {
      rows.push([path, val]);
    }
  });
}

function exportStateToExcel(){
  if (typeof XLSX === 'undefined'){
    alert('Excel library did not load. Check your internet connection and try again.');
    return;
  }
  const rows = [['Field', 'V1','V2','V3','V4','V5','V6','V7','V8','V9','V10','V11','V12']];
  flattenStateForExcel(state, '', rows);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 32 }, ...Array(12).fill({ wch: 10 })];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'CTE Data');
  const stamp = new Date().toISOString().slice(0,10);

  const btn = document.getElementById('excelExportBtn');

// Writes a flattened "a.b.c" path + values back into a nested object, creating
// intermediate objects as needed. A single value writes a scalar; multiple
// values write a numeric array (blank cells become null).
function setStatePath(obj, path, values){
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++){
    const p = parts[i];
    if (typeof cur[p] !== 'object' || cur[p] === null) cur[p] = {};
    cur = cur[p];
  }
  const last = parts[parts.length - 1];
  const toNum = v => {
    if (v === '' || v === undefined || v === null) return null;
    const n = parseFloat(v);
    return isNaN(n) ? v : n;
  };
  if (values.length <= 1){
    cur[last] = toNum(values[0]);
  } else {
    cur[last] = values.map(toNum);
  }
}

function handleExcelImport(e){
  const file = e.target.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined'){
    alert('Excel library did not load. Check your internet connection and try again.');
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      if (!rows || rows.length < 2){
        alert('This Excel file does not look like a valid CTE data export.');
        return;
      }
      if (!confirm('This will overwrite matching fields in the current data with values from this Excel file. Continue?')) return;
      for (let i = 1; i < rows.length; i++){
        const row = rows[i];
        if (!row || !row[0]) continue;
        const path = String(row[0]).trim();
        const values = row.slice(1);
        setStatePath(state, path, values);
      }
      if (!state.visibleMonths || !state.visibleMonths.length) state.visibleMonths = defaultVisibleMonths();
      ensureDestinations();
      scheduleSave();
      renderAll();
      const btn = document.getElementById('excelImportBtn');
      const original = btn.innerHTML;
      btn.textContent = 'Imported ✓';
      btn.classList.add('flash');
      setTimeout(() => { btn.innerHTML = original; btn.classList.remove('flash'); }, 1500);
    }catch(err){
      console.error(err);
      alert('Could not read this Excel file. Make sure it is an .xlsx export from this app.');
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function newsSigned(s){ return s.direction === 'BULLISH' ? s.impact : s.direction === 'BEARISH' ? -s.impact : 0; }
function newsQualifies(s){ return s.impact >= NEWS_MIN_IMPACT && s.confidence >= NEWS_MIN_CONF; }

// ── Impact decay model (shared by the tile/header number AND the chart line) ───────────────────
// 2026-09-16, Mete: the old hard 24h cutoff kept every qualifying headline at full strength right up
// until the instant it turned exactly 24h old, then it vanished from the sum entirely. Concretely:
// the FREIGHT tile sat at +655 with a 20-hour-old headline still counted at 100% weight — reading
// that number, a trader can't tell "something is happening right now" from "an old headline just
// hasn't aged out yet", which is backwards from how the market actually works (a report's price
// reaction happens mostly in its first hour or so; by the time it's most of a day old the market has
// already priced it in). Also, the tile/header and the chart LINE used to run two different models
// (hard 24h sum vs. a 12h-half-life exponential decay) for what's supposed to be the same number —
// its own source of confusion, which Mete flagged directly. Both now share this one model, Mete's
// own proposal: full weight for the first hour (headline is fresh, market hasn't digested it yet),
// then a straight-line ramp DOWN OF THE ORIGINAL VALUE (not of the remaining value — that's what
// makes it actually reach zero, unlike the old exponential decay's long tail that technically never
// hit zero) to zero by NEWS_DECAY_ZERO_H hours old. A 60-point headline: 60 at hour 1, 54 at hour 2,
// 48 at hour 3, ... 6 at hour 10, 0 at hour 11 — confirmed with Mete before implementing. Nothing
// else in the file reads a hard 24h impact window anymore; NEWS_WINDOW_MS survives only for the
// unrelated "top headlines of the day" list in buildNewsSnapshot() below.
const NEWS_DECAY_PLATEAU_MS = 1 * 3600 * 1000;                    // full weight for the first hour
const NEWS_DECAY_ZERO_H = 11;                                     // fully zero (and out of the lookback) by this many hours old
const NEWS_DECAY_RAMP_MS = (NEWS_DECAY_ZERO_H - 1) * 3600 * 1000; // the straight-line part spans this long, right after the plateau
const NEWS_DECAY_LOOKBACK_MS = NEWS_DECAY_ZERO_H * 3600 * 1000;   // nothing older than this contributes at all

function newsDecayWeight(ageMs){
  if (ageMs <= NEWS_DECAY_PLATEAU_MS) return 1;
  const t = (ageMs - NEWS_DECAY_PLATEAU_MS) / NEWS_DECAY_RAMP_MS;
  return t >= 1 ? 0 : 1 - t;
}

// Decay-weighted reading as of `endMs` over an ascending-sorted array of qualifying stories — powers
// both the summary tiles and the chart header (see NEWS_DECAY_* above). `n`/`bull`/`bear`/`neu` are
// raw counts of headlines still inside the lookback window (unweighted — "how many stories, what
// split" stays an exact, traceable figure); `net`/`abs`/`balance` are decay-weighted.
function newsWindowStats(asc, endMs){
  const startMs = endMs - NEWS_DECAY_LOOKBACK_MS;
  let net = 0, abs = 0, n = 0, bull = 0, bear = 0, neu = 0;
  for (const s of asc){
    if (s.ms > endMs) break;
    if (s.ms <= startMs) continue;
    const wgt = newsDecayWeight(endMs - s.ms);
    if (wgt <= 0) continue;
    n++; net += newsSigned(s) * wgt; abs += s.impact * wgt;
    if (s.direction === 'BULLISH') bull++; else if (s.direction === 'BEARISH') bear++; else neu++;
  }
  return { ms: endMs, net, n, bull, bear, neu, balance: abs ? Math.round(1000 * net / abs) / 10 : 0 };
}

// "Now" reading for the tile/chart header, plus the qualifying-story count over the product's whole
// kept history (used for the tile's hover tooltip, not for the decay window itself).
function newsSeries(product){
  const asc = newsForProduct(product).filter(newsQualifies).slice().sort((a, b) => a.ms - b.ms);
  const now = newsWindowStats(asc, Date.now());
  return { now, count: asc.length };
}

function newsSmoothStep(spanMs){
  // Grid resolution scales with the visible span: fine enough to look continuous on a Daily chart,
  // coarse enough that a 5Y chart isn't computing millions of points.
  if (spanMs <= 2 * 24 * 3600 * 1000) return 15 * 60 * 1000;      // ≤2d   → 15 min
  if (spanMs <= 10 * 24 * 3600 * 1000) return 60 * 60 * 1000;     // ≤10d  → 1 hour
  if (spanMs <= 60 * 24 * 3600 * 1000) return 4 * 3600 * 1000;    // ≤60d  → 4 hours
  if (spanMs <= 400 * 24 * 3600 * 1000) return 24 * 3600 * 1000;  // ≤400d → 1 day
  return 3 * 24 * 3600 * 1000;                                    // longer → 3 days
}

// Chart line: the SAME decay model as the tile (NEWS_DECAY_* above), resampled on a regular time
// grid across the visible range so the line keeps moving between headlines instead of sitting flat.
function newsSmoothSeries(product, xMin, xMax){
  const asc = newsForProduct(product).filter(newsQualifies).slice().sort((a, b) => a.ms - b.ms);
  if (!asc.length) return [];
  const step = newsSmoothStep(xMax - xMin);
  const pts = [];
  let lo = 0; // stories before `lo` are more than the lookback behind every future grid point too
  let t = xMin;
  for (; t <= xMax; t += step){
    while (lo < asc.length && t - asc[lo].ms > NEWS_DECAY_LOOKBACK_MS) lo++;
    let net = 0;
    for (let i = lo; i < asc.length && asc[i].ms <= t; i++) net += newsSigned(asc[i]) * newsDecayWeight(t - asc[i].ms);
    pts.push({ ms: t, net });
  }
  // Always end exactly at xMax (usually "now") so the line's right edge lines up with the price
  // line's latest bar instead of stopping mid-step.
  if (!pts.length || pts[pts.length - 1].ms < xMax){
    while (lo < asc.length && xMax - asc[lo].ms > NEWS_DECAY_LOOKBACK_MS) lo++;
    let net = 0;
    for (let i = lo; i < asc.length && asc[i].ms <= xMax; i++) net += newsSigned(asc[i]) * newsDecayWeight(xMax - asc[i].ms);
    pts.push({ ms: xMax, net });
  }
  return pts;
}

// Per-headline dots for the chart (2026-09-23, Mete: "impact doğrusunda impactin oldu saat doğru da
// ufak nokta olarak belirsin. Bullish ise yesil nokta, bearish İse kırmızı nokta. Noktaya basinca
// haber açılsın. Link bagla.") — one marker per qualifying story whose own timestamp falls inside the
// visible [xMin, xMax] window, positioned at the net-impact LINE's own value at that exact moment
// (not the story's own impact score) so the dot sits exactly on the line, the same way newsSmoothSeries
// computes each grid point — just evaluated at the story's own ms instead of on a regular grid.
function newsMarkersFor(product, xMin, xMax){
  const asc = newsForProduct(product).filter(newsQualifies).slice().sort((a, b) => a.ms - b.ms);
  const out = [];
  let lo = 0;
  for (let i = 0; i < asc.length; i++){
    const s = asc[i];
    if (s.ms < xMin || s.ms > xMax) continue;
    while (lo < asc.length && s.ms - asc[lo].ms > NEWS_DECAY_LOOKBACK_MS) lo++;
    let net = 0;
    for (let k = lo; k <= i; k++) net += newsSigned(asc[k]) * newsDecayWeight(s.ms - asc[k].ms);
    out.push({ ms: s.ms, net, direction: s.direction, impact: s.impact, url: s.url, headline: s.headline });
  }
  return out;
}

// ── Price-anomaly alert ("flash haber" safety net, README item 14B) ─────────────────────────────
// 2026-09-15, Mete: "%1 artar veya azalırsa sistem alarm versin." No matter how far the collector's
// source list grows (items 12/13/14A), some flash headline will always slip through uncollected —
// this is the reactive half: the PAGE itself notices "price moved but no qualifying news explains
// it" and says so, instead of Mete having to spot the chart wiggle and go hunting on his phone (what
// actually happened on 14 Eylül). Computed entirely from data already in memory (intraday price bars
// + newsDocs) — no backend change, no extra network call.
const NEWS_ANOMALY_PCT = 1.0;                        // ± percent move that counts as "notable"
const NEWS_ANOMALY_WINDOW_MS = 15 * 60 * 1000;       // look back this far for the price move itself
const NEWS_ANOMALY_NEWS_WINDOW_MS = 60 * 60 * 1000;  // wider window checked for a qualifying explanation
const NEWS_ANOMALY_EXPLAIN_NET = 20;                 // minimum same-direction net impact that "explains" it
const NEWS_ANOMALY_STALE_MS = 30 * 60 * 1000;        // don't alarm on a price feed that stopped updating

function medianClose(bars){
  const closes = bars.map(b => b.c).filter(c => typeof c === 'number' && isFinite(c)).sort((a, b) => a - b);
  const n = closes.length;
  if (!n) return null;
  return n % 2 ? closes[(n - 1) / 2] : (closes[n / 2 - 1] + closes[n / 2]) / 2;
}

// ── Intraday despike + sanity filter ────────────────────────────────────────────────────────────
// 2026-09-15: Yahoo Finance's intraday feed printed bogus ticks on FREIGHT/BZ=F — real price was a
// steady ~107.4-107.8, but a run of 5-min bars read ~102.5. This showed up everywhere that reads
// `intraday` raw: the anomaly alert, the WHEAT/CORN/SBM/FREIGHT tile price, and the Daily chart's
// price line — Mete caught it because the tile and the chart's low point both kept showing ~102.5
// while the real market was ~107.7. `cleanIntraday()` is the one place every consumer should read
// the intraday series through, in two steps:
//  1) DESPIKE — a centered 5-bar median for every interior bar (a real move is confirmed by
//     neighbors on both sides, a lone bad tick isn't), trailing 5-bar median for the newest bar.
//     This alone only rejects a brief, MINORITY flicker (1-2 bad bars). It's not enough on its own:
//     the glitch above ran 6+ consecutive bars, which starts outvoting the median itself.
//  2) SANITY TRIM — drop bars off the TAIL, most-recent-first, while they're still implausibly far
//     (> INTRADAY_SANITY_PCT) from the last trusted DAILY close (a separate Yahoo request, refreshed
//     at most every 4h, and confirmed correct — 107.56 — while the intraday feed was stuck at
///    ~102.5-102.7). This only trims the currently-still-bad tail, leaving earlier real history
//     alone, and naturally recovers on its own once the intraday feed reports sane numbers again.
// Verified against the exact live data above: steps 1+2 together correctly drop all 6 bad trailing
// bars and leave the chart/tile pointing at the last good tick (107.38) instead of the glitch.
const INTRADAY_DESPIKE_N = 5;
const INTRADAY_SANITY_PCT = 3.0;
function cleanIntraday(bars, dailyBars){
  if (!Array.isArray(bars) || bars.length < 3) return Array.isArray(bars) ? bars.slice() : [];
  const half = Math.floor(INTRADAY_DESPIKE_N / 2);
  const despiked = bars.map((b, i) => {
    if (i === bars.length - 1){
      const win = bars.slice(Math.max(0, i - INTRADAY_DESPIKE_N + 1), i + 1);
      const m = medianClose(win);
      return m == null ? b : { ...b, c: m };
    }
    const lo = Math.max(0, i - half), hi = Math.min(bars.length - 1, i + half);
    const m = medianClose(bars.slice(lo, hi + 1));
    return m == null ? b : { ...b, c: m };
  });
  const lastDaily = Array.isArray(dailyBars) && dailyBars.length ? dailyBars[dailyBars.length - 1] : null;
  if (lastDaily && lastDaily.c){
    while (despiked.length &&
           Math.abs(despiked[despiked.length - 1].c - lastDaily.c) / lastDaily.c * 100 > INTRADAY_SANITY_PCT){
      despiked.pop();
    }
  }
  return despiked;
}

function computePriceAnomalies(){
  const out = [];
  const now = Date.now();
  for (const product of PRICE_PRODUCTS){
    const rec = newsPrices[product];
    const intraday = rec && Array.isArray(rec.intraday) ? cleanIntraday(rec.intraday, rec.bars) : [];
    if (intraday.length < 2) continue;
    const last = intraday[intraday.length - 1];
    if (now - last.t > NEWS_ANOMALY_STALE_MS) continue;
    let base = null;
    for (let i = intraday.length - 1; i >= 0; i--){
      if (intraday[i].t <= last.t - NEWS_ANOMALY_WINDOW_MS){ base = intraday[i]; break; }
    }
    if (!base || !base.c) continue;
    const pct = (last.c - base.c) / base.c * 100;
    if (Math.abs(pct) < NEWS_ANOMALY_PCT) continue;
    const since = last.t - NEWS_ANOMALY_NEWS_WINDOW_MS;
    const relevant = newsForProduct(product).filter(s => newsQualifies(s) && s.ms >= since && s.ms <= last.t);
    const net = relevant.reduce((a, s) => a + newsSigned(s), 0);
    const explained = pct > 0 ? net >= NEWS_ANOMALY_EXPLAIN_NET : net <= -NEWS_ANOMALY_EXPLAIN_NET;
    if (explained) continue;
    out.push({ product, pct, windowMin: Math.round(NEWS_ANOMALY_WINDOW_MS / 60000), net, ms: last.t });
  }
  return out;
}

function renderNewsAnomalyBanner(){
  const anomalies = computePriceAnomalies();
  newsMaybeAlertAnomalies(anomalies);
  if (!anomalies.length) return null;
  const bar = document.createElement('div');
  bar.className = 'news-anomaly-bar';
  bar.innerHTML = anomalies.map(a => {
    const dirTxt = a.pct > 0 ? `+${a.pct.toFixed(1)}%` : `${a.pct.toFixed(1)}%`;
    const netTxt = a.net > 0 ? `+${a.net}` : `${a.net}`;
    return `<div class="news-anomaly-row">⚠️ <b>${a.product}</b> moved ${dirTxt} in ${a.windowMin} min with no ` +
           `qualifying news explaining it (net ${netTxt}) — check an outside source.</div>`;
  }).join('');
  return bar;
}

// Ding/notify once per newly-detected anomaly, reusing the same 🔔 Alerts on/off state as
// breaking-news alerts (Mete's own design: one delivery path, not a second toggle).
let newsAnomalyAlerted = new Set();
function newsMaybeAlertAnomalies(anomalies){
  let on = false;
  try{ on = localStorage.getItem('cte_news_alerts') === '1' && Notification.permission === 'granted'; }catch(e){}
  for (const a of anomalies){
    const key = `${a.product}_${Math.floor(a.ms / NEWS_ANOMALY_WINDOW_MS)}`;
    if (newsAnomalyAlerted.has(key)) continue;
    newsAnomalyAlerted.add(key);
    newsLogAnomaly(a, key);
    if (!on) continue;
    newsPlayDing();
    try{
      const n = new Notification(`⚠️ ${a.product} ${a.pct > 0 ? '▲' : '▼'} ${Math.abs(a.pct).toFixed(1)}% — no explaining news`, {
        body: `Price moved in the last ${a.windowMin} min but no qualifying news explains it.`,
        tag: `anomaly_${a.product}`,
      });
      n.onclick = () => { window.focus(); };
    }catch(e){ /* the ding above already played */ }
  }
  if (newsAnomalyAlerted.size > 200) newsAnomalyAlerted = new Set(Array.from(newsAnomalyAlerted).slice(-100));
}

// 2026-09-15: persistent record of every anomaly banner that has ever fired — for the 3-month internal
// trial (mid-Sept 2026 → ~Jan 2027, Mete's decision point on whether CTE is worth taking further).
// He wants an impact-vs-price-change correlation report and a false-positive read on this alert at the
// end of it, which needs a durable log, not just the in-memory `newsAnomalyAlerted` Set above (that
// resets on every page reload). Reuses `news_feedback` — already writable by the page with no new
// Firestore rule/Publish step needed — and these docs carry no `vote` field, so the existing 👍/👎
// tally loop in subscribeNews() silently ignores them. Logged once per (product, 15-min bucket), same
// key/dedup as the banner itself, and regardless of whether desktop alerts are toggled on: this is a
// record for later analysis, not a notification, so it must not depend on the alert toggle.
function newsLogAnomaly(a, key){
  try{
    setDoc(doc(NEWS_FEEDBACK, `anomaly_${key}`), {
      type: 'anomaly_fired', product: a.product, pct: a.pct, net: a.net,
      windowMin: a.windowMin, ms: a.ms, loggedAt: Date.now()
    }).catch(() => {});
  }catch(e){ /* best-effort log; must never block the on-screen alert */ }
}

// 2026-09-22: FREIGHT dropped from the morning report's per-product rows — collector.py's PRODUCTS
// (which build_morning_report() loops over) no longer includes it, so r.products will never have a
// FREIGHT key going forward; matching that here instead of showing a permanent "no qualifying event"
// row for a product that's no longer scored. Brent price tracking itself is unaffected (see the main
// tile/chart, PRICE_PRODUCTS below) — this only trims the morning-report card.
const PRODUCTS_MORNING = ['WHEAT', 'CORN', 'SBM'];

// Compact reading for the History snapshot: one number per product + the day's top events.
function buildNewsSnapshot(){
  const out = { asOf: Date.now(), tz: NEWS_TZ, products: {}, top: [] };
  for (const p of NEWS_PRODUCTS.filter(p => p !== 'ALL')){
    const { now } = newsSeries(p);
    out.products[p] = { net: now.net, bull: now.bull, bear: now.bear, n: now.n, balance: now.balance };
  }
  const dayAgo = Date.now() - NEWS_WINDOW_MS;
  out.top = newsDocs.filter(s => s.ms >= dayAgo).sort((a, b) => b.impact - a.impact).slice(0, 5)
    .map(s => ({ headline: s.headline, direction: s.direction, impact: s.impact, product: s.product, trend: s.trend || 1, breaking: !!s.breaking }));
  return out;
}

// ── Time helpers (Vietnam clock everywhere on this page) ─────────────────────
function newsFmt(ms, opts){
  return new Intl.DateTimeFormat('en-GB', { timeZone: NEWS_TZ, ...opts }).format(new Date(ms));
}
function newsFmtTime(ms){
  return newsFmt(ms, { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).replace(',', '');
}
// 2026-10-02, Mete: impact is SHOWN on a 0-10 scale (55 -> 5.5, net +230 -> +23). Everything stored
// and computed stays 0-100 (Firestore docs, collector.py, thresholds, decay/net maths) so the data
// collected since 2026-09-11 stays comparable — only these two formatters divide by 10. Whole
// numbers print without a trailing ".0" (6, +23); otherwise one decimal (5.5, +23.5).
function newsFmtTenth(t){ return (t / 10).toLocaleString('en-US', { minimumFractionDigits: t % 10 ? 1 : 0, maximumFractionDigits: 1 }); }
function newsFmtImpact(v){ return newsFmtTenth(Math.round(Number(v) || 0)); }
function newsFmtSigned(v){ const r = Math.round(v) || 0; return (r > 0 ? '+' : '') + newsFmtTenth(r); }
// Futures/CFD-style price formatting for the merged chart's right-hand axis and hover tooltip
// (2026-09-14) — 2 decimals regardless of magnitude keeps WHEAT (~600) and SBM (~350) readable
// without a per-product format table.
function newsFmtPrice(v){
  if (v == null || !isFinite(v)) return '—';
  return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ── Clocks + CBOT session state ──────────────────────────────────────────────
const NEWS_CLOCKS = [
  ['VIETNAM', 'Asia/Ho_Chi_Minh'], ['ISTANBUL', 'Europe/Istanbul'],
  ['CHICAGO', 'America/Chicago'], ['BUENOS AIRES', 'America/Argentina/Buenos_Aires'],
];
// CME grain holidays (full closes). Update each December.
const CBOT_HOLIDAYS = ['2026-01-01', '2026-01-19', '2026-02-16', '2026-04-03', '2026-05-25', '2026-06-19',
  '2026-07-03', '2026-09-07', '2026-11-26', '2026-12-25', '2027-01-01', '2027-01-18', '2027-02-15', '2027-03-26',
  '2027-05-31', '2027-06-18', '2027-07-05', '2027-09-06', '2027-11-25', '2027-12-24'];
// Grains: Sun–Thu 19:00 → 07:45 CT (overnight), Mon–Fri 08:30 → 13:20 CT (day); 07:45–08:30 is the pause.
function cbotState(now = new Date()){
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(now);
  const get = t => parts.find(p => p.type === t)?.value;
  const wd = get('weekday'); const hh = parseInt(get('hour'), 10) % 24; const mm = parseInt(get('minute'), 10);
  const ymd = `${get('year')}-${get('month')}-${get('day')}`;
  const t = hh * 60 + mm;
  if (CBOT_HOLIDAYS.includes(ymd)) return { state: 'closed', label: 'CLOSED · holiday' };
  if (wd === 'Sat') return { state: 'closed', label: 'CLOSED · weekend' };
  if (wd === 'Sun') return t >= 19 * 60 ? { state: 'open', label: 'LIVE · overnight' } : { state: 'closed', label: 'CLOSED · opens 19:00 CT' };
  if (t < 7 * 60 + 45) return { state: 'open', label: 'LIVE · overnight' };
  if (t < 8 * 60 + 30) return { state: 'pause', label: 'PAUSE · reopens 08:30 CT' };
  if (t < 13 * 60 + 20) return { state: 'open', label: 'LIVE · day session' };
  if (wd === 'Fri') return { state: 'closed', label: 'CLOSED · weekend' };
  if (t < 19 * 60) return { state: 'closed', label: 'CLOSED · opens 19:00 CT' };
  return { state: 'open', label: 'LIVE · overnight' };
}
function renderNewsClocks(){
  const el = document.getElementById('newsClocks');
  if (!el) return;
  const now = new Date();
  const times = NEWS_CLOCKS.map(([name, tz]) => new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(now));
  const st = cbotState(now);
  if (el.children.length !== NEWS_CLOCKS.length + 1){           // first paint only
    el.innerHTML = NEWS_CLOCKS.map(([name]) => `<div class="news-clock"><div class="news-clock-name">${name}</div><div class="news-clock-time"></div></div>`).join('') +
      `<div class="news-clock news-cbot"><div class="news-clock-name">CBOT</div><div class="news-clock-time"><span class="news-cbot-dot"></span><span class="news-cbot-label"></span></div></div>`;
  }
  // every tick after that only touches text nodes — rebuilding the tiles made the browser re-blur them each second
  times.forEach((t, i) => { const n = el.children[i].lastElementChild; if (n.textContent !== t) n.textContent = t; });
  const cbot = el.lastElementChild, cls = 'news-clock news-cbot ' + st.state;
  if (cbot.className !== cls) cbot.className = cls;
  const lbl = cbot.querySelector('.news-cbot-label');
  if (lbl.textContent !== st.label) lbl.textContent = st.label;
}

  { weekday: 4, timeET: '08:30', name: 'USDA Export Sales', lane: 'REPORTS' },

function etToUtcMs(dateStr, timeET){
  // New York offset: EDT (−4) second Sunday of March → first Sunday of November, else EST (−5).
  const [y, m, d] = dateStr.split('-').map(Number);
  const [hh, mi] = timeET.split(':').map(Number);
  const nthSunday = (year, month, n) => { const first = new Date(Date.UTC(year, month - 1, 1)); const off = (7 - first.getUTCDay()) % 7; return 1 + off + 7 * (n - 1); };
  const dstStart = Date.UTC(y, 2, nthSunday(y, 3, 2), 7);       // 02:00 EST = 07:00 UTC
  const dstEnd = Date.UTC(y, 10, nthSunday(y, 11, 1), 6);       // 02:00 EDT = 06:00 UTC
  const local = Date.UTC(y, m - 1, d, hh, mi);
  const isDst = local + 5 * 3600000 >= dstStart && local + 4 * 3600000 < dstEnd;
  return local + (isDst ? 4 : 5) * 3600000;
}
function upcomingEvents(n = 6){
  const now = Date.now();
  const out = [];
  for (const e of NEWS_FIXED_EVENTS){
    const ms = etToUtcMs(e.date, e.timeET);
    if (ms >= now - 3600000) out.push({ ...e, ms });
  }
  // next 21 days of weekly events
  const day0 = new Date(now); day0.setUTCHours(0, 0, 0, 0);
  for (let k = 0; k < 21; k++){
    const dt = new Date(day0.getTime() + k * 86400000);
    const dateStr = dt.toISOString().slice(0, 10);
    for (const w of NEWS_WEEKLY_EVENTS){
      if (dt.getUTCDay() !== w.weekday) continue;
      if (w.months && !w.months.includes(dt.getUTCMonth() + 1)) continue;
      const ms = etToUtcMs(dateStr, w.timeET);
      if (ms >= now - 3600000) out.push({ ...w, ms });
    }
  }
  // monthly approximations
  // CONAB date corrected 2026-09-16 (10 → 15): Mete asked why the Sep 2026 "Brazil 2026/27 first-look"
  // story wasn't in Upcoming Releases; checked CONAB's official 2026 calendar — its monthly "Levantamento
  // de Safras de Grãos" always publishes on the 15th (e.g. 2026-09-15 closed out the 2025/26 season, the
  // actual 2026/27 season's first official CONAB survey isn't due until 2026-10-15), not the 10th this
  // code had been approximating with. Separately: the tweet Mete saw was an independent analyst's early
  // estimate, not CONAB's own report — CONAB hadn't published anything on 2026/27 yet at that point, so
  // there was no CONAB story for the collector to have missed.
  const monthly = [{ day: 15, timeET: '09:00', name: 'CONAB grain survey (~)', lane: 'REPORTS' }, { day: 22, timeET: '10:00', name: 'IGC Grain Market Report (~)', lane: 'REPORTS' }];
  for (let k = 0; k < 2; k++){
    const dt = new Date(Date.UTC(day0.getUTCFullYear(), day0.getUTCMonth() + k, 1));
    for (const m of monthly){
      const dateStr = `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, '0')}-${String(m.day).padStart(2, '0')}`;
      const ms = etToUtcMs(dateStr, m.timeET);
      if (ms >= now - 3600000) out.push({ ...m, ms });
    }
  }
  return out.sort((a, b) => a.ms - b.ms).slice(0, n);
}

}

// ── SVG line chart (no library: keeps the app a single file) ────────────────
// Merged net-impact + price chart (2026-09-14, Mete's request): draws the decayed net-impact
// line (left axis, see NEWS_DECAY_* above) and the real daily-close price line (right axis, when price data exists for
// this product) on ONE chart instead of two separate boxes. `xMin`/`xMax` are the selected range
// window's boundaries in ms — driven by the range chip, not by however much data happens to exist —
// so "5Y" always spans 5 real years on screen even if net-impact events are sparse in it. Returns
// `{ html, meta }`: meta carries just enough of the pixel<->time mapping for the caller to build a
// mouse-hover tooltip without re-deriving it (see renderNewsChart) — no closures survive an
// innerHTML string, so the scale has to be handed back explicitly instead.
// (newsChartSvg — the old merged two-axis chart builder — removed 2026-10-02; see renderNewsChart)
function niceStep(raw){
  if (raw <= 0) return 50;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
}

// Latest price + day-change% for a product's tile header (2026-09-14, Mete's request — "TradingView
// widget'taki gibi" a live price right in the small box). Computed entirely from the same
// Firestore prices/{product} data the merged chart already holds in `newsPrices` — no extra network
// call. Prefers the intraday series (freshest, refreshed every collector run) and falls back to the
// daily series if intraday hasn't synced yet; returns null (tile just omits the price) if neither has.
//
// 2026-09-15: `intraday` here is already despiked AND sanity-trimmed by cleanIntraday() (see its
// comment above) — a still-bad trailing stretch has already been dropped, so `live` below is either
// a genuinely sane recent tick, or (if the whole recent stretch was bad) we fall through to the last
// daily close, flagged `unreliable` so the tile can say so instead of silently guessing.
function newsLatestPrice(product){
  const rec = newsPrices[product];
  if (!rec) return null;
  const daily = Array.isArray(rec.bars) ? rec.bars : [];
  const intraday = Array.isArray(rec.intraday) ? cleanIntraday(rec.intraday, daily) : [];
  const live = intraday.length ? intraday[intraday.length - 1] : (daily.length ? daily[daily.length - 1] : null);
  if (!live) return null;
  const unreliable = !intraday.length && Array.isArray(rec.intraday) && rec.intraday.length > 0;
  // Day-over-day % vs the most recent daily close from BEFORE the live bar's own calendar day
  // (UTC date compare — precise enough for a ticker-style % figure, no exchange-session math needed).
  const liveDay = new Date(live.t).toISOString().slice(0, 10);
  let prevClose = null;
  for (let i = daily.length - 1; i >= 0; i--){
    if (new Date(daily[i].t).toISOString().slice(0, 10) < liveDay){ prevClose = daily[i].c; break; }
  }
  const pct = prevClose ? (live.c - prevClose) / prevClose * 100 : null;
  return { price: live.c, pct, unreliable };
}

const NEWS_THUMBS = { WHEAT: 'assets/thumb-wheat.jpg', CORN: 'assets/thumb-corn.jpg', SBM: 'assets/thumb-soy.jpg', POLITICS: 'assets/thumb-politics.jpg' };
function newsThumbFallback(s){ return s.category === 'POLITICS' ? NEWS_THUMBS.POLITICS : (NEWS_THUMBS[s.product] || NEWS_THUMBS.POLITICS); }
// Soft curve through the points that never overshoots them (monotone cubic) — used by the price
// line, the net-impact line and the tile sparklines.
function newsSmoothPath(pts){
  const n = pts.length;
  if (n < 3) return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++){ dx[i] = (pts[i + 1][0] - pts[i][0]) || 1e-6; m[i] = (pts[i + 1][1] - pts[i][1]) / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : 3 * (dx[i - 1] + dx[i]) / ((2 * dx[i] + dx[i - 1]) / m[i - 1] + (dx[i] + 2 * dx[i - 1]) / m[i]);
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++){
    const h = dx[i] / 3;
    d += `C${(pts[i][0] + h).toFixed(1)} ${(pts[i][1] + t[i] * h).toFixed(1)} ${(pts[i + 1][0] - h).toFixed(1)} ${(pts[i + 1][1] - t[i + 1] * h).toFixed(1)} ${pts[i + 1][0].toFixed(1)} ${pts[i + 1][1].toFixed(1)}`;
  }
  return d;
}
// Last 24h of the cleaned intraday series — the tile's mini chart and its L (low) / H (high).
function newsDaySeries(product){
  const rec = newsPrices[product];
  if (!rec || !Array.isArray(rec.intraday)) return [];
  const since = Date.now() - 24 * 3600 * 1000;
  return cleanIntraday(rec.intraday, Array.isArray(rec.bars) ? rec.bars : []).filter(b => b.t >= since).sort((a, b) => a.t - b.t);
}

    let hl = '', spark = '';

      const lo = Math.min(...day.map(b => b.c)), hi = Math.max(...day.map(b => b.c));
      hl = `<div class="hl" title="Low / high over the last 24 hours"><span><i>L</i>${newsFmtPrice(lo)}</span><span><i>H</i>${newsFmtPrice(hi)}</span></div>`;
      const t0 = day[0].t, t1 = day[day.length - 1].t;
      const P = day.map(b => [(b.t - t0) / ((t1 - t0) || 1) * 120, 30 - (b.c - lo) / ((hi - lo) || 1) * 26]);
      spark = `<svg class="spark" viewBox="0 0 120 32" preserveAspectRatio="none"><path d="${newsSmoothPath(P)}" fill="none" stroke-width="1.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;

    tile.innerHTML = isFreight
      ? head + `<div class="net">${q ? newsFmtPrice(q.price) : '—'}<small>Brent</small></div><div class="px" title="${pxTitle}">${chg}</div>${hl}${spark}`
      : head + `<div class="net ${now.n === 0 ? '' : now.net > 0 ? 'up' : now.net < 0 ? 'down' : ''}">${now.n ? newsFmtSigned(now.net) : '—'}<small>net</small></div>` +
        (q ? `<div class="${pxCls}" title="${pxTitle}">${q.unreliable ? '≈' : ''}${newsFmtPrice(q.price)} ${chg}</div>` : '') + hl +
        `<div class="sub">${now.n ? `${now.bull}▲ ${now.bear}▼ in ${NEWS_DECAY_ZERO_H}h` : `no qualifying event in ${NEWS_DECAY_ZERO_H}h`}</div>` + spark;
    tile.title = isFreight ? 'Brent crude price — click to chart' : `${count} qualifying ${p} events in the last ${NEWS_HISTORY_DAYS} days — click to chart`;
    tile.addEventListener('click', () => { if (newsUI.chartProduct !== p){ newsUI.chartProduct = p; refreshNewsHero(); } });
    wrap.appendChild(tile);
  }
  return wrap;
}

function renderNewsChart(){
  // 2026-10-02 (liquid-glass theme), replaces the old merged two-axis chart: the futures price is
  // the main pane and the news net impact gets its own pane underneath, on one shared time axis
  // with one shared crosshair. Each pane has a single scale, so neither line can be misread against
  // the other's axis. Net impact is drawn green above zero / red below; every qualifying headline is
  // a small dot on it at the moment it was published (green bullish, red bearish) that opens the
  // article. FREIGHT is price-only (Brent). Same data as before: newsSmoothSeries() for the line,
  // newsMarkersFor() for the dots, Firestore prices/{product} for the price.
  const product = newsUI.chartProduct;
  const box = document.createElement('div');
  box.className = 'glass news-chart';
  const { now, count } = newsSeries(product);
  const rangeDef = NEWS_CHART_RANGES.find(r => r.key === newsUI.chartRange) || NEWS_CHART_RANGES[2];
  const xMax = Date.now();
  const xMin = xMax - rangeDef.days * 24 * 3600 * 1000;
  const priceOnly = product === 'FREIGHT';
  const pts = priceOnly ? [] : newsSmoothSeries(product, xMin, xMax);
  const markers = priceOnly ? [] : newsMarkersFor(product, xMin, xMax);
  const priceRec = newsPrices[product];
  const useIntraday = rangeDef.key === '1D';
  const rawBars = priceRec && Array.isArray(useIntraday ? priceRec.intraday : priceRec.bars)
    ? (useIntraday ? cleanIntraday(priceRec.intraday, priceRec.bars) : priceRec.bars) : [];
  const bars = rawBars.filter(b => b.t >= xMin && b.t <= xMax).sort((a, b) => a.t - b.t);
  const hasPrice = bars.length >= 2, hasNet = pts.length >= 2;

  // ---- header
  const q = newsLatestPrice(product);
  const head = document.createElement('div');
  head.className = 'news-chart-head';
  const left = document.createElement('div');
  left.style.cssText = 'flex:1; min-width:180px;';
  let big = '—';
  if (hasPrice){
    const last = bars[bars.length - 1].c, first = bars[0].c, chg = first ? (last - first) / first * 100 : 0;
    big = `${newsFmtPrice(q ? q.price : last)}<small class="${chg >= 0 ? 'up' : 'down'}">${chg >= 0 ? '▲' : '▼'} ${Math.abs(chg).toFixed(1)}%</small><small style="color:var(--ink-3)">${rangeDef.label.toLowerCase()}</small>`;
  } else if (!priceOnly && now.n){
    big = `<span class="${now.net > 0 ? 'up' : now.net < 0 ? 'down' : ''}">${newsFmtSigned(now.net)}</span><small style="color:var(--ink-3)">net impact</small>`;
  }
  left.innerHTML = `<div class="news-chart-title">${product} · ${PRICE_LABELS[product] || 'price'}${priceOnly ? '' : ' and news net impact'}</div>` +
    `<div class="news-chart-big">${big}</div>` +
    (priceOnly ? '' : `<div class="news-chart-sub">net <b class="${now.net > 0 ? 'up' : now.net < 0 ? 'down' : ''}">${now.n ? newsFmtSigned(now.net) : '—'}</b> · ${now.bull} bullish / ${now.bear} bearish · ${now.n} events · ${count} in ${NEWS_HISTORY_DAYS}d</div>`);
  head.appendChild(left);
  const legend = document.createElement('div');
  legend.className = 'news-legend';
  legend.innerHTML = `<span><i style="background:var(--orange)"></i>Price</span>` + (priceOnly ? '' : `<span><i style="background:linear-gradient(90deg,var(--bull) 50%,var(--bear) 50%)"></i>Net impact</span>`);
  head.appendChild(legend);
  head.appendChild(renderNewsRangeBar());
  box.appendChild(head);

  const plot = document.createElement('div');
  plot.className = 'news-plot';
  box.appendChild(plot);
  if (!hasPrice && !hasNet){
    plot.innerHTML = `<div class="note">${priceOnly ? 'No price data for this range yet.' : `Not enough qualifying events yet to draw this range (needs impact ≥ ${newsFmtImpact(NEWS_MIN_IMPACT)} and confidence ≥ ${NEWS_MIN_CONF}), and no price data.`}</div>`;
    return box;
  }

  // ---- geometry (viewBox units; the svg scales uniformly to its container)
  const host = document.getElementById('newstab');
  const full = (host && host.clientWidth) || 1000;
  const W = Math.max(340, (window.innerWidth > 1100 ? full - 330 - 12 : full) - 38);
  const padL = 6, padR = 58, top = 14;
  const showNet = !priceOnly && hasNet;
  const hP = hasPrice ? (showNet ? 158 : 222) : 0, gap = hasPrice && showNet ? 28 : (showNet ? 14 : 0), hN = showNet ? (hasPrice ? 66 : 200) : 0;
  const Ht = top + hP + gap + hN + 24;
  const X = t => padL + (t - xMin) / ((xMax - xMin) || 1) * (W - padL - padR);
  let svg = '<defs><linearGradient id="newsPriceFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2600c" stop-opacity=".30"/><stop offset="1" stop-color="#f2600c" stop-opacity="0"/></linearGradient>';
  let P = [], N = [], YN = null, Yp = null, nt = 0, zero = 0;
  if (showNet){
    nt = top + hP + gap; zero = nt + hN / 2;
    svg += `<linearGradient id="newsNetFill" gradientUnits="userSpaceOnUse" x1="0" y1="${nt}" x2="0" y2="${nt + hN}"><stop offset="0" stop-color="#1f9d61" stop-opacity=".55"/><stop offset=".5" stop-color="#1f9d61" stop-opacity=".08"/><stop offset=".5" stop-color="#e0463c" stop-opacity=".08"/><stop offset="1" stop-color="#e0463c" stop-opacity=".55"/></linearGradient>` +
      `<clipPath id="newsNetUp"><rect x="0" y="0" width="${W}" height="${zero}"/></clipPath><clipPath id="newsNetDown"><rect x="0" y="${zero}" width="${W}" height="${hN}"/></clipPath>`;
  }
  svg += '</defs>';
  if (hasPrice){
    let lo = Math.min(...bars.map(b => b.c)), hi = Math.max(...bars.map(b => b.c));
    const pad = (hi - lo) * 0.12 || 1; lo -= pad; hi += pad;
    Yp = v => top + (hi - v) / (hi - lo) * hP;
    P = bars.map(b => [X(b.t), Yp(b.c)]);
    for (let i = 0; i <= 3; i++){
      const v = lo + (hi - lo) * i / 3, y = Yp(v);
      svg += `<line x1="${padL}" x2="${W - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(42,36,32,.07)"/><text class="news-axis" x="${W - padR + 8}" y="${(y + 3.5).toFixed(1)}">${newsFmtPrice(v)}</text>`;
    }
    const line = newsSmoothPath(P), lastP = P[P.length - 1];
    svg += `<path d="${line}L${lastP[0].toFixed(1)} ${top + hP}L${P[0][0].toFixed(1)} ${top + hP}Z" fill="url(#newsPriceFill)"/>` +
      `<path d="${line}" fill="none" stroke="#f2600c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<circle cx="${lastP[0].toFixed(1)}" cy="${lastP[1].toFixed(1)}" r="9" fill="#f2600c" opacity=".18"/><circle cx="${lastP[0].toFixed(1)}" cy="${lastP[1].toFixed(1)}" r="4.5" fill="#f2600c" stroke="#fff" stroke-width="2"/>`;
  }
  if (showNet){
    const mx = Math.max(10, ...pts.map(p => Math.abs(p.net)), ...markers.map(m => Math.abs(m.net))) * 1.1;
    YN = v => zero - v / mx * hN / 2;
    N = pts.map(p => [X(p.ms), YN(p.net)]);
    const nl = newsSmoothPath(N);
    svg += `<text class="news-pane-label" x="${padL}" y="${nt - 9}">NET IMPACT</text>` +
      `<text class="news-axis" x="${W - padR + 8}" y="${(zero + 3.5).toFixed(1)}">0</text><text class="news-axis" x="${W - padR + 8}" y="${nt + 8}">${newsFmtSigned(mx)}</text><text class="news-axis" x="${W - padR + 8}" y="${nt + hN}">${newsFmtSigned(-mx)}</text>` +
      `<path d="${nl}L${N[N.length - 1][0].toFixed(1)} ${zero}L${N[0][0].toFixed(1)} ${zero}Z" fill="url(#newsNetFill)"/>` +
      `<g clip-path="url(#newsNetUp)"><path d="${nl}" fill="none" stroke="#1f9d61" stroke-width="2" stroke-linecap="round"/></g>` +
      `<g clip-path="url(#newsNetDown)"><path d="${nl}" fill="none" stroke="#e0463c" stroke-width="2" stroke-linecap="round"/></g>` +
      `<line x1="${padL}" x2="${W - padR}" y1="${zero}" y2="${zero}" stroke="rgba(42,36,32,.22)" stroke-dasharray="2 4"/>`;
  }
  const tf = rangeDef.days <= 1 ? { hour: '2-digit', minute: '2-digit', hour12: false } : rangeDef.days <= 31 ? { day: '2-digit', month: 'short' } : { month: 'short', year: '2-digit' };
  for (let i = 0; i < 5; i++){
    const t = xMin + (xMax - xMin) * i / 4;
    svg += `<text class="news-axis" x="${X(t).toFixed(1)}" y="${Ht - 6}" text-anchor="${i === 0 ? 'start' : i === 4 ? 'end' : 'middle'}">${newsFmt(t, tf)}</text>`;
  }
  svg += `<g class="news-cross" opacity="0"><line y1="${top}" y2="${Ht - 24}" stroke="rgba(42,36,32,.35)" stroke-dasharray="3 4"/>` +
    (hasPrice ? '<circle class="c1" r="5" fill="#f2600c" stroke="#fff" stroke-width="2"/>' : '') + (showNet ? '<circle class="c2" r="4.5" stroke="#fff" stroke-width="2"/>' : '') + '</g>';
  if (showNet){
    // headline dots — a tick smaller than the price dot; a real link, so a click opens the article
    svg += markers.filter(m => m.direction !== 'NEUTRAL').map(m => {
      const dot = `<circle class="news-marker" cx="${X(m.ms).toFixed(1)}" cy="${YN(m.net).toFixed(1)}" r="3.8" fill="${m.direction === 'BULLISH' ? '#1f9d61' : '#e0463c'}" stroke="#fff" stroke-width="1.6">` +
        `<title>${escapeHtml(`${newsFmtTime(m.ms)} · ${m.direction === 'BULLISH' ? '▲' : '▼'} ${newsFmtImpact(m.impact)} · ${m.headline || ''}`)}</title></circle>`;
      return m.url ? `<a href="${escapeAttr(m.url)}" target="_blank" rel="noopener">${dot}</a>` : dot;
    }).join('');
  }
  plot.innerHTML = `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="${product} price${showNet ? ' and net impact' : ''}">${svg}</svg><div class="news-tip"></div>`;

  // ---- crosshair + tooltip: nearest price bar and nearest net-impact sample to the pointer
  const svgEl = plot.querySelector('svg'), tip = plot.querySelector('.news-tip'), cross = svgEl.querySelector('.news-cross');
  const nearest = (arr, x) => { let bi = -1, bd = Infinity; for (let i = 0; i < arr.length; i++){ const d = Math.abs(arr[i][0] - x); if (d < bd){ bd = d; bi = i; } } return bi; };
  svgEl.addEventListener('pointermove', (e) => {
    const r = svgEl.getBoundingClientRect();
    if (!r.width) return;
    const x = (e.clientX - r.left) / r.width * W;
    if (x < padL - 4 || x > W - padR + 4){ cross.setAttribute('opacity', 0); tip.style.opacity = 0; return; }
    const pi = hasPrice ? nearest(P, x) : -1, ni = showNet ? nearest(N, x) : -1;
    const cx = pi >= 0 ? P[pi][0] : N[ni][0];
    cross.setAttribute('opacity', 1);
    const ln = cross.querySelector('line'); ln.setAttribute('x1', cx); ln.setAttribute('x2', cx);
    const lines = [`<div class="t">${newsFmtTime(pi >= 0 ? bars[pi].t : pts[ni].ms)}</div>`];
    if (pi >= 0){
      const c1 = cross.querySelector('.c1'); c1.setAttribute('cx', P[pi][0]); c1.setAttribute('cy', P[pi][1]);
      lines.push(`<div class="k"><i style="background:var(--orange)"></i>Price <b>${newsFmtPrice(bars[pi].c)}</b></div>`);
    }
    if (ni >= 0){
      const c2 = cross.querySelector('.c2'); c2.setAttribute('cx', N[ni][0]); c2.setAttribute('cy', N[ni][1]); c2.setAttribute('fill', pts[ni].net >= 0 ? '#1f9d61' : '#e0463c');
      lines.push(`<div class="k"><i style="background:${pts[ni].net >= 0 ? 'var(--bull)' : 'var(--bear)'}"></i>Net impact <b>${newsFmtSigned(pts[ni].net)}</b></div>`);
    }
    tip.innerHTML = lines.join('');
    tip.style.left = Math.min(Math.max(cx / W * 100, 9), 88) + '%';
    tip.style.opacity = 1;
  });
  svgEl.addEventListener('pointerleave', () => { cross.setAttribute('opacity', 0); tip.style.opacity = 0; });
  return box;
}

// widgets (mini-symbol-overview, CAPITALCOM:DXY/VIX) for MACRO, which had no futures price series of
// its own to merge into the net-impact chart the way WHEAT/CORN/SBM/FREIGHT do (Yahoo Finance
// ZW=F/ZC=F/ZM=F/BZ=F via collector.py, drawn straight into newsChartSvg/renderNewsChart — see that
// function). That whole TradingView-widget code path (NEWS_PRICE_SYMBOLS, NEWS_PRICE_EXTRA_LINK,
// newsPriceWidgetCache, tvWidget(), renderNewsPriceWidget()) was MACRO's only caller, so it was
// removed along with MACRO itself, 2026-09-17 (cost-reduction request) — every remaining product now
// always has a real merged price line, no separate widget branch needed.

// Breaking ticker: the newest breaking events of the last 48h, scrolling like a news channel.
function renderNewsTicker(){
  const since = Date.now() - 48 * 3600 * 1000;
  const items = newsDocs.filter(s => s.breaking === true && s.ms >= since && newsVisible(s)).sort((a, b) => b.ms - a.ms).slice(0, 12);
  if (!items.length) return null;
  const bar = document.createElement('div');
  bar.className = 'glass news-ticker';
  const label = document.createElement('span');
  label.className = 'news-ticker-label';
  label.textContent = 'BREAKING';
  const track = document.createElement('div');
  track.className = 'news-ticker-track';
  const inner = document.createElement('div');
  inner.className = 'news-ticker-inner';
  const mk = () => items.map(s => {
    const a = document.createElement('a');
    a.className = 'news-ticker-item ' + (s.direction === 'BULLISH' ? 'bull' : s.direction === 'BEARISH' ? 'bear' : 'neu');
    a.href = s.url || '#'; a.target = '_blank'; a.rel = 'noopener';
    // 2026-10-02: everything stays ink-colored except the arrow (green ▲ / red ▼)
    const arrowColor = s.direction === 'BULLISH' ? 'var(--bull)' : s.direction === 'BEARISH' ? 'var(--bear)' : 'var(--ink-3)';
    a.innerHTML = `${newsFmtTime(s.ms)} · <b>${escapeHtml(s.product || '')}</b> <b style="color:${arrowColor}">${s.direction === 'BULLISH' ? '▲' : s.direction === 'BEARISH' ? '▼' : '•'}</b> ${newsFmtImpact(s.impact)} · ${escapeHtml(s.headline || '')}`;
    return a;
  });
  mk().forEach(a => inner.appendChild(a));
  mk().forEach(a => inner.appendChild(a));      // duplicated so the loop is seamless
  const tickerDurationSec = Math.max(20, items.length * 9);   // kept in JS, not re-read from
                                                                // inline style — see resume() below
  inner.style.animationDuration = tickerDurationSec + 's';
  track.appendChild(inner);
  bar.appendChild(label); bar.appendChild(track);

  // Hovering (desktop) or pressing-and-holding (touch) pauses the strip; press-and-drag lets you
  // scrub it left/right by hand instead of waiting for the loop to come back around. Releasing
  // always resumes the auto-scroll from wherever you left it, never snapping back to the start.
  // Handled entirely here in JS so hover, touch-hold and drag-release all share one mechanism —
  // a CSS-only `:hover{ animation-play-state:paused }` can't also support manual scrubbing,
  // because a still-running (even paused) CSS animation keeps owning `transform` and ignores
  // any inline transform we'd try to drive by hand.
  let dragging = false, dragMoved = false, dragStartX = 0, dragBaseTx = 0, singleWidth = 0;
  const txNow = () => {
    const m = getComputedStyle(inner).transform;
    const mm = m && m.match(/matrix\(([^)]+)\)/);
    return mm ? (parseFloat(mm[1].split(',')[4]) || 0) : 0;
  };
  const detach = () => {                        // freeze the animation, hand transform control to us
    const tx = txNow();
    inner.style.animation = 'none';
    inner.style.transform = `translateX(${tx}px)`;
    return tx;
  };
  const resume = () => {                         // restart the auto-scroll from the current spot
    const tx = txNow();
    singleWidth = singleWidth || inner.scrollWidth / 2;   // content is duplicated once, for the loop
    // NOTE: always use the captured tickerDurationSec, never re-read inner.style.animationDuration
    // here — detach() sets inner.style.animation = 'none', and assigning the `animation` SHORTHAND
    // resets all of its longhand sub-properties (including animation-duration) back to 0s. Reading
    // animationDuration after that always returned "0s", so `parseFloat(...) || 20` silently fell
    // back to a fixed 20s on every single resume — far faster than the intended (up to 108s)
    // content-scaled speed. That was the "ticker suddenly flies by" bug.
    const durationSec = tickerDurationSec;
    const fraction = singleWidth > 0 ? Math.min(1, Math.max(0, -tx / singleWidth)) : 0;
    inner.style.transform = '';
    inner.style.animation = 'none';
    void inner.offsetWidth;                      // force reflow so the delay below actually takes
    inner.style.animation = `news-scroll ${durationSec}s linear infinite`;
    inner.style.animationDelay = `-${fraction * durationSec}s`;
  };
  track.addEventListener('mouseenter', () => { if (!dragging) detach(); });
  track.addEventListener('mouseleave', () => { if (!dragging) resume(); });
  track.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragging = true; dragMoved = false;
    dragStartX = e.clientX;
    singleWidth = inner.scrollWidth / 2;
    dragBaseTx = detach();
    track.classList.add('dragging');
    try{ track.setPointerCapture(e.pointerId); }catch(_){}
  });
  track.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const delta = e.clientX - dragStartX;
    if (Math.abs(delta) > 4) dragMoved = true;
    let tx = dragBaseTx + delta;
    if (singleWidth > 0){
      tx = tx % singleWidth;
      if (tx > 0) tx -= singleWidth;              // wrap so scrubbing feels endless both directions
    }
    inner.style.transform = `translateX(${tx}px)`;
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    track.classList.remove('dragging');
    resume();
    if (dragMoved){                                // a drag shouldn't also open the link you let go on
      track.addEventListener('click', (ev) => { ev.preventDefault(); ev.stopPropagation(); }, { capture: true, once: true });
    }
  };
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  return bar;
}
