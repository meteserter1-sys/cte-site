<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commodity Trading Engine (CTE)</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f3ede4">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CTE">

<!-- UI language: English. Conversation with user stays in Turkish. -->
<style>
  /* ════════════════════════════════════════════════════════════════════════════════════════════
     LIQUID GLASS THEME (2026-10-02, Mete) — replaces the dark CTE theme entirely.
     Light frosted-glass panels with dark ink over a full-bleed photo that changes per tab; one
     typeface for words AND numbers (Plus Jakarta Sans, tabular figures); a deeper orange for the
     selected state. The old variable names are kept (--panel, --border, --text, --accent, --mono …)
     because a lot of markup built in JS styles itself inline with them — re-pointing the variables
     re-themes all of that without touching each call site.
     Files this page now needs next to index.html: assets/PlusJakartaSans*.woff2 (3 files), assets/bg-*.jpg
     (one per tab), assets/thumb-*.jpg (news-card fallbacks).
     ════════════════════════════════════════════════════════════════════════════════════════════ */
  /* three subsets of the same variable font; the browser only downloads the ones a page actually needs
     (ext = Turkish/Central European letters such as ğ ş, vi = Vietnamese) */
  @font-face{ font-family:"Jakarta"; src:url("assets/PlusJakartaSans.woff2") format("woff2"); font-weight:200 800; font-style:normal; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face{ font-family:"Jakarta"; src:url("assets/PlusJakartaSans-ext.woff2") format("woff2"); font-weight:200 800; font-style:normal; font-display:swap;
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face{ font-family:"Jakarta"; src:url("assets/PlusJakartaSans-vi.woff2") format("woff2"); font-weight:200 800; font-style:normal; font-display:swap;
    unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB; }
  :root{
    --ink:#2a2420; --ink-2:rgba(42,36,32,.66); --ink-3:rgba(42,36,32,.46);
    --orange:#f2600c; --orange-2:#ff8a3d; --orange-soft:rgba(242,96,12,.13);
    --bull:#1f9d61; --bear:#e0463c; --neu:#8b8680;
    --glass-a:.46; --glass-strong-a:.62; --veil-a:.06;
    --glass:rgba(255,252,247,var(--glass-a)); --glass-strong:rgba(255,252,247,var(--glass-strong-a)); --glass-faint:rgba(255,252,247,.10);
    --edge:rgba(255,255,255,.78); --hair:rgba(42,36,32,.09);
    --r-xl:34px; --r-lg:26px; --r-md:18px;
    --shadow:0 24px 60px -28px rgba(40,26,12,.45), 0 2px 6px -2px rgba(40,26,12,.12);
    /* legacy names, re-pointed */
    --bg:#cfd9e2; --panel:rgba(255,252,247,.58); --panel-2:rgba(255,252,247,.40); --border:rgba(42,36,32,.10);
    --text:var(--ink); --text-dim:var(--ink-2); --accent:var(--orange); --accent-soft:var(--orange-soft);
    --good:var(--bull); --good-bg:var(--bull); --bad:var(--bear); --input-bg:rgba(255,255,255,.74);
    --sans:"Jakarta", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono:var(--sans);
  }
  /* darker photos (Input, History) get a lighter veil and denser glass so the page still reads bright */
  body[data-tab="inputtab"]{ --veil-a:.44; --glass-a:.66; --glass-strong-a:.76; }
  body[data-tab="historytab"]{ --veil-a:.56; --glass-a:.70; --glass-strong-a:.80; }
  body[data-tab="vnsupply"], body[data-tab="malaysia"]{ --veil-a:.16; --glass-a:.56; --glass-strong-a:.68; }
  body[data-tab="indonesia"], body[data-tab="vietnam"]{ --veil-a:.10; --glass-a:.54; --glass-strong-a:.66; }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    font-family:var(--sans); color:var(--ink); font-size:14px; line-height:1.4; min-height:100vh;
    font-feature-settings:"tnum" 1, "lnum" 1; -webkit-font-smoothing:antialiased; background:var(--bg); padding-bottom:40px;
  }
  button, input, select, textarea{ font-family:inherit; font-feature-settings:inherit; }
  .bg{ position:fixed; inset:0; z-index:-2; background-size:cover; background-position:center; opacity:0; transition:opacity .45s ease; will-change:opacity; }
  .bg.show{ opacity:1; }
  .bg-veil{ position:fixed; inset:0; z-index:-1; background:rgba(255,250,244,var(--veil-a)); transition:background-color .45s ease; pointer-events:none; }

  /* ---------- glass primitives ---------- */
  .glass{
    position:relative; background:var(--glass); border:1px solid var(--edge); border-radius:var(--r-lg);
    -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.25);
  }
  .glass::before{ /* specular sweep — the "liquid" highlight */
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.08) 28%, rgba(255,255,255,0) 55%, rgba(255,255,255,.14) 100%);
  }
  .glass > *{ position:relative; }
  .pill{ border-radius:999px; }
  .sheet{
    margin:34px auto 30px; max-width:1480px; width:calc(100% - 72px); padding:18px; border-radius:44px;
    background:var(--glass-faint); border:1px solid rgba(255,255,255,.55);
    /* no backdrop blur here on purpose: this frame spans the whole page, and every glass panel inside it
       would then be blurring an already-blurred layer — the single most expensive thing on the page */
    box-shadow:0 40px 90px -40px rgba(30,20,10,.5), inset 0 1px 0 rgba(255,255,255,.7);
  }

  /* ---------- liquid selection: one orange drop that slides to the picked option ---------- */
  [data-liq]{ position:relative; }
  [data-liq] > *:not(.glider){ position:relative; z-index:1; }
  .glider{ position:absolute; z-index:0; pointer-events:none; border-radius:999px;
    background:linear-gradient(180deg, var(--orange-2), var(--orange));
    box-shadow:0 8px 18px -6px rgba(242,96,12,.65), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -4px 8px rgba(160,50,0,.18); }
  .glider.move{ transition:left .55s cubic-bezier(.3,1.35,.45,1), top .55s cubic-bezier(.3,1.35,.45,1), width .55s cubic-bezier(.3,1.35,.45,1), height .55s cubic-bezier(.3,1.35,.45,1); }
  .glider.ring{ z-index:2; background:none; border-radius:var(--r-lg); box-shadow:inset 0 0 0 1.5px var(--orange), 0 14px 30px -14px rgba(242,96,12,.55); }
  .glider.h.go{ animation:liquid-h .55s cubic-bezier(.3,.9,.4,1); } .glider.v.go{ animation:liquid-v .55s cubic-bezier(.3,.9,.4,1); } .glider.ring.go{ animation:liquid-r .55s cubic-bezier(.3,.9,.4,1); }
  @keyframes liquid-h{ 0%{ transform:scale(1,1); } 32%{ transform:scale(1.22,.80); } 68%{ transform:scale(.95,1.06); } 100%{ transform:scale(1,1); } }
  @keyframes liquid-v{ 0%{ transform:scale(1,1); } 32%{ transform:scale(.84,1.2); } 68%{ transform:scale(1.05,.95); } 100%{ transform:scale(1,1); } }
  @keyframes liquid-r{ 0%{ transform:scale(1); } 35%{ transform:scale(.94); } 70%{ transform:scale(1.02); } 100%{ transform:scale(1); } }
  @keyframes chip-pop{ 0%{ transform:scale(.82); } 55%{ transform:scale(1.10,.94); } 100%{ transform:scale(1); } }

  /* ---------- login ---------- */
  .login-screen{ position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px;
    background:rgba(255,250,244,.25); -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%); }
  .login-card{ width:min(360px, 100%); padding:30px 26px; display:flex; flex-direction:column; gap:11px; border-radius:var(--r-xl);
    background:rgba(255,252,247,.72); border:1px solid var(--edge); box-shadow:var(--shadow), inset 0 1px 0 #fff; }
  .login-card .eyebrow{ color:var(--orange); font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; }
  .login-card h1{ margin:0 0 4px; font-size:22px; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
  .login-card h1 .cte-tag{ color:var(--orange); }
  .login-sub{ color:var(--ink-2); font-size:12.5px; margin:0 0 6px; }
  .login-input{ background:rgba(255,255,255,.78); border:1px solid var(--edge); color:var(--ink); border-radius:14px; padding:12px 14px; font-size:14px; font-weight:600; width:100%; box-shadow:inset 0 1px 2px rgba(40,26,12,.08); }
  .login-input:focus{ outline:none; box-shadow:0 0 0 3px var(--orange-soft), inset 0 0 0 1px var(--orange); }
  .login-btn{ color:#fff; border:none; border-radius:999px; padding:12px 14px; font-size:14px; font-weight:700; cursor:pointer; margin-top:4px;
    background:linear-gradient(180deg, var(--orange-2), var(--orange)); box-shadow:0 10px 20px -8px rgba(242,96,12,.7), inset 0 1px 0 rgba(255,255,255,.45); }
  .login-btn:disabled{ opacity:.6; cursor:default; }
  .login-forgot{ background:none; border:none; color:var(--ink-2); font-size:12px; cursor:pointer; padding:2px 0; text-align:left; text-decoration:underline; }
  .login-error{ color:var(--bear); font-size:12.5px; min-height:14px; } .login-error.login-ok{ color:var(--bull); }

  /* until sign-in succeeds the app shell stays hidden behind the login card */
  .login-screen:not([style*="none"]) ~ .sheet{ visibility:hidden; }

  /* ---------- top bar ---------- */
  .top{ display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; justify-content:center; gap:11px; padding:7px 22px 7px 8px; }
  .brand-mark{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:12px; letter-spacing:.06em;
    background:radial-gradient(circle at 30% 25%, var(--orange-2), var(--orange) 60%, #c74a00); box-shadow:0 6px 16px -4px rgba(242,96,12,.6), inset 0 1px 0 rgba(255,255,255,.5); }
  .brand b{ font-weight:700; font-size:15px; letter-spacing:-.01em; white-space:nowrap; }
  .tabs{ flex:1; min-width:0; display:flex; gap:4px; padding:6px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{ cursor:pointer; padding:10px 20px; border-radius:999px; font-weight:600; font-size:13.5px; color:rgba(42,36,32,.8); white-space:nowrap; transition:color .25s, background-color .2s; user-select:none; }
  .tab:hover{ color:var(--ink); background:rgba(255,255,255,.45); }
  .tab.active, .tab.active:hover{ color:#fff; background:none; }
  .live-indicator{ display:flex; align-items:center; gap:7px; padding:0 14px; height:44px; font-size:12px; font-weight:600; color:var(--ink-2); }
  .live-dot{ width:8px; height:8px; border-radius:50%; background:var(--neu); transition:background-color .3s ease, box-shadow .3s ease; flex-shrink:0; }
  .live-dot.online{ background:var(--bull); box-shadow:0 0 0 4px rgba(31,157,97,.18); }
  .live-dot.offline{ background:var(--neu); }
  .live-dot.error{ background:var(--bear); box-shadow:0 0 0 4px rgba(224,70,60,.18); }
  .icon-btn{ all:unset; position:relative; cursor:pointer; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:var(--ink); transition:.2s; }
  .icon-btn.glass{ border-radius:50%; background:var(--glass); border:1px solid var(--edge); box-sizing:border-box;
    -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%); box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9); }
  .icon-btn:hover{ color:var(--orange); transform:translateY(-1px); }
  .icon-btn.flash{ color:var(--bull); }
  .icon-btn svg{ width:18px; height:18px; }
  /* generic text button (Log snapshot, Find nearest, Import Excel, Alerts …) */
  .hbtn{ background:rgba(255,255,255,.62); border:1px solid var(--edge); color:var(--ink); font-size:12.5px; font-weight:700; padding:9px 16px; border-radius:999px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; box-shadow:inset 0 1px 0 #fff, 0 6px 14px -8px rgba(40,26,12,.4); transition:.2s; }
  .hbtn:hover{ color:var(--orange); transform:translateY(-1px); }
  .hbtn.flash{ color:var(--bull); }
  #logTodayBtn{ color:#fff; border-color:transparent; background:linear-gradient(180deg, var(--orange-2), var(--orange)); box-shadow:0 10px 20px -8px rgba(242,96,12,.7), inset 0 1px 0 rgba(255,255,255,.45); }
  #offlineBanner{ margin:10px auto 0; max-width:900px; border-radius:999px; }

  /* ---------- sections ---------- */
  main{ padding:0; }
  main > section{ display:none; }
  main > section.active{ display:block; animation:tab-in .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes tab-in{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }   /* opacity + transform only: both run on the compositor */
  /* every tab except News is one glass panel holding its tables/cards */
  main > section:not(#newstab){ padding:20px 22px 22px; border-radius:var(--r-xl); background:var(--glass); border:1px solid var(--edge);
    -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9); }
  h2{ font-size:17px; font-weight:700; letter-spacing:-.015em; color:var(--ink); margin:22px 0 10px; text-transform:none; }
  h2:first-child{ margin-top:2px; }
  .placeholder{ padding:30px 16px; text-align:center; color:var(--ink-2); font-size:13px; }
  .placeholder .tag{ display:inline-block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--orange); background:var(--orange-soft); padding:4px 10px; border-radius:20px; margin-bottom:10px; }
  .note{ color:var(--ink-2); font-size:12.5px; line-height:1.5; margin-top:10px; padding:12px 14px; background:rgba(255,255,255,.42); border-radius:var(--r-md); border:1px solid var(--edge); }
  .note b{ color:var(--ink); }

  /* ---------- tables ---------- */
  .scrollx{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:22px; background:var(--glass-strong); border:1px solid var(--edge); padding:8px 12px 10px;
    box-shadow:inset 0 1px 0 #fff, 0 14px 30px -22px rgba(40,26,12,.5); }
  .grid-table{ width:auto; border-collapse:separate; border-spacing:0; font-size:13px; margin-bottom:2px; table-layout:fixed; }
  .grid-table th, .grid-table td{ padding:7px 5px; text-align:center; border-bottom:1px solid var(--hair); white-space:nowrap; width:66px; font-weight:500; }
  .grid-table tr:last-child td{ border-bottom:none; }
  .grid-table tr:hover td:not(.best):not(.rowlabel){ background:rgba(255,255,255,.35); }
  .grid-table.wide th, .grid-table.wide td{ width:112px; padding:7px 8px; }
  .grid-table th{ color:var(--ink-3); font-weight:700; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; }
  .grid-table th.rowlabel, .grid-table td.rowlabel{ text-align:left; color:var(--ink); font-weight:700; width:170px; white-space:normal; line-height:1.25; letter-spacing:0; }
  .delta-inline{ font-size:10px; font-weight:700; } .delta-inline.pos{ color:var(--bull); } .delta-inline.neg{ color:var(--bear); }
  input.cell{ width:58px; background:rgba(255,255,255,.78); border:1px solid rgba(42,36,32,.10); color:var(--ink); font-size:12.5px; font-weight:600; text-align:center;
    border-radius:10px; padding:6px 2px; box-shadow:inset 0 1px 2px rgba(40,26,12,.07); transition:box-shadow .15s; }
  input.cell:focus{ outline:none; box-shadow:0 0 0 3px var(--orange-soft), inset 0 0 0 1px var(--orange); }
  input.cell-indic{ color:#fff; border-color:transparent; font-weight:700; background:linear-gradient(180deg, var(--orange-2), var(--orange)); box-shadow:0 6px 12px -6px rgba(242,96,12,.7), inset 0 1px 0 rgba(255,255,255,.45); }
  input.cell-indic:focus{ box-shadow:0 0 0 3px rgba(242,96,12,.3), inset 0 1px 0 rgba(255,255,255,.45); }
  .results-table{ table-layout:fixed; }
  .results-table th, .results-table td{ width:50px; }
  .results-table th:last-child, .results-table td:last-child{ width:78px; }
  .results-table th:nth-last-child(2), .results-table td:nth-last-child(2){ width:78px; }
  .results-table th:nth-last-child(3), .results-table td:nth-last-child(3){ width:88px; }
  .results-table th.rowlabel, .results-table td.rowlabel{ width:66px; white-space:nowrap; position:sticky; left:0; z-index:2; background:rgba(255,252,247,.5); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
  .results-table td.combo{ font-weight:600; }
  .results-table td.best{ color:#fff; font-weight:700; border-radius:10px; background:radial-gradient(circle at 30% 20%, #5fd69a, var(--bull) 70%); box-shadow:0 6px 12px -6px rgba(31,157,97,.7), inset 0 1px 0 rgba(255,255,255,.5); }
  .results-table td.repl{ font-weight:700; color:var(--orange); }
  .results-table td.delta-pos{ color:var(--bull); font-weight:700; } .results-table td.delta-neg{ color:var(--bear); font-weight:700; }

  /* ---------- chips ---------- */
  .month-filter{ display:flex; width:fit-content; max-width:100%; flex-wrap:wrap; gap:4px; margin-bottom:16px; align-items:center; padding:5px; border-radius:26px; background:rgba(255,255,255,.42); border:1px solid var(--edge); box-shadow:inset 0 1px 2px rgba(40,26,12,.08); }
  .month-chip{ padding:7px 14px; border-radius:999px; color:var(--ink-2); font-size:12.5px; font-weight:600; cursor:pointer; user-select:none; touch-action:none; transition:color .2s, background-color .2s; }
  .month-chip:hover{ background:rgba(255,255,255,.5); color:var(--ink); }
  .month-chip.on{ color:#fff; background:linear-gradient(180deg, var(--orange-2), var(--orange)); box-shadow:0 6px 14px -6px rgba(242,96,12,.65), inset 0 1px 0 rgba(255,255,255,.45); }
  .month-chip.pop{ animation:chip-pop .4s cubic-bezier(.3,1.4,.5,1); }
  .month-chip.dragging{ opacity:.7; box-shadow:0 10px 22px -6px rgba(40,26,12,.5); position:relative; z-index:2; }
  .month-reset{ padding:7px 12px; border-radius:999px; border:1px dashed rgba(42,36,32,.22); color:var(--ink-2); font-size:11.5px; font-weight:600; cursor:pointer; }
  .month-reset:hover{ color:var(--orange); border-color:var(--orange); }
  /* single-choice groups (VN Supply product/month/region, News ranges and product filter) */
  .seg{ display:inline-flex; flex-wrap:wrap; gap:2px; padding:5px; background:rgba(255,255,255,.42); border:1px solid var(--edge); border-radius:26px; box-shadow:inset 0 1px 2px rgba(40,26,12,.08); }
  .seg > .opt{ cursor:pointer; padding:7px 15px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--ink-2); user-select:none; transition:color .25s; white-space:nowrap; }
  .seg > .opt:hover{ color:var(--ink); }
  .seg > .opt.on, .seg > .opt.on:hover{ color:#fff; }
  .toggle-pill{ cursor:pointer; padding:11px 16px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--ink-2); background:rgba(255,255,255,.42); border:1px solid var(--edge); user-select:none; transition:.2s; }
  .toggle-pill.on{ color:#fff; border-color:transparent; background:linear-gradient(180deg, var(--orange-2), var(--orange)); box-shadow:0 6px 14px -6px rgba(242,96,12,.65), inset 0 1px 0 rgba(255,255,255,.45); }

  /* ---------- history ---------- */
  .history-month-heading{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); margin:20px 4px 8px; }
  .history-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:13px 16px; margin-bottom:6px; cursor:pointer; border-radius:var(--r-md);
    background:rgba(255,255,255,.5); border:1px solid var(--edge); box-shadow:inset 0 1px 0 #fff; transition:.2s; }
  .history-row:hover{ transform:translateY(-1px); background:rgba(255,255,255,.72); box-shadow:inset 0 1px 0 #fff, 0 12px 24px -16px rgba(40,26,12,.5); }
  .history-date{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .history-note{ font-size:12px; color:var(--ink-2); text-align:right; }
  .archive-banner{ background:var(--orange-soft); border:1px solid rgba(242,96,12,.35); color:#b54400; font-size:12.5px; padding:12px 16px; border-radius:var(--r-md); margin-bottom:12px; }
  #historytab input[type="text"], #historytab input[type="date"]{ background:rgba(255,255,255,.74) !important; border:1px solid var(--edge) !important; color:var(--ink) !important; border-radius:999px !important; padding:10px 16px !important; font-weight:600; box-shadow:inset 0 1px 2px rgba(40,26,12,.08); }

let state = JSON.parse(JSON.stringify(defaultState));

function defaultVisibleMonths(){
  const cur = new Date().getMonth(); // 0-11
  const arr = [];
  for (let k = 0; k < 5; k++) arr.push((cur + k) % 12);
  return arr;
}

// All 12 months in Mete's own drag-reordered sequence (state.monthOrder), falling back to plain
// Jan→Dec when he hasn't customized it yet (or the stored array got corrupted somehow — must be a
// permutation of all 12 indices, otherwise ignore it rather than let a table silently drop/duplicate
// a column).
function defaultMonthOrder(){ return Array.from({ length: 12 }, (_, i) => i); }
function monthOrderArr(){
  const o = state.monthOrder;
  if (!Array.isArray(o) || o.length !== 12 || new Set(o).size !== 12) return defaultMonthOrder();
  return o;
}

function visibleMonthIndices(){
  const set = new Set(state.visibleMonths || defaultVisibleMonths());
  // 2026-09-24, Mete: columns now follow his own drag-reordered month sequence (monthOrderArr())
  // instead of always being force-sorted Jan→Dec — that old sort was actively wrong whenever the
  // visible window wrapped year-end (e.g. Sep-Oct-Nov-Dec-Jan): it put Jan back in FRONT of Sep,
  // even though Jan is chronologically the month that comes right after Dec. Dragging Jan to sit
  // after Dec in the filter chips (any of the 4 tabs — they share this one state) now fixes the
  // column order everywhere at once, since every table reads this same function.
  return monthOrderArr().filter(i => set.has(i));
}

function spreadSBM(i){
  const prev = (i - 1 + 12) % 12;
  return state.futuresSBM[prev] - state.futuresSBM[i];
}
function spreadCorn(i){
  const prev = (i - 1 + 12) % 12;
  return state.futuresCorn[prev] - state.futuresCorn[i];
}

function mround(v, m){ return Math.round(v/m)*m; }
function mround10(v){ return Math.round(v * 10) / 10; }

// Formats a raw local-price number: round to the nearest 10, then group
// thousands with a period and append "d" — e.g. 11546 -> "11.550d".
function formatLocalPrice(raw){
  if (raw === null || raw === undefined || Number.isNaN(raw)) return null;
  const rounded = Math.round(raw / 10) * 10;
  return rounded.toLocaleString('de-DE') + 'd';
}

function vnSbmLocalPrice(i){
  const ind = state.indication[i];
  const fut = state.futuresSBM[i];
  const fx = state.fx && state.fx.vietnam ? state.fx.vietnam[i] : null;
  if (ind === null || ind === undefined || fut === null || fut === undefined || fx === null || fx === undefined) return null;
  const raw = (((ind + fut) * 1.1023) + 7) * fx;
  return formatLocalPrice(raw);
}

function vnCornLocalPrice(i){
  const ind = state.cornIndication[i];
  const fut = state.futuresCorn[i];
  const fx = state.fx && state.fx.vietnam ? state.fx.vietnam[i] : null;
  if (ind === null || ind === undefined || fut === null || fut === undefined || fx === null || fx === undefined) return null;
  const raw = (((ind + fut) * 0.39368) + 5.5) * fx;
  return formatLocalPrice(raw);
}

// Vietnam freight: 5M2C, 7C/5C ARG/BRA are manual. Everything else is derived,
// matching the exact formulas in the source file's freight table.
function getVNFreight(key, i){
  const base5M2C = state.freight['5M2C'][i];
  const base5CARG = state.freight['5CARG'][i];
  switch(key){
    case '5M2W': return mround10(base5M2C * 66000 / 68000);
    case '4M1C': return mround10(base5CARG * 59500 / 53000);
    case '3M2C': return mround10(base5CARG * 59500 / 55500);
    case '2M3C': return mround10(base5CARG * 59500 / 55500);
    case '4M3C': return base5M2C * 66000 / 67500;
    case '3M4C': return getVNFreight('4M3C', i) * 67500 / 69000;
    default: return state.freight[key][i];
  }
}

// Malaysia freight: 5M2C, 4M3C, 7C/5C ARG/BRA are manual. 4M1C/3M2C/2M3C derived from 5C ARG.
function getMYFreight(key, i){
  const base5CARG = state.malaysia.freight['5CARG'][i];
  switch(key){
    case '4M1C': return mround10(base5CARG * 59500 / 53000);
    case '3M2C': return mround10(base5CARG * 59500 / 55500);
    case '2M3C': return mround10(base5CARG * 59500 / 55500);
    case '3M4C': return state.malaysia.freight['4M3C'][i] * 67500 / 69000;
    default: return state.malaysia.freight[key][i];
  }
}

// Indonesia freight: 5M2C, 5C ARG, 7M, 5M are manual. 5M2W from 5M2C; 4M1W/4M1C/3M2C/2M3C from 5C ARG.
function getIDFreight(key, i){
  const base5M2C = state.indonesia.freight['5M2C'][i];
  const base5CARG = state.indonesia.freight['5CARG'][i];
  switch(key){
    case '5M2W': return mround10(base5M2C * 66000 / 68000);
    case '4M1W': return mround10(base5CARG * 59500 / 53000);
    case '4M1C': return mround10(base5CARG * 59500 / 53000);
    case '3M2C': return mround10(base5CARG * 59500 / 55500);
    case '2M3C': return mround10(base5CARG * 59500 / 55500);
    default: return state.indonesia.freight[key][i];
  }
}

// --- Corn (independent pure-corn combos) ---
function computeCornCombos(fobIdx, freightGetter, spreadVal){
  const ARG = state.fob.ARGCORN[fobIdx], BRA = state.fob.BRACORN[fobIdx];
  const sp = spreadVal || 0;
  const cfr = (fr, fob) => fr/0.39368 + fob + sp;
  const vals = {
    '7C ARG': mround(cfr(freightGetter('7CARG'), ARG), 0.5),
    '5C ARG': mround(cfr(freightGetter('5CARG'), ARG), 0.5),
    '7C BRA': mround(cfr(freightGetter('7CBRA'), BRA), 0.5),
    '5C BRA': mround(cfr(freightGetter('5CBRA'), BRA), 0.5)
  };
  const replacement = mround(Math.min(...Object.values(vals)), 0.5);
  return { vals, replacement };
}
function computeCorn(i){
  return computeCornCombos(i, key => state.freight[key][i], 0);
}
function computeCornCarry(i){
  const prev = (i - 1 + 12) % 12;
  const spread = spreadCorn(i);
  return computeCornCombos(prev, key => (state.freight[key][i] + state.freight[key][prev]) / 2, spread);
}

// --- SBM combinations ---
function computeCombos(indexedFobIdx, topoffFobIdx, saleIdx, freightGetter, spreadVal, cornSpreadVal){
  const ASBM = state.fob.ASBM[indexedFobIdx];
  const UPR = state.fob.UPRCORN[indexedFobIdx];
  const BBNC = state.fob.BBNCCORN[topoffFobIdx];
  const WHEAT = state.fob.WHEAT[topoffFobIdx];
  const cSaleRaw = state.cornIndication[saleIdx];
  const cSale = (cSaleRaw !== null && cSaleRaw !== undefined) ? cSaleRaw : 224;
  const wSale = state.wheatSale[saleIdx];
  const sp = spreadVal || 0;
  const cSp = cornSpreadVal || 0;

  const cfrSBM = fr => fr/1.1023 + ASBM + sp;      // Spread applies only to the indexed SBM leg
  const cfrCornBBNC = fr => fr/0.39368 + BBNC;     // top-off leg, always current-month FOB, no spread
  const cfrCornUPR = fr => fr/0.39368 + UPR + cSp; // indexed leg — gets corn's own futures spread in carry
  const cfrWheat = fr => fr + WHEAT;               // top-off leg, always current-month FOB, no spread
  const pnlCorn = (sale, cfr, qty) => (sale - cfr) * qty * 0.3937;
  const pnlWheat = (sale, cfr, qty) => (sale - cfr) * qty;

  const F = {
    '5M2C': freightGetter('5M2C'),
    '5M2W': freightGetter('5M2W'),
    '4M1C': freightGetter('4M1C'),
    '3M2C': freightGetter('3M2C'),
    '2M3C': freightGetter('2M3C')
  };

  // 5M2C — SBM 45,000 + BB/NC Corn 21,000
  const cfrSBM_5M2C = cfrSBM(F['5M2C']);
  const pnl_5M2C = pnlCorn(cSale, cfrCornBBNC(F['5M2C']), 21000);
  const final5M2C = cfrSBM_5M2C - pnl_5M2C/1.1023/45000;

  // 5M2W — SBM 45,000 + Wheat top-off 23,000
  const cfrSBM_5M2W = cfrSBM(F['5M2W']);
  const pnl_5M2W = pnlWheat(wSale, cfrWheat(F['5M2W']), 23000);
  const final5M2W = cfrSBM_5M2W - pnl_5M2W/1.1023/45000;

  // 4M3C — freight scaled from 5M2C by tonnage ratio
  const q4M3C = { sbm:36000, upr:9000, bbnc:22500 };
  const tot4M3C = q4M3C.sbm + q4M3C.upr + q4M3C.bbnc; // 67,500
  const F4M3C = F['5M2C'] * (66000 / tot4M3C);
  const cfrSBM_4M3C = cfrSBM(F4M3C);
  const pnlUPR_4M3C = pnlCorn(cSale, cfrCornUPR(F4M3C), q4M3C.upr);
  const pnlBBNC_4M3C = pnlCorn(cSale, cfrCornBBNC(F4M3C), q4M3C.bbnc);
  const final4M3C = cfrSBM_4M3C - (pnlUPR_4M3C + pnlBBNC_4M3C)/1.1023/q4M3C.sbm;

  // 3M4C — freight scaled from 4M3C
  const q3M4C = { sbm:27000, upr:18000, bbnc:24000 };
  const tot3M4C = q3M4C.sbm + q3M4C.upr + q3M4C.bbnc; // 69,000
  const F3M4C = F4M3C * (tot4M3C / tot3M4C);
  const cfrSBM_3M4C = cfrSBM(F3M4C);
  const pnlUPR_3M4C = pnlCorn(cSale, cfrCornUPR(F3M4C), q3M4C.upr);
  const pnlBBNC_3M4C = pnlCorn(cSale, cfrCornBBNC(F3M4C), q3M4C.bbnc);
  const final3M4C = cfrSBM_3M4C - (pnlUPR_3M4C + pnlBBNC_3M4C)/1.1023/q3M4C.sbm;

  // 4M1C — SBM 41,000 + BB/NC Corn top-off 12,000
  const cfrSBM_4M1C = cfrSBM(F['4M1C']);
  const pnl_4M1C = pnlCorn(cSale, cfrCornBBNC(F['4M1C']), 12000);
  const final4M1C = cfrSBM_4M1C - pnl_4M1C/1.1023/41000;

  // 3M2C — SBM 31,500 + UPR Corn 12,000 + BBNC top-off 12,000
  const cfrSBM_3M2C = cfrSBM(F['3M2C']);
  const pnlUPR_3M2C = pnlCorn(cSale, cfrCornUPR(F['3M2C']), 12000);
  const pnlBBNC_3M2C = pnlCorn(cSale, cfrCornBBNC(F['3M2C']), 12000);
  const final3M2C = cfrSBM_3M2C - (pnlUPR_3M2C + pnlBBNC_3M2C)/1.1023/31500;

  // 2M3C — SBM 21,000 + UPR Corn 22,500 + BBNC top-off 12,000
  const cfrSBM_2M3C = cfrSBM(F['2M3C']);
  const pnlUPR_2M3C = pnlCorn(cSale, cfrCornUPR(F['2M3C']), 22500);
  const pnlBBNC_2M3C = pnlCorn(cSale, cfrCornBBNC(F['2M3C']), 12000);
  const final2M3C = cfrSBM_2M3C - (pnlUPR_2M3C + pnlBBNC_2M3C)/1.1023/21000;

  const vals = {
    '5M2C': mround(final5M2C, 0.5),
    '5M2W': mround(final5M2W, 0.5),
    '4M3C': mround(final4M3C, 0.5),
    '3M4C': mround(final3M4C, 0.5),
    '4M1C': mround(final4M1C, 0.5),
    '3M2C': mround(final3M2C, 0.5),
    '2M3C': mround(final2M3C, 0.5)
  };
  const mainFour = ['5M2C','5M2W','4M3C','3M4C'];
  const replacement = mround(Math.min(...mainFour.map(k => vals[k])), 0.5);
  return { vals, replacement };
}

function computeMonth(i){
  return computeCombos(i, i, i, key => getVNFreight(key, i), 0, 0);
}

  const prev = (i - 1 + 12) % 12;

}

// --- Malaysia: same FOB/Futures as Vietnam, own freight table, no wheat combo ---
function computeMYCombos(indexedFobIdx, topoffFobIdx, saleIdx, freightGetter, spreadVal, cornSpreadVal){
  const ASBM = state.fob.ASBM[indexedFobIdx];

  const pnlUPR_4M3C = pnlCorn(cSale, cfrCornUPR(F4M3C), q4M3C.upr);
  const pnlBBNC_4M3C = pnlCorn(cSale, cfrCornBBNC(F4M3C), q4M3C.bbnc);
  const final4M3C = cfrSBM_4M3C - (pnlUPR_4M3C + pnlBBNC_4M3C)/1.1023/q4M3C.sbm;

  // 3M4C — freight scaled from 4M3C (Malaysia has no direct 3M4C freight entry)
  const q3M4C = { sbm:27000, upr:18000, bbnc:24000 };
  const tot3M4C = q3M4C.sbm + q3M4C.upr + q3M4C.bbnc; // 69,000

  const pnlUPR_3M2C = pnlCorn(cSale, cfrCornUPR(F3M2C), 12000);

// --- Indonesia: shares FOB/Futures with Vietnam, own freight table.
// Corn sale = Vietnam's Corn Sale Price + $3 (source-file link). Wheat sale = Vietnam's directly.
// Indonesia's Corn Sale Price defaults to Vietnam's corn indication + 3 for any
// month left blank in the Input tab; a manually typed value overrides it.
function indonesiaCornSaleDefault(i){
  const v = state.cornIndication[i];
  return (v === null || v === undefined) ? null : v + 3;
}
function effectiveIndonesiaCornSale(i){
  const manual = state.indonesia.cornSale[i];
  return (manual !== null && manual !== undefined) ? manual : indonesiaCornSaleDefault(i);
}

function computeIDCombos(indexedFobIdx, topoffFobIdx, saleIdx, freightGetter, spreadVal, cornSpreadVal){
  const ASBM = state.fob.ASBM[indexedFobIdx];
  const BRZSBMP = state.fob.BRZSBMP[indexedFobIdx];
  const UPR = state.fob.UPRCORN[indexedFobIdx];
  const BBNC = state.fob.BBNCCORN[topoffFobIdx];
  const WHEAT = state.fob.WHEAT[topoffFobIdx];
  const cSale = effectiveIndonesiaCornSale(saleIdx);
  const wSale = state.indonesia.wheatSale[saleIdx];
  const sp = spreadVal || 0;
  const cSp = cornSpreadVal || 0;

  const cfrSBM = fr => fr/1.1023 + ASBM + sp;
  const cfrCornBBNC = fr => fr/0.39368 + BBNC;
  const cfrCornUPR = fr => fr/0.39368 + UPR + cSp;
  const cfrWheat = fr => fr + WHEAT;
  const pnlCorn = (sale, cfr, qty) => (sale - cfr) * qty * 0.3937;
  const pnlWheat = (sale, cfr, qty) => (sale - cfr) * qty;

  const F5M2C = freightGetter('5M2C');
  const F5M2W = freightGetter('5M2W');
  const F4M1W = freightGetter('4M1W');
  const F4M1C = freightGetter('4M1C');
  const F3M2C = freightGetter('3M2C');
  const F2M3C = freightGetter('2M3C');
  const F7M = freightGetter('7M');
  const F5M = freightGetter('5M');

  // 5M2C — SBM 45,000 + BB/NC Corn 21,000
  const cfrSBM_5M2C = cfrSBM(F5M2C);
  const pnl_5M2C = pnlCorn(cSale, cfrCornBBNC(F5M2C), 21000);
  const final5M2C = cfrSBM_5M2C - pnl_5M2C/1.1023/45000;

  // 5M2W — SBM 45,000 + Wheat top-off 23,000
  const cfrSBM_5M2W = cfrSBM(F5M2W);
  const pnl_5M2W = pnlWheat(wSale, cfrWheat(F5M2W), 23000);
  const final5M2W = cfrSBM_5M2W - pnl_5M2W/1.1023/45000;

  // 4M1W — SBM 41,000 + Wheat top-off 12,000
  const cfrSBM_4M1W = cfrSBM(F4M1W);
  const pnl_4M1W = pnlWheat(wSale, cfrWheat(F4M1W), 12000);
  const final4M1W = cfrSBM_4M1W - pnl_4M1W/1.1023/41000;

  // 4M1C — SBM 41,000 + BB/NC Corn top-off 12,000
  const cfrSBM_4M1C = cfrSBM(F4M1C);
  const pnl_4M1C = pnlCorn(cSale, cfrCornBBNC(F4M1C), 12000);
  const final4M1C = cfrSBM_4M1C - pnl_4M1C/1.1023/41000;

  // 3M2C — SBM 31,500 + UPR Corn 12,000 + BBNC top-off 12,000
  const cfrSBM_3M2C = cfrSBM(F3M2C);
  const pnlUPR_3M2C = pnlCorn(cSale, cfrCornUPR(F3M2C), 12000);
  const pnlBBNC_3M2C = pnlCorn(cSale, cfrCornBBNC(F3M2C), 12000);
  const final3M2C = cfrSBM_3M2C - (pnlUPR_3M2C + pnlBBNC_3M2C)/1.1023/31500;

  // 2M3C — SBM 21,000 + UPR Corn 22,500 + BBNC top-off 12,000
  const cfrSBM_2M3C = cfrSBM(F2M3C);
  const pnlUPR_2M3C = pnlCorn(cSale, cfrCornUPR(F2M3C), 22500);
  const pnlBBNC_2M3C = pnlCorn(cSale, cfrCornBBNC(F2M3C), 12000);
  const final2M3C = cfrSBM_2M3C - (pnlUPR_2M3C + pnlBBNC_2M3C)/1.1023/21000;

  // 7M — full cargo, BRA SBM only, 63,000t. FOB = BRZ SBMP + 25 - 13 (fixed route adjustment)
  const final7M = F7M/1.1023 + (BRZSBMP + 25 - 13) + sp;

  // 5M — full cargo, ARG SBM only, 47,000t. FOB = ASBM directly
  const final5M = F5M/1.1023 + ASBM + sp;

  const vals = {
    '5M2C': mround(final5M2C, 0.5),
    '5M2W': mround(final5M2W, 0.5),
    '4M1W': mround(final4M1W, 0.5),
    '4M1C': mround(final4M1C, 0.5),
    '3M2C': mround(final3M2C, 0.5),
    '2M3C': mround(final2M3C, 0.5),
    '7M': mround(final7M, 0.5),
    '5M': mround(final5M, 0.5)
  };
  // Indonesia's Replacement excludes 2M3C (matches the source Dashboard logic)
  const mainSeven = ['5M2C','5M2W','4M1W','4M1C','3M2C','7M','5M'];
  const replacement = mround(Math.min(...mainSeven.map(k => vals[k])), 0.5);
  return { vals, replacement };
}

  const prev = (i - 1 + 12) % 12;

function deepMergeDefaults(target, defaults){
  if (typeof defaults !== 'object' || defaults === null || Array.isArray(defaults)) return;
  for (const key in defaults){
    if (!(key in target) || target[key] === null || target[key] === undefined){
      target[key] = JSON.parse(JSON.stringify(defaults[key]));
    } else if (
      typeof defaults[key] === 'object' && defaults[key] !== null && !Array.isArray(defaults[key]) &&
      typeof target[key] === 'object' && target[key] !== null && !Array.isArray(target[key])
    ){
      deepMergeDefaults(target[key], defaults[key]);
    }
  }
}

function migrateLegacyBalToSell(){
  // Earlier versions had one shared "balToSell" array per destination used by
  // both SBM and Corn tables. Move that data into balToSellSBM so it isn't lost,
  // then drop the old key — SBM and Corn now track independent balances.
  if (state.balToSell){
    if (!state.balToSellSBM) state.balToSellSBM = state.balToSell;
    delete state.balToSell;
  }
  if (state.malaysia && state.malaysia.balToSell){
    if (!state.malaysia.balToSellSBM) state.malaysia.balToSellSBM = state.malaysia.balToSell;
    delete state.malaysia.balToSell;
  }
  if (state.indonesia && state.indonesia.balToSell){
    if (!state.indonesia.balToSellSBM) state.indonesia.balToSellSBM = state.indonesia.balToSell;
    delete state.indonesia.balToSell;
  }
}

function ensureDestinations(){
  migrateLegacyBalToSell();
  deepMergeDefaults(state, defaultState);
}

function setLiveStatus(status){
  // status: 'online' | 'offline' | 'error'
  const dot = document.getElementById('liveDot');
  const wrap = document.getElementById('liveIndicator');
  if (!dot || !wrap) return;
  dot.classList.remove('online', 'offline', 'error');
  dot.classList.add(status);
  const labels = { online: 'Online — synced', offline: 'Offline — no network', error: 'No connection — check network' };
  wrap.title = labels[status] || '';
}

window.addEventListener('offline', () => setLiveStatus('offline'));
window.addEventListener('online', () => setLiveStatus('online'));

function showOfflineBanner(){
  if (document.getElementById('offlineBanner')) return;
  const banner = document.createElement('div');
  banner.id = 'offlineBanner';
  banner.style.cssText = 'background:rgba(255,236,232,.86); color:#8f251d; font-size:12.5px; font-weight:600; padding:10px 18px; text-align:center; border:1px solid rgba(224,70,60,.4);';
  banner.textContent = 'Could not connect — showing local data only. Changes may not save until you reconnect.';
  document.body.insertBefore(banner, document.body.firstChild);
}

function hideOfflineBanner(){
  const el = document.getElementById('offlineBanner');
  if (el) el.remove();
}

// True while the user is actively typing in a field, so a live update from
// another device doesn't yank the table out from under their cursor.
function isEditingNow(){
  const el = document.activeElement;
  const mainEl = document.querySelector('main');
  return !!(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') && mainEl && mainEl.contains(el));
}

let pendingRemoteData = undefined; // holds a snapshot's data while the user is mid-edit

function applyRemoteState(data){
  if (data && data.json){
    try{ state = JSON.parse(data.json); }catch(e){ console.error('parse failed', e); return; }
  }
  if (!state.visibleMonths || !state.visibleMonths.length) state.visibleMonths = defaultVisibleMonths();
  ensureDestinations();
  renderAll();
}

// Once the user finishes editing (blurs the field), apply any live update
// that arrived while they were typing.
document.addEventListener('focusout', () => {
  setTimeout(() => {
    if (pendingRemoteData !== undefined && !isEditingNow()){
      const data = pendingRemoteData;
      pendingRemoteData = undefined;
      applyRemoteState(data);
    }
  }, 60);
});

let unsubscribeMainDoc = null;

function loadState(){
  return waitForAuth().then(authResult => {
    const connected = authResult && authResult !== 'timeout';
    if (!connected){
      if (!state.visibleMonths || !state.visibleMonths.length) state.visibleMonths = defaultVisibleMonths();
      ensureDestinations();
      renderAll();
      showOfflineBanner();
      setLiveStatus(navigator.onLine ? 'error' : 'offline');
      return;
    }

    let gotFirstSnapshot = false;
    const initialTimeout = setTimeout(() => {
      if (!gotFirstSnapshot){
        if (!state.visibleMonths || !state.visibleMonths.length) state.visibleMonths = defaultVisibleMonths();
        ensureDestinations();
        renderAll();
        showOfflineBanner();
        setLiveStatus(navigator.onLine ? 'error' : 'offline');
      }
    }, 6000);

    unsubscribeMainDoc = onSnapshot(
      DOC_REF,
      { includeMetadataChanges: true },
      (snap) => {
        // Our own optimistic write echoing back before server confirms — state
        // already reflects it locally, nothing new to apply.
        if (snap.metadata.hasPendingWrites){
          setLiveStatus('online');
          return;
        }
        clearTimeout(initialTimeout);
        hideOfflineBanner();
        const data = snap.exists() ? snap.data() : null;
        if (!gotFirstSnapshot){
          gotFirstSnapshot = true;
          applyRemoteState(data);
        } else if (isEditingNow()){
          pendingRemoteData = data; // apply once the user blurs the field
        } else {
          applyRemoteState(data);
        }
        setLiveStatus('online');
      },
      (err) => {
        console.error('snapshot error', err);
        clearTimeout(initialTimeout);
        setLiveStatus(navigator.onLine ? 'error' : 'offline');
        if (!gotFirstSnapshot){
          gotFirstSnapshot = true;
          if (!state.visibleMonths || !state.visibleMonths.length) state.visibleMonths = defaultVisibleMonths();
          ensureDestinations();
          renderAll();
          showOfflineBanner();
        }
      }
    );
  });
}

let saveTimeout;
function scheduleSave(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try{
      await setDoc(DOC_REF, { json: JSON.stringify(state), updatedAt: new Date().toISOString() });
      setLiveStatus('online');
      hideOfflineBanner();
      const pill = document.getElementById('savePill');
      pill.classList.add('show');
      setTimeout(()=>pill.classList.remove('show'), 1200);
    }catch(e){
      console.error('save failed', e);
      setLiveStatus(navigator.onLine ? 'error' : 'offline');
      const pill = document.getElementById('savePill');
      pill.textContent = 'Save failed — check connection';
      pill.style.color = 'var(--bad)';
      pill.classList.add('show');
      setTimeout(()=>{ pill.classList.remove('show'); pill.textContent='Saved'; pill.style.color=''; }, 2500);
    }
  }, 400);
}

function numInput(value, onChange, extraClass){
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.inputMode = 'decimal';
  inp.autocomplete = 'off';
  inp.autocapitalize = 'off';
  inp.spellcheck = false;
  inp.className = 'cell' + (extraClass ? ' ' + extraClass : '');
  inp.value = (value === null || value === undefined) ? '' : value;
  inp.addEventListener('change', e => {
    const raw = e.target.value.replace(',', '.').trim();
    let v = null;
    if (raw !== '' && raw !== '-'){
      const parsed = parseFloat(raw);
      v = Number.isNaN(parsed) ? null : parsed;
    }
    onChange(v);
    scheduleSave();
    renderAll();
  });
  return inp;
}

function balColor(v){
  if (v === null || v === undefined || v === '') return '';
  if (v < 0) return 'var(--bad)';
  if (v > 0) return 'var(--good)';
  return '';
}

// ── Liquid-glass theme helpers (2026-10-02) ─────────────────────────────────────────────────────
// Liquid selection: every single-choice group (top tabs, VN Supply product/month/region, News
// ranges/product filter/tiles, the edit dialog's direction) marks its container with data-liq="key".
// liquidAll() then draws ONE orange drop under the selected child. Most of these groups are torn
// down and rebuilt on every click (renderNewsBody / renderVnSupplyTab …), so the drop's last
// position is remembered per key in LIQ_POS: the freshly built group starts its drop where the old
// one was and lets it slide + squash/stretch to the new choice. Selected child = .on or .active.
const LIQ_POS = {};
function liquidAll(root){
  if (!root) return;
  const hosts = (root.matches && root.matches('[data-liq]')) ? [root] : [];
  root.querySelectorAll('[data-liq]').forEach(h => hosts.push(h));
  hosts.forEach(host => {
    host.querySelectorAll(':scope > .glider').forEach(g => g.remove());
    const on = host.querySelector(':scope > .on, :scope > .active');
    if (!on || !on.offsetWidth) return;                     // nothing picked, or the group is hidden
    const key = host.dataset.liq;
    const to = { l: on.offsetLeft, t: on.offsetTop, w: on.offsetWidth, h: on.offsetHeight };
    const g = document.createElement('div');
    g.className = 'glider' + (host.dataset.liqRing ? ' ring' : '');
    host.prepend(g);
    const put = p => Object.assign(g.style, { left: p.l + 'px', top: p.t + 'px', width: p.w + 'px', height: p.h + 'px' });
    const from = LIQ_POS[key];
    if (from && (from.l !== to.l || from.t !== to.t)){
      put(from); void g.offsetWidth;
      g.classList.add('move', Math.abs(to.l - from.l) >= Math.abs(to.t - from.t) ? 'h' : 'v', 'go');
      put(to);
    } else put(to);
    LIQ_POS[key] = to;
  });
}
// a resize moves everything: forget remembered positions so drops re-seat instantly instead of sliding
let liqResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(liqResizeTimer);
  liqResizeTimer = setTimeout(() => {
    Object.keys(LIQ_POS).forEach(k => delete LIQ_POS[k]);
    liquidAll(document.body);
    const nt = document.getElementById('newstab');
    if (nt && nt.classList.contains('active') && typeof newsDocs !== 'undefined' && newsDocs.length) renderNewsBody();
  }, 180);
});

function renderComboTable(el, opts){
  const { title, combos, labels, mainFour, computeFn, cfrArr, indArr, balArr, avgArr, localPriceFn, noteHtml } = opts;
  const visible = visibleMonthIndices();

  el.appendChild(sectionTitle(title));
  const wrap = document.createElement('div');
  wrap.className = 'scrollx';
  const table = document.createElement('table');
  table.className = 'grid-table results-table';

  const thead = document.createElement('tr');
  thead.innerHTML = '<th class="rowlabel">Month</th>' +
    combos.map(c => `<th>${labels ? labels[c] : c}</th>`).join('') +
    '<th>Replcmt.</th><th>CFR Mkt.</th><th>Indic.</th><th>vs Replcmt.</th>' +
    (localPriceFn ? '<th>Local Price</th>' : '') +
    (balArr ? '<th>Current Balance</th>' : '') +
    (avgArr ? '<th>Ave. Booked Price</th>' : '');
  table.appendChild(thead);

  visible.forEach(i => {
    const tr = document.createElement('tr');
    const { vals, replacement } = computeFn(i);
    const bestVal = Math.min(...mainFour.map(k => vals[k]));

    let html = `<td class="rowlabel">${MONTHS_FULL[i]}</td>`;
    combos.forEach(c => {
      const isBest = mainFour.includes(c) && vals[c] === bestVal;
      html += `<td class="combo${isBest ? ' best' : ''}">${vals[c].toFixed(1)}</td>`;
    });
    html += `<td class="repl">${replacement.toFixed(1)}</td>`;
    tr.innerHTML = html;

    const tdCfr = document.createElement('td');
    tdCfr.appendChild(numInput(cfrArr[i], v => { cfrArr[i] = v; }));
    tr.appendChild(tdCfr);

    const tdIndic = document.createElement('td');
    tdIndic.appendChild(numInput(indArr[i], v => { indArr[i] = v; }, 'cell-indic'));
    tr.appendChild(tdIndic);

    const indic = indArr[i];
    const tdDelta = document.createElement('td');
    if (indic !== null && indic !== undefined){
      const delta = indic - replacement;
      tdDelta.className = delta >= 0 ? 'delta-pos' : 'delta-neg';
      tdDelta.textContent = (delta > 0 ? '+' : '') + delta.toFixed(1);
    } else {
      tdDelta.textContent = '—';
    }
    tr.appendChild(tdDelta);

    if (localPriceFn){
      const tdLocal = document.createElement('td');
      tdLocal.className = 'combo';
      const formatted = localPriceFn(i);
      tdLocal.textContent = formatted !== null ? formatted : '—';
      tr.appendChild(tdLocal);
    }

    if (balArr){
      const tdBal = document.createElement('td');
      const balInp = numInput(balArr[i], v => { balArr[i] = v; });
      balInp.style.color = balColor(balArr[i]);
      tdBal.appendChild(balInp);
      tr.appendChild(tdBal);
    }

    if (avgArr){
      const tdAvg = document.createElement('td');
      tdAvg.appendChild(numInput(avgArr[i], v => { avgArr[i] = v; }));
      tr.appendChild(tdAvg);
    }

    table.appendChild(tr);
  });

  wrap.appendChild(table);
  el.appendChild(wrap);

  if (noteHtml){
    const note = document.createElement('div');
    note.className = 'note';
    note.innerHTML = noteHtml;
    el.appendChild(note);
  }
}

// Press-hold + drag a month chip left/right to reorder it (2026-09-24, Mete's request — "Jan'ı
// basılı tutup Dec'in sağına atabileyim, takip eden ayı doğru sırada görmek için", works the same
// with mouse left-click-drag on desktop and touch press-hold-drag on mobile). Pointer Events unify
// both input types, so one handler covers all of it. A plain tap/click with no real movement still
// falls through to `onTap` (the existing on/off toggle) exactly as before — MONTH_DRAG_THRESHOLD_PX
// is what tells "tap" and "drag" apart. Dragging only ever reorders the chips (writes
// state.monthOrder, shared by all 4 callers — Input/Vietnam/Malaysia/Indonesia all read the same
// state) — it never changes which months are on/off.
//
// 2026-09-24 FOLLOW-UP FIX (same day, Mete: "surukle tasi birak biraz zor calisiyor cok smooth
// degil"): the first version attached pointermove/pointerup listeners to the CHIP itself and leaned
// on setPointerCapture() to keep receiving events once the finger/cursor moved off it. Reproduced
// live on the site (Chrome DevTools drag simulation, then confirmed with an isolated test rig):
// moving the chip mid-drag via wrap.insertBefore() — the exact thing every reorder does — silently
// broke that capture. The chip would take ONE step, get stuck with the "dragging" (dimmed) look
// forever, and never receive pointerup, so the reorder never committed. That's the "zor çalışıyor"
// Mete hit. Fix: listen on `window` instead of the chip — window-level listeners get every
// pointermove/pointerup regardless of capture, so a drag can never strand a chip again (capture is
// still requested, best-effort, just no longer load-bearing). Also FLIP-animates the chips that get
// pushed aside (150ms slide instead of an instant snap) so the reorder reads as smooth, not jumpy —
// the "smooth değil" half of the same report.
const MONTH_DRAG_THRESHOLD_PX = 6;
function attachMonthDrag(chip, wrap, onTap, onReorder){
  let startX = 0, startY = 0, dragging = false, pointerId = null;

  // elementsFromPoint() is a pure geometry query — independent of pointer capture/event targeting —
  // so it keeps reporting whichever chip is actually under the finger/cursor at all times.
  const chipUnderPoint = (x, y) => document.elementsFromPoint(x, y)
    .find(n => n !== chip && n.classList && n.classList.contains('month-chip')) || null;

  // FLIP (First-Last-Invert-Play): record every chip's position before the reorder, move the DOM
  // node, then for every chip that shifted, snap it back to where it visually was via a transform
  // and let it transition to the new spot — a 150ms slide instead of an instant jump.
  const reorderTo = (target, before) => {
    const siblings = Array.from(wrap.querySelectorAll('.month-chip'));
    const firstRects = new Map(siblings.map(c => [c, c.getBoundingClientRect()]));
    wrap.insertBefore(chip, before ? target : target.nextSibling);
    siblings.forEach(c => {
      if (c === chip) return; // the dragged chip already tracks the pointer directly
      const first = firstRects.get(c);
      const last = c.getBoundingClientRect();
      const dx = first.left - last.left, dy = first.top - last.top;
      if (!dx && !dy) return;
      c.style.transition = 'none';
      c.style.transform = `translate(${dx}px, ${dy}px)`;
      requestAnimationFrame(() => {
        c.style.transition = 'transform 150ms ease';
        c.style.transform = '';
      });
    });
  };

  // Reorder checks are throttled to one per animation frame — pointermove can fire far faster than
  // 60fps on a trackpad or a high-report-rate touchscreen, and running elementsFromPoint()+layout on
  // every single event (the old behavior) was the other half of the "not smooth" feel.
  let lastX = 0, lastY = 0, rafPending = false;
  const applyPendingMove = () => {
    rafPending = false;
    const target = chipUnderPoint(lastX, lastY);
    if (target && target.parentNode === wrap){
      const rect = target.getBoundingClientRect();
      reorderTo(target, lastX < rect.left + rect.width / 2);
    }
  };

  const onMove = (e) => {
    if (e.pointerId !== pointerId) return;
    lastX = e.clientX; lastY = e.clientY;
    if (!dragging){
      if (Math.abs(lastX - startX) < MONTH_DRAG_THRESHOLD_PX && Math.abs(lastY - startY) < MONTH_DRAG_THRESHOLD_PX) return;
      dragging = true;
      chip.classList.add('dragging');
    }
    e.preventDefault();
    if (!rafPending){ rafPending = true; requestAnimationFrame(applyPendingMove); }
  };

  const cleanup = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    chip.classList.remove('dragging');
    try{ if (pointerId !== null) chip.releasePointerCapture(pointerId); }catch(err){ /* already released */ }
  };

  function onUp(e){
    if (e.pointerId !== pointerId) return;
    const wasDragging = dragging;
    cleanup();
    dragging = false; pointerId = null;
    if (wasDragging){
      // Commit the DOM order the drag left behind into state.monthOrder, then let every table
      // that reads it (visibleMonthIndices(), used by all 4 tabs) catch up via a normal renderAll().
      state.monthOrder = Array.from(wrap.querySelectorAll('.month-chip')).map(c => parseInt(c.dataset.month, 10));
      scheduleSave();
      renderAll();
      // 2026-10-02: History's archived-snapshot view shares the same month order (see
      // renderArchiveMonthFilter) — it isn't part of renderAll(), so it passes its own re-render.
      if (onReorder) onReorder();
    } else {
      onTap();
    }
  }

  chip.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return; // left click only on desktop
    pointerId = e.pointerId;
    startX = e.clientX; startY = e.clientY; lastX = startX; lastY = startY;
    dragging = false;
    // Best-effort only now — see the 2026-09-24 note above for why event delivery below no longer
    // depends on this succeeding.
    try{ chip.setPointerCapture(pointerId); }catch(err){ /* fine without it, window listeners cover it */ }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  });
}

        set.add(i);

      state.visibleMonths = Array.from(set);

  el.appendChild(wrap);
}

// ---------- History / Daily Log Archive ----------

function todayDateKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatDateKeyLong(dateKey){
  const [y, m, d] = dateKey.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
// Same as escapeHtml() but also escapes double quotes, so the result is safe to drop straight into
// a quoted HTML/SVG attribute (href="...", not just text content) — used by the chart's per-headline
// marker dots (2026-09-23) to build clickable <a href="..."> links from story URLs.
function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;'); }

async function logTodaySnapshot(){
  const noteInput = document.getElementById('historyNoteInput');
  const note = noteInput ? noteInput.value.trim() : '';
  const key = todayDateKey();
  const btn = document.getElementById('logTodayBtn');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try{
    // The day's market-news reading travels with the snapshot (news docs themselves are pruned after 10 days).
    let newsBlock = null;
    try{ await subscribeNews(); newsBlock = newsDocs.length ? buildNewsSnapshot() : null; }catch(e){ console.error('news snapshot skipped', e); }
    await setDoc(doc(LOGS_COLLECTION, key), {
      json: JSON.stringify(state),
      loggedAt: new Date().toISOString(),
      note: note || '',
      news: newsBlock
    });
    btn.textContent = 'Saved ✓';
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
    loadHistoryList();
  }catch(e){
    console.error('log save failed', e);
    btn.textContent = 'Failed — retry';
    btn.disabled = false;
    setTimeout(() => { btn.textContent = original; }, 2500);
  }
}

let historyDatesCache = [];

async function loadHistoryList(){
  const listEl = document.getElementById('historyList');
  if (!listEl) return;
  listEl.innerHTML = '<div class="note">Loading…</div>';
  try{
    const q = query(LOGS_COLLECTION, orderBy('loggedAt', 'desc'));
    const snap = await getDocs(q);
    historyDatesCache = [];
    snap.forEach(d => {
      const data = d.data();
      historyDatesCache.push({ key: d.id, note: data.note || '', loggedAt: data.loggedAt });
    });
    renderHistoryList();
  }catch(e){
    console.error('history list load failed', e);
    listEl.innerHTML = '<div class="note">Could not load history. Check your connection.</div>';
  }
}

function renderHistoryList(){
  const listEl = document.getElementById('historyList');
  if (!listEl) return;
  if (!historyDatesCache.length){
    listEl.innerHTML = '<div class="note">No snapshots logged yet. Use "Log Today\'s Snapshot" above to start building your archive.</div>';
    return;
  }
  listEl.innerHTML = '';
  let lastMonth = null;
  historyDatesCache.forEach(entry => {
    const [y, m] = entry.key.split('-');
    const monthLabel = `${MONTHS_FULL[parseInt(m, 10) - 1]} ${y}`;
    if (monthLabel !== lastMonth){
      lastMonth = monthLabel;
      const h = document.createElement('div');
      h.className = 'history-month-heading';
      h.textContent = monthLabel;
      listEl.appendChild(h);
    }
    const row = document.createElement('div');
    row.className = 'history-row';
    row.innerHTML = `<span class="history-date">${formatDateKeyLong(entry.key)}</span>` +
      (entry.note ? `<span class="history-note">${escapeHtml(entry.note)}</span>` : '');
    row.addEventListener('click', () => openHistoryDate(entry.key));
    listEl.appendChild(row);
  });
}

function jumpToNearestDate(pickedDateStr){
  if (!historyDatesCache.length){
    alert('No snapshots logged yet.');
    return;
  }
  const pickedTime = new Date(pickedDateStr).getTime();
  let best = historyDatesCache[0].key;
  let bestDiff = Infinity;
  historyDatesCache.forEach(e => {
    const diff = Math.abs(new Date(e.key).getTime() - pickedTime);
    if (diff < bestDiff){ bestDiff = diff; best = e.key; }
  });
  openHistoryDate(best);
}

let currentArchiveState = null;
let currentArchiveDateKey = null;
let currentArchiveNote = '';
let currentArchiveNews = null;
let historyVisibleMonths = [];
let previousArchiveState = null;
let previousArchiveDateKey = null;

function findPreviousLoggedDateKey(dateKey){
  // historyDatesCache entries are date-key strings like "2026-07-20", sortable as text.
  const older = historyDatesCache
    .map(e => e.key)
    .filter(k => k < dateKey)
    .sort()
    .reverse();
  return older.length ? older[0] : null;
}

async function openHistoryDate(dateKey){
  const detail = document.getElementById('historyDetail');
  const listWrap = document.getElementById('historyListWrap');
  detail.innerHTML = '<div class="note">Loading archived snapshot…</div>';
  detail.style.display = 'block';
  listWrap.style.display = 'none';
  try{
    const snap = await getDoc(doc(LOGS_COLLECTION, dateKey));
    if (!snap.exists()){
      detail.innerHTML = '<div class="note">This snapshot could not be found.</div>';
      return;
    }
    const data = snap.data();
    const archivedState = JSON.parse(data.json);
    currentArchiveState = archivedState;
    currentArchiveDateKey = dateKey;
    currentArchiveNote = data.note || '';
    currentArchiveNews = data.news || null;
    historyVisibleMonths = (archivedState.visibleMonths && archivedState.visibleMonths.length)
      ? [...archivedState.visibleMonths]
      : defaultVisibleMonths();

    // Fetch the previous logged snapshot (whatever the last log before this one
    // was — not necessarily literally the calendar day before) for the (+/-) deltas.
    previousArchiveState = null;
    previousArchiveDateKey = findPreviousLoggedDateKey(dateKey);
    if (previousArchiveDateKey){
      try{
        const prevSnap = await getDoc(doc(LOGS_COLLECTION, previousArchiveDateKey));
        if (prevSnap.exists()){
          previousArchiveState = JSON.parse(prevSnap.data().json);
        }
      }catch(e){
        console.error('previous snapshot load failed', e);
      }
    }

    renderArchiveDetail(detail);
  }catch(e){
    console.error('open history date failed', e);
    detail.innerHTML = '<div class="note">Could not load this snapshot. Check your connection.</div>';
  }
}

function closeHistoryDetail(){
  document.getElementById('historyDetail').style.display = 'none';
  document.getElementById('historyListWrap').style.display = 'block';
  currentArchiveState = null;
  currentArchiveDateKey = null;
  previousArchiveState = null;
  previousArchiveDateKey = null;
}

function buildReadOnlyTable(rows, getVal, monthsList, getPrevVal){
  // Columns follow the shared drag-reordered month sequence (2026-10-02), same as the live tabs.
  const monthSet = new Set(monthsList || historyVisibleMonths || Array.from({ length: 12 }, (_, i) => i));
  const months = monthOrderArr().filter(i => monthSet.has(i));
  const wrap = document.createElement('div');
  wrap.className = 'scrollx';
  const table = document.createElement('table');
  table.className = 'grid-table wide';

  const thead = document.createElement('tr');
  thead.innerHTML = '<th class="rowlabel"></th>' + months.map(i => `<th>${MONTHS_FULL[i]}</th>`).join('');
  table.appendChild(thead);

  rows.forEach(([label, key]) => {
    const tr = document.createElement('tr');
    let html = `<td class="rowlabel">${label}</td>`;
    months.forEach(i => {
      const v = getVal(key, i);
      const vText = (v === null || v === undefined || v === '') ? '—' : v;
      let deltaHtml = '';
      if (getPrevVal){
        const prev = getPrevVal(key, i);
        if (typeof v === 'number' && typeof prev === 'number'){
          const delta = v - prev;
          if (Math.abs(delta) >= 0.05){
            const cls = delta > 0 ? 'pos' : 'neg';
            const sign = delta > 0 ? '+' : '';
            deltaHtml = ` <span class="delta-inline ${cls}">(${sign}${delta.toFixed(1)})</span>`;
          }
        }
      }
      html += `<td style="font-family:var(--mono); color:var(--text-dim);">${vText}${deltaHtml}</td>`;
    });
    tr.innerHTML = html;
    table.appendChild(tr);
  });

  wrap.appendChild(table);
  return wrap;
}

// ── VN Supply "Overview" tab (2026-09-28) ───────────────────────────────
// Mirrors the Excel workbook's "Overview" sheet 1:1: a product/month/region chip selector drives
// an Arrived-only monthly bar chart with an average reference line, a selected/previous/average
// comparison box, an origin donut (top 4 + "Diger"), a top-5-buyer list, and a 9-product snapshot
// table with sparklines. Re-importing the Excel file (via the button at the bottom of this tab)
// re-reads the raw Dashboard / Arr Data / Lineup SUM sheets and rebuilds state.vnSupply from
// scratch, so it always reflects Mete's latest workbook rather than a hand-maintained snapshot.
let vnSupplyUI = { cargo: 'Corn', month: null, region: 'All' };

// ---- data accessors ------------------------------------------------------
function vnSupplyData(){ return (state.vnSupply && Array.isArray(state.vnSupply.cargoes)) ? state.vnSupply : defaultState.vnSupply; }
function vnSupplyCargoRow(name){ return vnSupplyData().cargoes.find(c => c.name === name); }
function vnSupplyMonths(){ return vnSupplyData().months; }
function vnSupplyCutoffMonthIdx(){
  const vs = vnSupplyData();
  return vs.months.indexOf((vs.asOf || '').slice(0, 7));
}

function fmtVnsMT(n){ return Math.round(n || 0).toLocaleString('en-US'); }
function fmtVnsK(n){ return (Math.round((n || 0) / 100) / 10).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + 'k'; }
function formatDDMMYYYY(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  return m ? `${m[3]}-${m[2]}-${m[1]}` : (iso || '—');
}

// region: 'All' | 'North' | 'South'. Arrived-only (Dashboard/Excel's "Arrived" row), never on-the-way.
function vnSupplyArrivedSeries(cargoName, region){
  const row = vnSupplyCargoRow(cargoName);
  if (!row) return Array(12).fill(0);
  if (region === 'North') return row.arrivedNorth.slice();
  if (region === 'South') return row.arrivedSouth.slice();
  return row.arrivedNorth.map((v, i) => (v || 0) + (row.arrivedSouth[i] || 0));
}

// The report's cutoff month is only partially through (NOR cutoff falls mid-month), so its raw
// Arrived figure understates real supply. For the *monthly average* baseline only, that one month
// is topped up with the same Arrived+On-the-way logic the Dashboard sheet uses (Lineup SUM bookings
// that haven't reached Arr Data yet, plus Arr Data's own not-yet-arrived rows already flagged
// "Scheduled -> On the way" or carrying a not-yet-allocated balance). The Lineup SUM component has
// no Region field, so — same as Dashboard — it's added unfiltered regardless of the Region toggle.
function vnSupplyBoostedCutoffMonthVal(cargoName, region){
  const cutoffIdx = vnSupplyCutoffMonthIdx();
  if (cutoffIdx < 0) return 0;
  return (vnSupplyArrivedSeries(cargoName, region)[cutoffIdx] || 0) + (vnSupplyOnTheWaySeries(cargoName, region)[cutoffIdx] || 0);
}

// On-the-way tonnage per month (2026-10-02, Mete) — the Dashboard sheet's "On the way" row, for
// EVERY month rather than just the report's own month, so Oct/Nov/Dec bookings show up too:
//   Lineup SUM tons whose "On-the-way Period" falls in that month            (otwLineup, no Region)
// + Arr Data rows dated after "as of" flagged "Scheduled -> On the way" = Yes (otwNorth/otwSouth)
// + Arr Data's not-yet-allocated "On-the-way balance" for those later rows   (otwNorth/otwSouth)
// The Lineup SUM part has no Region field, so — same as Dashboard and the old average boost — it is
// added unfiltered whatever the Region toggle says. State saved before this change (or the built-in
// seed) only has the single-month sep* fields; those are mapped onto the cutoff month so nothing
// changes until the next Excel import fills the full 12-month arrays.
function vnSupplyOnTheWaySeries(cargoName, region){
  const row = vnSupplyCargoRow(cargoName);
  const out = Array(12).fill(0);
  if (!row) return out;
  if (Array.isArray(row.otwLineup)){
    for (let i = 0; i < 12; i++){
      const n = (row.otwNorth && row.otwNorth[i]) || 0, so = (row.otwSouth && row.otwSouth[i]) || 0;
      out[i] = (row.otwLineup[i] || 0) + (region === 'North' ? n : region === 'South' ? so : n + so);
    }
    return out;
  }
  const cutoffIdx = vnSupplyCutoffMonthIdx();
  if (cutoffIdx < 0) return out;
  const syes = region === 'North' ? row.sepSyesNorth : region === 'South' ? row.sepSyesSouth : (row.sepSyesNorth || 0) + (row.sepSyesSouth || 0);
  const tbal = region === 'North' ? row.sepTbalNorth : region === 'South' ? row.sepTbalSouth : (row.sepTbalNorth || 0) + (row.sepTbalSouth || 0);
  out[cutoffIdx] = (row.sepLineup || 0) + (syes || 0) + (tbal || 0);
  return out;
}
function vnSupplyTotalSeries(cargoName, region){
  const a = vnSupplyArrivedSeries(cargoName, region), o = vnSupplyOnTheWaySeries(cargoName, region);
  return a.map((v, i) => (v || 0) + (o[i] || 0));
}
// Last month index worth offering in the Month selector: the report's own month, or later if any
// cargo already has on-the-way tonnage booked for a later month.
function vnSupplyLastMonthIdx(){
  let last = vnSupplyCutoffMonthIdx();
  vnSupplyData().cargoes.forEach(c => {
    vnSupplyOnTheWaySeries(c.name, 'All').forEach((v, i) => { if (v > 0 && i > last) last = i; });
  });
  return last;
}

function vnSupplyMonthlyAvg(cargoName, region){
  const cutoffIdx = vnSupplyCutoffMonthIdx();
  if (cutoffIdx < 0) return 0;
  const series = vnSupplyArrivedSeries(cargoName, region);
  let sum = 0;
  for (let i = 0; i < cutoffIdx; i++) sum += series[i] || 0;
  sum += vnSupplyBoostedCutoffMonthVal(cargoName, region);
  return sum / (cutoffIdx + 1);
}

function vnSupplyPeakTrough(cargoName, region){
  const series = vnSupplyArrivedSeries(cargoName, region);
  const cutoffIdx = vnSupplyCutoffMonthIdx();
  const w = series.slice(0, cutoffIdx + 1);
  if (!w.length || !w.some(v => v > 0)) return null;
  let peakI = 0, troughI = 0;
  w.forEach((v, i) => { if (v > w[peakI]) peakI = i; if (v < w[troughI]) troughI = i; });
  return { peak: MONTHS_FULL[peakI], trough: MONTHS_FULL[troughI] };
}

const VNS_SPARK_CHARS = '▁▂▃▄▅▆▇█';
function vnSupplySparkline(series, n){
  const w = series.slice(0, Math.max(0, n));
  if (!w.length || !w.some(v => v > 0)) return '';
  const max = Math.max(1, ...w);
  return w.map(v => VNS_SPARK_CHARS[Math.min(7, Math.max(0, Math.round((v || 0) / max * 7)))]).join('');
}

function vnSupplyNiceAxisTicks(maxV, targetCount){
  targetCount = targetCount || 5;
  if (maxV <= 0) return [0, 1];
  const rawStep = maxV / targetCount;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / mag;
  let niceNorm = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
  const step = niceNorm * mag;
  const top = Math.ceil(maxV / step) * step;
  const ticks = [];
  for (let v = 0; v <= top + step * 0.001; v += step) ticks.push(Math.round(v));
  return ticks;
}

// selected/previous/average KPI trio. "All" month = year-to-date-so-far: selected = sum of every
// completed month (pure Arrived, same rule as everywhere else on this tab); previous is undefined
// in that view; average becomes "expected by now" = the monthly average x number of months elapsed,
// so the YTD total has something apples-to-apples to compare against.
// 2026-10-02, Mete: `selected`/`prev` are now Arrived + On the way (the Dashboard "Total" row), with
// the two parts handed back separately (`arrived`/`onTheWay`) so the tile can show the split under
// the total — and so a future month (Oct/Nov/Dec) that has only on-the-way tonnage isn't a blank 0.
function vnSupplyKpiValues(){
  const cargo = vnSupplyUI.cargo, region = vnSupplyUI.region, month = vnSupplyUI.month;
  const arr = vnSupplyArrivedSeries(cargo, region);
  const otw = vnSupplyOnTheWaySeries(cargo, region);
  const cutoffIdx = vnSupplyCutoffMonthIdx();
  const avg = vnSupplyMonthlyAvg(cargo, region);
  const n = cutoffIdx + 1;
  if (month === 'All'){
    let a = 0, o = 0;
    for (let i = 0; i <= cutoffIdx; i++){ a += arr[i] || 0; o += otw[i] || 0; }
    return { selected: a + o, arrived: a, onTheWay: o, prev: null, avg: avg * n, isYtd: true, n };
  }
  const idx = MONTHS_FULL.indexOf(month);
  const arrived = idx >= 0 ? (arr[idx] || 0) : 0;
  const onTheWay = idx >= 0 ? (otw[idx] || 0) : 0;
  const prev = idx > 0 ? (arr[idx - 1] || 0) + (otw[idx - 1] || 0) : null;
  return { selected: arrived + onTheWay, arrived, onTheWay, prev, avg, isYtd: false, n, idx };
}

function vnSupplyMonthValue(series, month, cutoffIdx){
  if (month === 'All'){
    let v = 0; for (let i = 0; i <= cutoffIdx; i++) v += series[i] || 0; return v;
  }
  const idx = MONTHS_FULL.indexOf(month);
  return idx >= 0 ? (series[idx] || 0) : 0;
}

function vnSupplyRegionSeries(row, region){
  return region === 'North' ? row.north : region === 'South' ? row.south : row.north.map((v, i) => (v || 0) + (row.south[i] || 0));
}

// Top 4 origins + "Diger" (everything else) for the selected cargo/month/region, Arrived-only.
function vnSupplyOriginBreakdown(){
  const cargo = vnSupplyUI.cargo, region = vnSupplyUI.region, month = vnSupplyUI.month;
  const cutoffIdx = vnSupplyCutoffMonthIdx();
  const vals = vnSupplyData().origins.filter(o => o.cargo === cargo).map(o => ({
    name: o.origin, val: vnSupplyMonthValue(vnSupplyRegionSeries(o, region), month, cutoffIdx)
  })).filter(x => x.val > 0);
  vals.sort((a, b) => b.val - a.val);
  const top = vals.slice(0, 4);
  const others = vals.slice(4);
  const otherVal = others.reduce((a, x) => a + x.val, 0);
  const total = vals.reduce((a, x) => a + x.val, 0);
  return { top, otherVal, otherNames: others, total };
}

function vnSupplyTopBuyers(){
  const cargo = vnSupplyUI.cargo, region = vnSupplyUI.region, month = vnSupplyUI.month;
  const cutoffIdx = vnSupplyCutoffMonthIdx();
  const vals = vnSupplyData().buyers.filter(b => b.cargo === cargo).map(b => ({
    name: b.buyer, val: vnSupplyMonthValue(vnSupplyRegionSeries(b, region), month, cutoffIdx)
  })).filter(x => x.val > 0);
  vals.sort((a, b) => b.val - a.val);
  return vals.slice(0, 5);
}

// ---- SVG chart builders ---------------------------------------------------
function vnSupplyMainChartSvg(width, height){
  const cargo = vnSupplyUI.cargo, region = vnSupplyUI.region;
  const series = vnSupplyArrivedSeries(cargo, region);
  const otw = vnSupplyOnTheWaySeries(cargo, region);
  const avg = vnSupplyMonthlyAvg(cargo, region);
  const dataMax = Math.max(1, ...series.map((v, i) => (v || 0) + (otw[i] || 0)), avg);
  const ticks = vnSupplyNiceAxisTicks(dataMax, 5);
  const maxV = ticks[ticks.length - 1];
  const padL = 50, padR = 10, padT = 10, padB = 20;
  const w = width - padL - padR, h = height - padT - padB;
  const n = 12, gap = 8;
  const bw = Math.max(6, (w - gap * (n - 1)) / n);
  const yFor = v => padT + h - (v / maxV) * h;
  const selIdx = vnSupplyUI.month === 'All' ? -1 : MONTHS_FULL.indexOf(vnSupplyUI.month);

  let bars = '', axisLabels = '';
  for (let i = 0; i < n; i++){
    const x = padL + i * (bw + gap);
    const bh = h * ((series[i] || 0) / maxV);
    const oh = h * ((otw[i] || 0) / maxV);
    const isSel = i === selIdx;
    const tip = `${MONTHS_FULL[i]}: ${fmtVnsMT((series[i] || 0) + (otw[i] || 0))} MT — arrived ${fmtVnsMT(series[i] || 0)}, on the way ${fmtVnsMT(otw[i] || 0)}`;
    // Stacked: arrived at the bottom, on-the-way on top of it (2026-10-02).
    bars += `<rect class="vns-bar-arrived${isSel ? ' vns-bar-cur' : ''}" x="${x.toFixed(1)}" y="${(padT + h - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, bh).toFixed(1)}" rx="5"><title>${tip}</title></rect>`;
    if (oh > 0) bars += `<rect class="vns-bar-onway${isSel ? ' vns-bar-cur' : ''}" x="${x.toFixed(1)}" y="${(padT + h - bh - oh).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, oh - 2).toFixed(1)}" rx="5"><title>${tip}</title></rect>`;
    axisLabels += `<text x="${(x + bw / 2).toFixed(1)}" y="${(height - 5).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--text-dim)">${MONTHS_FULL[i]}</text>`;
  }
  let gridLines = '', yLabels = '';
  ticks.forEach(t => {
    const y = yFor(t).toFixed(1);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    yLabels += `<text x="${(padL - 6).toFixed(1)}" y="${(parseFloat(y) + 3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-dim)">${t === 0 ? '0' : fmtVnsK(t)}</text>`;
  });
  const avgY = yFor(Math.min(avg, maxV)).toFixed(1);
  const avgLine = `<line class="vns-avg-line" x1="${padL}" y1="${avgY}" x2="${width - padR}" y2="${avgY}"/>` +
    `<text x="${width - padR}" y="${(parseFloat(avgY) - 4).toFixed(1)}" text-anchor="end" font-size="10" font-weight="700" fill="var(--text-dim)">avg ${fmtVnsMT(avg)}</text>`;

  return `<svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">${gridLines}${bars}${avgLine}${axisLabels}${yLabels}</svg>`;
}

const VNS_DONUT_COLORS = ['#f2600c', '#1f9d61', '#2f6fd6', '#c9418a', '#8b8680'];   // top-4 origins + grey "Diğer"; first four validated for colour-blind separation
function vnSupplyDonutSvg(breakdown, size){
  const slices = breakdown.top.map(t => ({ name: t.name, val: t.val }));
  if (breakdown.otherVal > 0) slices.push({ name: 'Diğer', val: breakdown.otherVal });
  const total = breakdown.total || 1;
  const r = size / 2 - 12, cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * r;
  let offset = 0, circles = '';
  slices.forEach((s, i) => {
    const frac = s.val / total;
    const len = Math.max(0, frac * circumference);
    circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${VNS_DONUT_COLORS[i % VNS_DONUT_COLORS.length]}" stroke-width="24" ` +
      `stroke-dasharray="${len.toFixed(2)} ${Math.max(0, circumference - len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})">` +
      `<title>${s.name}: ${fmtVnsMT(s.val)} MT (${Math.round(frac * 100)}%)</title></circle>`;
    offset += len;
  });
  return { svg: `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}</svg>`, slices };
}

// ---- render: comparison box -------------------------------------------------
function vnSupplyComparisonBox(el){
  const k = vnSupplyKpiValues();
  const wrap = document.createElement('div');
  wrap.className = 'news-tiles';

  const deltaHtml = (curVal, refVal) => {
    if (refVal === null || refVal === undefined || !refVal){
      return `<div class="vns-tile-delta" style="color:var(--text-dim);">—</div>`;
    }
    const pct = (curVal - refVal) / refVal * 100;
    const cls = pct >= 0 ? 'pos' : 'neg';
    const sign = pct >= 0 ? '+' : '';
    return `<div class="vns-tile-delta delta-inline ${cls}">${sign}${pct.toFixed(1)}%</div>`;
  };

  const tile1 = document.createElement('div');
  tile1.className = 'news-tile';
  tile1.innerHTML = `<div class="news-tile-head"><span class="news-tile-name">${k.isYtd ? 'YEAR TO DATE' : 'SELECTED MONTH'}</span></div>` +
    `<div class="news-tile-val">${fmtVnsMT(k.selected)}</div><div class="news-tile-sub">${vnSupplyUI.cargo} · MT · ${vnSupplyUI.region}</div>` +
    `<div class="vns-split"><span>Arrived</span><b class="vns-cell-arrived">${fmtVnsMT(k.arrived)}</b></div>` +
    `<div class="vns-split"><span>On the way</span><b class="vns-cell-onway${k.onTheWay ? '' : ' zero'}">${fmtVnsMT(k.onTheWay)}</b></div>`;
  wrap.appendChild(tile1);

  const tile2 = document.createElement('div');
  tile2.className = 'news-tile';
  tile2.innerHTML = `<div class="news-tile-head"><span class="news-tile-name">${k.isYtd ? '—' : 'PREVIOUS MONTH'}</span></div>` +
    `<div class="news-tile-val">${k.prev === null ? '—' : fmtVnsMT(k.prev)}</div>` + deltaHtml(k.selected, k.prev);
  wrap.appendChild(tile2);

  const tile3 = document.createElement('div');
  tile3.className = 'news-tile';
  tile3.innerHTML = `<div class="news-tile-head"><span class="news-tile-name">${k.isYtd ? `EXPECTED (AVG × ${k.n})` : 'MONTHLY AVERAGE'}</span></div>` +
    `<div class="news-tile-val">${fmtVnsMT(k.avg)}</div>` + deltaHtml(k.selected, k.avg);
  wrap.appendChild(tile3);

  el.appendChild(wrap);
}

// ---- render: main chart -----------------------------------------------------
function vnSupplyMainChartSection(el){
  const wrap = document.createElement('div');
  wrap.className = 'vns-chart-card';
  const avg = vnSupplyMonthlyAvg(vnSupplyUI.cargo, vnSupplyUI.region);
  const title = document.createElement('div');
  title.className = 'vns-chart-title';
